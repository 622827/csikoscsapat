<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003366">
<title>Skillek · Csikós csapat</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  SKILLEK (Development center) – a teljes szakmát lefedő gyakorló app váza.
  - Hozzáférés és azonosítás: a csapat Google-belépése (auth.js, Felhasználók fehérlista). Vezetői nézet: #admin (csak adminnak).
  - Adatok: Firestore gy_users/<e-mail>, hibásnak jelölt kérdések: gy_reports/<id>. Szabályok: firestore-szabalyok-gyakorlo.txt
  - Tartalom (1. kör): az MNB vizsga-kérdésbankok (kerdesbank-*.json). Formátum: { s:[fejezet], t:[[fejezet, téma]], q:[[fejezet, téma, kérdés, [válaszok], helyes]] }.
  - Mechanika: ösvény (fejezet → téma → leckék), feleletválasztós / igaz-hamis / párosítás, XP, napi cél,
    sorozat (csak munkanapok számítanak), célzott ismétlés a hibákból. Nincs élet- vagy energiarendszer.
-->
<style>
:root {
  --bg: #f4f7fb; --surface: #ffffff; --ink: #003366; --muted: #4d6f94; --line: #dfe7f0;
  --brand: #003366; --on-brand: #fff; --hot: #cc0066; --hot-bg: #ffe6f2; --ok: #00806f; --ok-bg: #dff5f1;
  --sky: #6699cc; --gold: #e0a100; --track: #e5ebf2; --shadow: 0 1px 2px rgba(0,40,80,.06), 0 8px 24px rgba(0,40,80,.08);
  --r: 18px; --safe-b: env(safe-area-inset-bottom, 0px); --tc: #003366;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #001a33; --surface: #002547; --ink: #f2f7ff; --muted: #8fb0d6; --line: #0d3a66; --brand: #ff99cc; --on-brand: #001f3d;
    --hot: #ff7ab6; --hot-bg: #3a0a2a; --ok: #5fd6c4; --ok-bg: #063a3a; --sky: #6699cc; --track: #0b355e; --shadow: 0 8px 24px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.4; min-height: 100vh; }
button { font: inherit; color: inherit; }
.wrap { max-width: 600px; margin: 0 auto; padding: 12px 16px calc(28px + var(--safe-b)); }
body.has-nav .wrap { padding-bottom: calc(96px + var(--safe-b)); }
body.wide .wrap, body.wide .top .in { max-width: 1000px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top .in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: .95rem; white-space: nowrap; border: 0; }
.chip.streak .i { stroke: var(--hot); fill: var(--hot); } .chip.xp .i { stroke: var(--sky); fill: var(--sky); }
.chip.off { opacity: .55; filter: grayscale(1); }
button.chip { cursor: pointer; }
.chip.track { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
.chip.track::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: none; }
.sp { flex: 1; }
/* Skillválasztó (mint a Duolingóban a nyelvzászló) */
.sk { flex: none; display: inline-grid; place-items: center; width: 30px; height: 24px; border-radius: 7px; color: #fff; font-size: .72rem; font-weight: 800; letter-spacing: .02em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.sk.big { width: 46px; height: 36px; border-radius: 10px; font-size: .95rem; }
.sk.plus { background: var(--track); color: var(--muted); font-size: 1.4rem; box-shadow: inset 0 -3px 0 var(--line); }
.skchip { padding: 5px 10px 5px 6px; max-width: 58vw; }
.skchip .skn { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .skchip .skn { display: none; } }
.skpop { position: fixed; z-index: 50; top: 58px; left: 0; right: 0; pointer-events: none; }
.skpop .in { pointer-events: auto; max-width: 360px; margin-left: max(12px, calc((100vw - 600px) / 2 + 12px)); margin-right: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: 0 16px 40px rgba(0,30,60,.2); animation: fade .18s ease; }
.skh { font-size: .75rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 2px 6px 8px; }
.skrow { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid transparent; background: none; border-radius: 14px; padding: 9px 10px; cursor: pointer; line-height: 1.25; }
.skrow:hover { background: var(--bg); }
.skrow.on { border-color: var(--line); background: var(--bg); }
.skrow > span:nth-child(2) { flex: 1; }
.skrow.add { border-top: 2px solid var(--line); border-radius: 0 0 12px 12px; margin-top: 6px; padding-top: 12px; }
.opts .skrow { border: 2px solid var(--line); background: var(--surface); box-shadow: 0 3px 0 var(--line); padding: 14px; }
.iconbtn { border: 0; background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; flex: none; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; font-weight: 700; font-size: 1.05rem; padding: 15px 18px; border-radius: 14px;
  background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 70%, #000); transition: transform .08s, box-shadow .08s, opacity .2s; width: 100%; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--brand) 70%, #000); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 65%, #000); }
.btn.hot { background: var(--hot); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--hot) 65%, #000); }
.btn.sm { font-size: .9rem; padding: 9px 12px; width: auto; border-radius: 11px; }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px; font-size: .88rem; }
h1 { font-size: 1.6rem; letter-spacing: -.02em; line-height: 1.15; margin: 6px 0 4px; }
h2 { font-size: 1.1rem; margin: 24px 0 10px; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
input[type=text] { width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }

/* Kezdőlap */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.ring { width: 78px; height: 78px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .bg { stroke: var(--track); } .ring .fg { stroke: var(--ok); transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .8rem; text-align: center; line-height: 1.1; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.qb { border: 0; text-align: left; cursor: pointer; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 14px; display: grid; gap: 4px; position: relative; }
.qb:active { transform: scale(.97); }
.qb .i { width: 26px; height: 26px; stroke: var(--brand); }
.qb b { font-size: 1rem; } .qb span { font-size: .82rem; color: var(--muted); }
.qb .badge { position: absolute; top: 10px; right: 10px; background: var(--hot); color: #fff; font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; }

/* Ösvény */
.sec { margin-top: 26px; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--tc); color: #fff; position: sticky; top: 62px; z-index: 5; }
.sec-h b { font-size: 1rem; line-height: 1.2; } .sec-h span { font-size: .8rem; opacity: .85; white-space: nowrap; }
.path { padding: 10px 0 4px; }
.node { --x: 0px; display: flex; flex-direction: column; align-items: center; margin: 40px auto 18px; transform: translateX(var(--x)); width: 220px; position: relative; }
.node button.nb { width: 72px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: var(--tc); color: #fff; position: relative;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--tc) 60%, #000); transition: transform .1s; }
.node button.nb:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--tc) 60%, #000); }
.node button.nb .i { width: 30px; height: 30px; stroke-width: 2.4; }
.node.locked button.nb { background: var(--track); color: var(--muted); box-shadow: 0 6px 0 var(--line); }
.node.done button.nb { background: var(--gold); box-shadow: 0 6px 0 color-mix(in srgb, var(--gold) 60%, #000); }
.node.next button.nb { animation: pulse 1.8s infinite; }
.node .pr { position: absolute; inset: -7px; width: 86px; height: 82px; margin: auto; pointer-events: none; }
.node .pr circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.node small { margin-top: 10px; font-size: .78rem; font-weight: 600; text-align: center; color: var(--muted); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.node .start { position: absolute; top: -36px; background: var(--surface); color: var(--tc); border: 2px solid var(--line); font-weight: 800; font-size: .8rem; padding: 4px 10px; border-radius: 10px; letter-spacing: .04em; animation: bob 1.6s ease-in-out infinite; white-space: nowrap; }
@keyframes pulse { 0%,100% { outline: 0 solid color-mix(in srgb, var(--tc) 35%, transparent); } 50% { outline: 10px solid color-mix(in srgb, var(--tc) 0%, transparent); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* Lap (bottom sheet) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,20,40,.35); z-index: 40; display: none; }
.sheet-bg.show { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.sheet.show { transform: none; }
.sheet .in { max-width: 600px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); box-shadow: 0 -8px 30px rgba(0,30,60,.18); }
.sheet .bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; margin: 10px 0 14px; } .sheet .bar i { display: block; height: 100%; background: var(--tc); }
.sheet .row { display: flex; gap: 10px; margin-top: 10px; }

/* Lecke */
.prog { height: 14px; background: var(--track); border-radius: 99px; overflow: hidden; flex: 1; }
.prog i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.combo { font-weight: 800; color: var(--gold); font-size: .85rem; min-width: 0; white-space: nowrap; }
.lesson { min-height: calc(100vh - 160px); display: flex; flex-direction: column; padding-bottom: 150px; }
.kind { font-size: .78rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--hot); margin: 18px 0 6px; display: flex; gap: 6px; align-items: center; }
.qtext { font-size: 1.2rem; font-weight: 700; line-height: 1.35; margin: 0 0 16px; }
.stmt { border-left: 4px solid var(--sky); background: var(--surface); border-radius: 0 14px 14px 0; padding: 12px 14px; margin: 0 0 16px; box-shadow: var(--shadow); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s; display: flex; gap: 10px; align-items: flex-start; line-height: 1.35; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.opt.sel { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 12%, var(--surface)); box-shadow: 0 3px 0 var(--sky); }
.opt.sel .k { border-color: var(--sky); color: var(--sky); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--hot); background: var(--hot-bg); box-shadow: 0 3px 0 var(--hot); }
.opt[disabled] { cursor: default; }
.tf { grid-template-columns: 1fr 1fr; }
.tf .opt { justify-content: center; font-weight: 700; font-size: 1.05rem; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.match .opt { font-size: .9rem; padding: 10px 11px; min-height: 64px; }
.match .opt.gone { opacity: .35; pointer-events: none; border-color: var(--ok); box-shadow: none; }
.match .opt.bad { animation: shake .35s; border-color: var(--hot); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: 2px solid var(--line); background: var(--bg); transition: background .2s; }
.foot .in { max-width: 600px; margin: 0 auto; padding: 14px 16px calc(14px + var(--safe-b)); }
.foot.good { background: var(--ok-bg); border-color: transparent; } .foot.bad { background: var(--hot-bg); border-color: transparent; }
.fb { display: none; margin-bottom: 12px; }
.foot.good .fb, .foot.bad .fb { display: block; }
.fb b { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.foot.good .fb b { color: var(--ok); } .foot.bad .fb b { color: var(--hot); }
.fb p { margin: 6px 0 0; font-size: .95rem; }
.fb .tools { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* Eredmény */
.res { text-align: center; padding-top: 24px; }
.res .big { font-size: 2rem; font-weight: 800; margin: 10px 0 4px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
.stat { border-radius: 16px; border: 2px solid var(--line); overflow: hidden; background: var(--surface); }
.stat span { display: block; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 6px; color: #fff; }
.stat b { display: block; font-size: 1.35rem; padding: 10px 4px; }

/* Profil, admin */
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kv .card b { display: block; font-size: 1.4rem; } .kv .card span { font-size: .82rem; color: var(--muted); }
.goals { display: flex; gap: 8px; flex-wrap: wrap; }
.goals button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; cursor: pointer; font-weight: 700; }
.goals button.on { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.week { display: flex; gap: 6px; align-items: flex-end; height: 90px; margin-top: 8px; }
.week div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); height: 100%; justify-content: flex-end; }
.week i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: var(--sky); min-height: 3px; }
.week .today i { background: var(--ok); }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table.t td.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.tabs { display: flex; gap: 8px; margin: 10px 0 14px; flex-wrap: wrap; }
.tabs button { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.tabs button.on { background: var(--brand); color: var(--on-brand); }

/* Alsó menü */
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 2px solid var(--line); }
.bnav .in { max-width: 600px; margin: 0 auto; display: flex; padding: 6px 8px calc(6px + var(--safe-b)); }
.bnav button { flex: 1; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 6px; border-radius: 12px; color: var(--muted); font-size: .75rem; font-weight: 700; }
.bnav button .i { width: 24px; height: 24px; }
.bnav button.on { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }

.modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,20,40,.45); display: none; place-items: center; padding: 16px; }
.modal.show { display: grid; }
.modal .box { background: var(--surface); border-radius: 20px; padding: 18px; width: 100%; max-width: 440px; max-height: 86vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 70; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="in" id="topin"></div></header>
<main class="wrap" id="view"></main>
<nav class="bnav" id="bnav" hidden></nav>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
(function () {
"use strict";

/* ===================== Beállítások ===================== */
var FBV = "https://www.gstatic.com/firebasejs/10.14.1/";
var LESSON_LEN = 8;                // kérdés / lecke
/* Skillek (mint a Duolingóban a nyelvek). Újat itt kell felvenni; a munkatárs maga adja hozzá a sajátjaihoz. */
var TRACKS = [
  { id: "penzugyi", f: "kerdesbank-penzugyi.json", n: "Pénzügyi közvetítői", ab: "PK", d: "MNB vizsga-kérdésbank", c: "#cc0066" },
  { id: "biztositas", f: "kerdesbank-biztositas.json", n: "Biztosításközvetítői", ab: "BK", d: "MNB vizsga-kérdésbank", c: "#2f6db3" },
  { id: "tokepiaci", f: "kerdesbank-tokepiaci.json", n: "Tőkepiaci", ab: "TP", d: "MNB vizsga-kérdésbank", c: "#00806f" }
];
function isSkill(id) { return TRACKS.some(function (t) { return t.id === id; }); }
function mySkills(u) { u = u || S.me; return (u.my || []).filter(isSkill); }
var GOALS = [[10, "Laza"], [20, "Normál"], [30, "Komoly"], [50, "Intenzív"]];
var SRS = [1, 3, 7, 14];           // ismétlési időközök (nap)

/* ===================== Segédek ===================== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function addDays(s, n) { var p = s.split("-"); return dstr(new Date(+p[0], +p[1] - 1, +p[2] + n)); }
function uidOf(name) { return "u_" + String(name).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

/* Típusok: mc (feleletválasztás), tf (igaz/hamis: ez a helyes válasz?), match (3 kérdés párosítása a helyes válaszokkal). */
function itemsFrom(B, qis, opt) {
  opt = opt || {};
  var items = [], pool = qis.slice();
  if (!opt.mcOnly) {
    var shortQ = pool.filter(function (qi) { var q = B.q[qi]; return q[2].length <= 120 && q[3][q[4]].length <= 90; });
    if (shortQ.length >= 3 && pool.length >= 6 && Math.random() < .7) {
      var m = shuffle(shortQ).slice(0, 3); pool = pool.filter(function (qi) { return m.indexOf(qi) < 0; });
      items.push({ type: "match", qis: m });
    }
  }
  pool.forEach(function (qi) {
    var q = B.q[qi], r = Math.random();
    if (!opt.mcOnly && r < .22 && q[3].length >= 2) {
      var right = Math.random() < .5, wrongs = q[3].map(function (_, k) { return k; }).filter(function (k) { return k !== q[4]; });
      items.push({ type: "tf", qi: qi, show: right ? q[4] : wrongs[Math.floor(Math.random() * wrongs.length)] });
    } else items.push({ type: "mc", qi: qi });
  });
  items = shuffle(items);
  return items;
}

var L = null;

    Lesson.start(B, itemsFrom(B, qs), { kind: "topic", t: t, title: cleanTitle(t.title) });
  },
  practice: function (B, t) {

    var rest = shuffle(t.qs.filter(function (qi) { return weakIn.indexOf(qi) < 0 && !S.me.known[qkey(B.id, qi)]; }));

  },
  mixed: function (B) {

  },

        var ql = +a.getAttribute("data-l"), qr = +b.getAttribute("data-r");

        if (Object.keys(it.matched).length === it.qis.length) {

    chk.onclick = function () {

      var first = !L.seen[it.qi]; L.seen[it.qi] = 1;

        else L.ok++; }

  mark: function (qi, ok) {

    view('<div class="card"><h1>' + esc(u.name) + '</h1><div class="muted small">Szint: ' + (Math.floor(Math.sqrt(u.xp / 40)) + 1) + '</div></div>' +
      '<h2>Statisztika</h2><div class="kv">' +
      '<div class="card"><b>' + liveStreak() + '</b><span>napos sorozat (rekord: ' + (u.best || 0) + ')</span></div>' +
      '<div class="card"><b>' + u.xp + '</b><span>összes XP</span></div>' +
      '<div class="card"><b>' + u.lessons + '</b><span>lecke</span></div>' +
      '<div class="card"><b>' + (u.perfect || 0) + '</b><span>hibátlan lecke</span></div></div>' +
      '<h2>Az elmúlt 7 nap</h2><div class="card"><div class="week">' + days.map(function (x) { var p = x[0].split("-"); var wd = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
        return '<div class="' + (x[0] === today() ? "today" : "") + '"><b style="color:var(--ink)">' + (x[1] || "") + '</b><i style="height:' + Math.round(60 * x[1] / mx) + 'px"></i>' + DN[wd] + '</div>'; }).join("") + '</div></div>' +
      (acc ? '<h2>Pontosság pályánként</h2><div class="card"><table class="t"><tr><th>Pálya</th><th class="n">Válasz</th><th class="n">Jó</th></tr>' + acc + '</table></div>' : "") +
      '<h2>Napi cél</h2><div class="card"><div class="goals">' + GOALS.map(function (g) { return '<button data-g="' + g[0] + '" class="' + (g[0] === (u.goal || 20) ? "on" : "") + '">' + g[1] + ' · ' + g[0] + ' XP</button>'; }).join("") + '</div>' +
      '<p class="muted small" style="margin-bottom:0">Egy lecke 10 XP, hibátlanul 15.</p></div>' +
      '<h2>Beállítások</h2><div class="card"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="snd"' + (FX.on ? " checked" : "") + '> Hangeffektek</label>' +
      '<p class="muted small">Kihagyott kérdések („ezt már tudom”): ' + Object.keys(u.known || {}).length + (Object.keys(u.known || {}).length ? ' · <button class="link" id="unk">visszaállítás</button>' : "") + '</p>' +
      '<p class="muted small">Belépve: ' + esc(u.email || "") + '</p><button class="btn ghost sm" id="chg">Kilépés</button></div>');
    $$("[data-g]").forEach(function (b) { b.onclick = function () { u.goal = +b.getAttribute("data-g"); saveMe(); Profile.open(); }; });
    $("#snd").onchange = function () { FX.on = this.checked; LS.set("gy_sound", FX.on); };
    var un = $("#unk"); if (un) un.onclick = function () { if (confirm("Visszaállítod az összes kihagyott kérdést?")) { u.known = {}; saveMe(); Profile.open(); } };
    $("#chg").onclick = function () { var C = window.CSK; if (C && C.signOut) C.signOut().then(function () { location.reload(); }); else location.reload(); };
  }
};

/* ===================== Vezetői nézet ===================== */
var Admin = {
  tab: "users",
  open: function () {
    document.body.classList.add("wide"); nav(null); setTc(null);
    topbar("plain", { title: "Skillek · vezetői nézet", right: '<button class="btn sm" id="ad-me">' + IC.path + 'Gyakorlok</button>' });
    $("#ad-me").onclick = function () {
      if (EMBED) { try { window.top.location.href = "gyakorlo.html"; return; } catch (e) {} }
      history.replaceState(null, "", location.pathname + location.search); if (S.me) Home.open(); else who(); };
    view('<div id="ad-menu"></div><div class="tabs"><button data-tab="users">Munkatársak</button><button data-tab="reports">Hibásnak jelölt kérdések</button></div><div id="ad-body" class="card"><div class="muted">Betöltés…</div></div>' +
      (EMBED ? "" : '<p><a class="btn ghost sm" href="admin.html#gyakorlo">' + IC.back + 'Vissza az adminba</a></p>') + '<p class="muted small">A munkatársak a főmenü Development center → Skillek pontjából, Google-belépéssel érik el. A régi kifogáskezelő (<code>kifogas.html</code>) érintetlenül megmaradt a repóban.</p>');
    $$("[data-tab]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === Admin.tab); b.onclick = function () { Admin.tab = b.getAttribute("data-tab"); Admin.open(); }; });
    if (Admin.tab === "users") Admin.users(); else Admin.reports();
    Admin.menuCheck();
  },
  /* Főmenü: „Development center” lenyíló (Vizsga gyakorló + Skillek). Az oldaltérképet (config/sitemap) írja,
     ugyanabban a formában, mint az admin Oldaltérkép csempéje; utána ott tovább húzogatható. */
  menuCheck: function () {
    var ACC = ["bl", "gts"];   // egyelőre csak BL és GST (az admin mindig)
    var box = $("#ad-menu"); if (!box) return;
    fb().then(function () { return FB.F.getDoc(FB.F.doc(FB.db, "config", "sitemap")); }).then(function (s) {
      var m = s.exists() && s.data().json ? JSON.parse(s.data().json) : null;
      if (!m || !m.items) return;
      var it = m.items, has = function (id) { return it.some(function (x) { return x.id === id; }); };
      if (has("dev") && it.some(function (x) { return x.href === "gyakorlo.html"; })) return;
      box.innerHTML = '<div class="card" style="margin-bottom:14px;border:2px solid var(--gold)"><b>A főmenüben még nincs „Development center”.</b>' +
        '<p class="muted small">Egy kattintással létrehozom a lenyíló menüt a Vizsga gyakorló helyén, alatta: Vizsga gyakorló, Skillek. A Skillek oldalt egyelőre csak a BL-ek és a GST-k nyithatják meg (és az admin). Utána az Oldaltérkép csempén tovább alakítható.</p>' +
        '<button class="btn sm" id="ad-mk">Development center létrehozása</button></div>';
      postH();
      $("#ad-mk").onclick = function () {
        var vi = -1; it.forEach(function (x, i) { if (x.href === "vizsga.html" && vi < 0) vi = i; });
        if (!has("dev")) { var dev = { id: "dev", title: "Development center", href: "", parent: "menu", menu: "show", access: ACC }; if (vi >= 0) it.splice(vi, 0, dev); else it.push(dev); }
        it.forEach(function (x) { if (x.href === "vizsga.html") x.parent = "dev"; });
        if (!it.some(function (x) { return x.href === "gyakorlo.html"; })) {
          var at = -1; it.forEach(function (x, i) { if (x.parent === "dev") at = i; });
          var sk = { id: "skill", title: "Skillek", href: "gyakorlo.html", parent: "dev", menu: "show", access: ACC };
          if (at >= 0) it.splice(at + 1, 0, sk); else it.push(sk);
        }
        FB.F.setDoc(FB.F.doc(FB.db, "config", "sitemap"), { json: JSON.stringify({ v: m.v || 1, items: it }), upd: new Date().toISOString() })
          .then(function () { box.innerHTML = '<div class="card" style="margin-bottom:14px"><b>Kész.</b> A főmenüben megjelent a Development center (frissítés után látszik).</div>'; postH(); })
          .catch(function (e) { toast("Nem sikerült menteni: " + (e && e.code || e)); });
      };
    }).catch(function () {});
  },
  users: function () {
    allOf("gy_users").then(function (us) {
      us.sort(function (a, b) { return (b.xp || 0) - (a.xp || 0); });
      var wk = (function () { var d = new Date(), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return dstr(d); })();
      $("#ad-body").innerHTML = us.length ? '<div class="scroll"><table class="t"><tr><th>Név</th><th>Skillek</th><th class="n">XP</th><th class="n">Heti XP</th><th class="n">Sorozat</th><th class="n">Lecke</th><th class="n">Pontosság</th><th class="n">Ismétlésre vár</th><th>Utoljára</th></tr>' +
        us.map(function (u) { var a = 0, o = 0; Object.keys(u.st || {}).forEach(function (k) { a += u.st[k].a; o += u.st[k].o; });
          var w = 0; Object.keys(u.days || {}).forEach(function (d) { if (d >= wk) w += u.days[d]; });
          return '<tr><td>' + esc(u.name) + (u.email ? '<br><span class="muted small">' + esc(u.email) + '</span>' : "") + '</td><td style="white-space:nowrap">' + mySkills(u).map(function (id) { var t = trackById(id); return '<span title="' + esc(t.n) + '">' + skillBadge(t) + '</span>'; }).join(" ") + '</td><td class="n">' + (u.xp || 0) + '</td><td class="n">' + w + '</td><td class="n">' + liveStreak(u) + '</td><td class="n">' + (u.lessons || 0) + '</td><td class="n">' + (a ? Math.round(100 * o / a) + "%" : "–") + '</td><td class="n">' + Object.keys(u.weak || {}).length + '</td><td>' + esc(u.lastDay || "–") + '</td></tr>'; }).join("") +
        '</table></div>' : '<div class="muted">Még senki nem gyakorolt.</div>';
      postH();
    }).catch(function () { $("#ad-body").innerHTML = '<div class="muted">Nem sikerült betölteni.</div>'; postH(); });
  },
  reports: function () {
    allOf("gy_reports").then(function (rs) {
      rs.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
      $("#ad-body").innerHTML = rs.length ? '<div class="scroll"><table class="t"><tr><th>Pálya</th><th>Kérdés</th><th>Probléma</th><th>Ki jelezte</th><th></th></tr>' +
        rs.map(function (r) { return '<tr><td>' + esc(trackById(r.tr).n) + ' #' + r.qi + '</td><td>' + esc(r.q) + '</td><td>' + esc(r.why) + '</td><td>' + esc(r.by) + '</td><td><button class="btn ghost sm" data-del="' + esc(r._id) + '">Kész</button></td></tr>'; }).join("") +
        '</table></div>' : '<div class="muted">Nincs jelzett kérdés.</div>';
      postH();
      $$("[data-del]").forEach(function (b) { b.onclick = function () { fb().then(function () { return FB.F.deleteDoc(dref("gy_reports", b.getAttribute("data-del"))); }).then(Admin.reports); }; });
    }).catch(function () { $("#ad-body").innerHTML = '<div class="muted">Nem sikerült betölteni.</div>'; });
  }
};

/* Beágyazva (admin iframe): a magasságot a szülő állítja be az üzenetünk alapján. */
var EMBED = window.parent !== window;
function postH() { if (EMBED) setTimeout(function () { try { parent.postMessage({ embh: document.documentElement.scrollHeight }, location.origin); } catch (e) {} }, 60); }
window.addEventListener("hashchange", function () { if (location.hash === "#admin" && S.admin) Admin.open(); });
boot();
})();
</script>
</body>
</html>
