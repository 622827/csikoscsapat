<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vault</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="auth.js?v=10"></script>
<style>
  :root {
    --bg0: #1a0b0d; --bg1: #3a1519; --bg2: #5a2228;
    --glow: #ffb59a; --warm: #ff8f7a; --accent1: #ff9e8a; --accent2: #f0645e;
    --ink: #f6e6e1; --muted: rgba(246, 230, 225, .55); --faint: rgba(246, 230, 225, .32);
    --glass: rgba(70, 28, 32, .42); --line: rgba(255, 210, 200, .12);
    --lit: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { overflow-x: hidden; background: var(--bg0); }
  body {
    min-height: 100dvh; overflow-x: hidden; color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: radial-gradient(120% 90% at 22% 38%, var(--bg2) 0%, var(--bg1) 42%, var(--bg0) 100%) fixed;
    transition: filter .7s ease;
  }
  body.off { filter: brightness(.42) saturate(.75); }
  body.off .card { filter: brightness(1.6); }

  /* lebegő fényfoltok */
  .bokeh { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bokeh i { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 190, 170, .55), rgba(255, 190, 170, 0) 70%); filter: blur(1px); animation: drift linear infinite; opacity: calc(.55 * var(--lit)); transition: opacity .7s; }
  @keyframes drift { from { transform: translateY(20px); } to { transform: translateY(-40px); } }
  .ring { position: fixed; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; border: 2px solid rgba(255, 200, 185, .18); pointer-events: none; }

  .stage { position: relative; overflow: hidden; min-height: 100dvh; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 24px; max-width: 1180px; margin: 0 auto; padding: 32px 40px; }

  /* lámpa */
  .lampwrap { position: relative; height: min(78vh, 640px); display: flex; justify-content: center; }
  .cone { position: absolute; top: 25%; left: 50%; width: 140%; height: 85%; transform: translateX(-50%); background: radial-gradient(60% 80% at 50% 0%, rgba(255, 180, 150, .38), rgba(255, 150, 130, .10) 55%, rgba(0, 0, 0, 0) 75%); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); opacity: var(--lit); transition: opacity .7s; pointer-events: none; }
  .halo { position: absolute; top: 4%; left: 50%; width: 360px; height: 260px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255, 190, 160, .45), rgba(255, 190, 160, 0)); opacity: var(--lit); transition: opacity .7s; pointer-events: none; }
  svg.lamp { position: relative; height: 100%; width: auto; overflow: visible; }
  .shade-lit { opacity: var(--lit); transition: opacity .7s; }
  .chain { cursor: grab; }
  .chain:active { cursor: grabbing; }
  .chain:focus { outline: none; }
  .chain:focus-visible circle { stroke: #fff; stroke-width: 2; }
  .chain g { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
  .chain.pull g { transform: translateY(26px); transition: transform .12s ease-out; }
  .hint { position: absolute; left: calc(50% + 70px); top: 47%; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); white-space: nowrap; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .hint::before { content: ""; width: 26px; height: 1px; background: var(--faint); }

  /* kártya */
  .card { position: relative; width: 100%; max-width: 440px; justify-self: center; padding: 26px 30px 22px; border-radius: 22px; background: linear-gradient(160deg, rgba(110, 45, 50, .45), var(--glass)); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 230, 220, .08); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: filter .7s; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: rgba(255, 200, 185, .08); border: 1px solid var(--line); }
  .brand { font-size: 11px; font-weight: 600; letter-spacing: .24em; color: var(--muted); }
  .pill { margin-left: auto; font-size: 9px; font-weight: 600; letter-spacing: .18em; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 6px var(--warm); transition: .4s; }
  body.off .pill::before { background: #6b4a4a; box-shadow: none; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.08; margin: 0 0 24px; letter-spacing: -.01em; }
  h1 em { display: block; color: var(--accent1); }
  label.l { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .2em; color: var(--faint); margin: 0 0 7px; text-transform: uppercase; }
  .field { position: relative; margin-bottom: 16px; }
  .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--faint); fill: none; stroke-width: 1.7; }
  .field input { width: 100%; height: 44px; padding: 0 42px 0 40px; border-radius: 11px; border: 1px solid var(--line); background: rgba(20, 6, 8, .38); color: var(--ink); font: 400 14px Inter, sans-serif; outline: none; transition: border-color .2s, box-shadow .2s; }
  .field input::placeholder { color: var(--faint); }
  .field input:focus { border-color: rgba(255, 158, 138, .55); box-shadow: 0 0 0 3px rgba(255, 158, 138, .12); }
  .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; padding: 6px; cursor: pointer; }
  .eye svg { position: static; transform: none; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 18px; font-size: 12.5px; }
  .tgl { display: flex; align-items: center; gap: 9px; color: var(--muted); cursor: pointer; user-select: none; }
  .tgl input { display: none; }
  .tgl span { width: 32px; height: 18px; border-radius: 999px; background: rgba(255, 200, 185, .14); position: relative; transition: .25s; }
  .tgl span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .25s; }
  .tgl input:checked + span { background: linear-gradient(90deg, var(--accent1), var(--accent2)); }
  .tgl input:checked + span::after { left: 16px; }
  a, .lnk { color: var(--ink); text-decoration: none; font-weight: 500; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
  a:hover, .lnk:hover { text-decoration: underline; }
  .go { width: 100%; height: 46px; border: 0; border-radius: 12px; cursor: pointer; font: 600 14px Inter, sans-serif; color: #3a0f12; background: linear-gradient(90deg, var(--accent1), var(--accent2)); box-shadow: 0 10px 30px rgba(240, 100, 94, .35); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, box-shadow .2s, filter .2s; }
  .go:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(240, 100, 94, .45); }
  .go:active { transform: translateY(0); }
  .go[disabled] { filter: grayscale(.4) brightness(.85); cursor: wait; }
  .or { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px; font-size: 9.5px; letter-spacing: .22em; color: var(--faint); text-transform: uppercase; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .soc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .soc button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(20, 6, 8, .32); color: var(--ink); font: 500 12.5px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; transition: background .2s, border-color .2s; }
  .soc button:hover { background: rgba(255, 200, 185, .08); border-color: rgba(255, 210, 200, .24); }
  .soc svg { width: 14px; height: 14px; }
  .foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }
  .foot small { display: block; margin-top: 6px; font-size: 10.5px; color: var(--faint); }

  .msg { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; background: rgba(40, 12, 15, .92); border: 1px solid var(--line); color: var(--ink); padding: 11px 16px; border-radius: 11px; font-size: 13px; max-width: 90vw; transition: .3s; z-index: 10; pointer-events: none; }
  .msg.on { opacity: 1; transform: translate(-50%, 0); }

  /* belépés után */
  .inside { display: none; text-align: center; }
  body.in .form { display: none; }
  body.in .inside { display: block; }
  .inside p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }

  @media (max-width: 860px) {
    .stage { grid-template-columns: 1fr; padding: 18px 18px 40px; gap: 0; }
    .lampwrap { height: 300px; }
    .hint { left: auto; right: calc(50% + 34px); top: 46%; }
    .hint::before { display: none; }
    .card { padding: 22px 20px 18px; }
    h1 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bokeh" id="bokeh"></div>
<div class="ring"></div>

<main class="stage">
  <div class="lampwrap">
    <div class="halo"></div>
    <div class="cone"></div>
    <svg class="lamp" viewBox="0 0 300 640" aria-label="Állólámpa – a zsinór meghúzásával fel- és lekapcsolható">
      <defs>
        <linearGradient id="shOff" x1="0" x2="1"><stop offset="0" stop-color="#6e3a38"/><stop offset=".5" stop-color="#8a4d48"/><stop offset="1" stop-color="#5a2e2d"/></linearGradient>
        <linearGradient id="shOn" x1="0" x2="1"><stop offset="0" stop-color="#e9958a"/><stop offset=".5" stop-color="#ffc2b1"/><stop offset="1" stop-color="#d97c72"/></linearGradient>
        <linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#7a5a2c"/><stop offset=".45" stop-color="#d8b26a"/><stop offset="1" stop-color="#6b4c22"/></linearGradient>
        <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#4a2516"/><stop offset=".5" stop-color="#8a4a2c"/><stop offset="1" stop-color="#3e1f12"/></linearGradient>
        <radialGradient id="bulb"><stop offset="0" stop-color="#fff4e6"/><stop offset=".6" stop-color="#ffd2b8"/><stop offset="1" stop-color="#ffb59a" stop-opacity="0"/></radialGradient>
        <pattern id="pleat" width="9" height="10" patternUnits="userSpaceOnUse"><rect width="9" height="10" fill="none"/><line x1="0" y1="0" x2="0" y2="10" stroke="rgba(80,20,20,.28)" stroke-width="1.4"/></pattern>
      </defs>
      <!-- finial -->
      <rect x="147" y="2" width="6" height="14" rx="2" fill="url(#brass)"/>
      <!-- ernyő -->
      <path d="M95 22 H205 L248 140 H52 Z" fill="url(#shOff)"/>
      <path class="shade-lit" d="M95 22 H205 L248 140 H52 Z" fill="url(#shOn)"/>
      <path d="M95 22 H205 L248 140 H52 Z" fill="url(#pleat)"/>
      <path d="M95 22 H205" stroke="#c98d80" stroke-width="3" stroke-linecap="round"/>
      <path d="M52 140 H248" stroke="#c98d80" stroke-width="5" stroke-linecap="round"/>
      <ellipse class="shade-lit" cx="150" cy="142" rx="92" ry="9" fill="url(#bulb)"/>
      <!-- foglalat és rúd -->
      <rect x="140" y="140" width="20" height="22" rx="4" fill="url(#brass)"/>
      <rect x="146" y="160" width="8" height="300" fill="url(#brass)"/>
      <rect x="139" y="300" width="22" height="12" rx="3" fill="url(#brass)"/>
      <rect x="138" y="452" width="24" height="30" rx="5" fill="url(#brass)"/>
      <!-- zsinór -->
      <g class="chain" id="chain" role="button" tabindex="0" aria-label="Lámpa kapcsoló">
        <rect x="118" y="150" width="50" height="190" fill="transparent"/>
        <g>
          <path d="M158 156 C150 200 136 240 136 300" stroke="#d8b26a" stroke-width="1.6" fill="none" stroke-dasharray="2 3"/>
          <circle cx="136" cy="304" r="5" fill="url(#brass)"/>
        </g>
      </g>
      <!-- háromláb -->
      <path d="M145 478 L72 628" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/>
      <path d="M155 478 L228 628" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/>
      <path d="M150 480 L150 618" stroke="url(#wood)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="72" cy="629" r="5" fill="url(#brass)"/><circle cx="228" cy="629" r="5" fill="url(#brass)"/><circle cx="150" cy="620" r="5" fill="url(#brass)"/>
      <ellipse cx="150" cy="634" rx="110" ry="6" fill="rgba(0,0,0,.35)"/>
    </svg>
    <div class="hint" id="hint">Pull again to dim</div>
  </div>

  <section class="card">
    <div class="top">
      <div class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffb59a" stroke-width="2" stroke-linecap="round"><path d="M8 3h8l3 8H5z"/><path d="M12 11v9M8 21h8"/></svg></div>
      <div class="brand">VAULT</div>
      <div class="pill" id="pill">LIT</div>
    </div>
    <h1>Welcome back.<em id="tag">The light’s on for you.</em></h1>

    <form class="form" id="form" novalidate>
      <label class="l" for="em">Email</label>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input id="em" type="email" placeholder="you@studio.com" autocomplete="email">
      </div>
      <label class="l" for="pw">Password</label>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="eye" id="eye" aria-label="Jelszó megjelenítése"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row">
        <label class="tgl"><input type="checkbox" id="keep" checked><span></span>Keep me signed in</label>
        <button type="button" class="lnk" data-g>Forgot password?</button>
      </div>
      <button class="go" id="go" type="submit">Sign in <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="or">Or continue with</div>
      <div class="soc">
        <button type="button" data-g="Apple"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.8zM14 5.3c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"/></svg>Apple</button>
        <button type="button" id="google"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4v3.1C3.4 21.4 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5h-4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.5l4 3.1c.9-2.8 3.5-4.8 6.6-4.8z"/></svg>Google</button>
        <button type="button" data-g="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>GitHub</button>
      </div>
      <div class="foot">New to Vault? <button type="button" class="lnk" data-g>Create an account</button><small>Privát oldal – csak a saját Google-fiókoddal léphetsz be</small></div>
    </form>

    <div class="inside" id="inside">
      <p id="hello"></p>
      <button class="go" id="out" type="button">Kilépés</button>
    </div>
  </section>
</main>
<div class="msg" id="msg" role="status"></div>

<script>
(function () {
  var OWNER = "csikos.mate.ovb@gmail.com";
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body, root = document.documentElement;

  /* fényfoltok */
  var bk = $("bokeh");
  for (var i = 0; i < 18; i++) {
    var d = document.createElement("i"), s = 6 + Math.random() * 26;
    d.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) + "%;animation-duration:" + (8 + Math.random() * 10) + "s;animation-direction:alternate";
    bk.appendChild(d);
  }

  /* lámpa ki/be a zsinórral */
  var on = true, chain = $("chain");
  function toggle() {
    chain.classList.add("pull");
    setTimeout(function () {
      chain.classList.remove("pull");
      on = !on;
      root.style.setProperty("--lit", on ? 1 : 0);
      body.classList.toggle("off", !on);
      $("pill").textContent = on ? "LIT" : "DIM";
      $("hint").textContent = on ? "Pull again to dim" : "Pull to light up";
      $("tag").textContent = on ? "The light’s on for you." : "Lights out. Pull the cord.";
    }, 140);
  }
  chain.addEventListener("click", toggle);
  chain.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

  /* jelszó megjelenítése */
  $("eye").onclick = function () { var p = $("pw"); p.type = p.type === "password" ? "text" : "password"; };

  var mt;
  function msg(t) { var m = $("msg"); m.textContent = t; m.classList.add("on"); clearTimeout(mt); mt = setTimeout(function () { m.classList.remove("on"); }, 4200); }

  function ready() { return (window.CSK && window.CSK.ready) || new Promise(function (r) { var n = 0, t = setInterval(function () { if ((window.CSK && window.CSK.ready) || ++n > 100) { clearInterval(t); r(window.CSK && window.CSK.ready); } }, 50); }); }

  function show() {
    var C = window.CSK || {};
    if (C.user === OWNER) {
      body.classList.add("in");
      $("hello").textContent = "Szia " + ((C.name || "").split(" ").pop() || "") + "! Bent vagy a Vaultban.";
    } else {
      body.classList.remove("in");
      if (C.user) msg("Ez a Vault csak a tulajdonosé. Más fiókkal nem lehet belépni.");
    }
  }

  function signIn() {
    var go = $("go"); go.disabled = true;
    ready().then(function (C) {
      if (!C || !C.signIn) throw new Error("A belépés most nem érhető el.");
      return C.signIn();
    }).then(function () { location.reload(); })
      .catch(function (e) { go.disabled = false; if (!e || e.code !== "auth/popup-closed-by-user") msg("A belépés nem sikerült: " + ((e && (e.code || e.message)) || e)); });
  }

  /* Minden belépési út a Google-fiókon keresztül megy (a Vault csak a tulajdonos Gmailjével nyílik) */
  $("form").addEventListener("submit", function (e) { e.preventDefault(); signIn(); });
  $("google").onclick = signIn;
  Array.prototype.forEach.call(document.querySelectorAll("[data-g]"), function (b) {
    b.addEventListener("click", function () { msg("A Vaultba csak Google-fiókkal lehet belépni."); });
  });
  $("out").onclick = function () { ready().then(function (C) { return C && C.signOut(); }).then(function () { location.reload(); }); };

  ready().then(show);
})();
</script>
</body>
</html>
