<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Telefonszámla – mennyit fizetek?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --ink:#003366; --muted:#336699; --accent:#003366; --on-accent:#ffffff; --track:#e5e5e5; --card:#f0f3f7; --hot:#cc0066; --ok:#006666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#001f3d; --ink:#ffffff; --muted:#6699cc; --accent:#ff99cc; --on-accent:#001f3d; --track:#00305a; --card:#00305a; --hot:#ff99cc; --ok:#66cccc; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 16px 56px; }
  h1 { font-size: clamp(1.8rem, 7vw, 2.4rem); letter-spacing: -.03em; line-height: 1.05; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input { width: 100%; font: inherit; font-size: 1.15rem; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--track); background: var(--bg); color: var(--ink); }
  input:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tw { display: flex; align-items: stretch; border: 2px solid var(--track); border-radius: 12px; background: var(--bg); overflow: hidden; }
  .tw:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tw .pre { display: flex; align-items: center; padding: 0 4px 0 16px; font-size: 1.15rem; font-weight: 700; color: var(--muted); }
  .tw input { border: 0; border-radius: 0; padding-left: 8px; }
  .tw input:focus { outline: 0; }
  button { font: inherit; font-weight: 700; font-size: 1.05rem; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; background: var(--accent); color: var(--on-accent); }
  button[disabled] { opacity: .6; cursor: wait; }
  .err { color: var(--hot); min-height: 1.4em; margin: 10px 0 0; }
  .res { margin-top: 24px; }
  .amount { font-size: clamp(3rem, 15vw, 4.4rem); font-weight: 700; letter-spacing: -.04em; line-height: 1; margin: 4px 0 6px; }
  .amount.due { color: var(--hot); } .amount.ok { color: var(--ok); }
  .parts { margin-top: 6px; } .line b { white-space: nowrap; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--track); }
  .pay { margin-top: 20px; background: var(--card); border-radius: 14px; padding: 16px; }
  .pay h2 { margin: 0 0 10px; font-size: 1rem; color: var(--muted); font-weight: 600; }
  .row { flex-wrap: wrap; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; }
  .row span:first-child { color: var(--muted); font-size: .92rem; }
  .row b { font-size: 1.05rem; word-break: normal; overflow-wrap: anywhere; text-align: right; }
  .copy { padding: 6px 10px; font-size: .85rem; border-radius: 8px; flex: none; }
  .small { color: var(--muted); font-size: .88rem; margin-top: 16px; }
  .item { margin-top: 14px; background: var(--card); border-radius: 14px; padding: 12px 16px 4px; }
  .item .line:last-child { border-bottom: 0; }
  .ihd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 4px; }
  .ihd b { font-size: 1.05rem; overflow-wrap: anywhere; }
  .pv { flex: none; font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }
  .line.sub span { color: var(--muted); } .line.sub b { color: var(--hot); }
  .line.tot { margin-top: 10px; border-bottom: 0; font-size: 1.1rem; } .line.tot b { color: var(--hot); }
</style>
</head>
<body>
<main>
  <h1>Telefonszámla – mennyit fizetek?</h1>
  <p class="lead">Írd be a neved és a telefonszámodat – a +36 már előre be van írva –, és megmutatjuk, mennyi a tartozásod, és hová kell utalnod.</p>
  <form id="f" autocomplete="off">
    <input id="nm" type="text" maxlength="60" placeholder="Neved" aria-label="Neved" autocomplete="name" required>
    <div class="tw"><span class="pre" aria-hidden="true">+36</span><input id="tel" type="tel" inputmode="numeric" maxlength="12" placeholder="20 313 3292" aria-label="Telefonszám" required></div>
    <button id="go" type="submit">Mutasd</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <div class="res" id="res" hidden></div>
</main>
<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbxQ-h6UZiyIp6StErApri4EaGcIYmYhCKjX5ufz_MnD3MuDqYe1tGlT330PKHjaq5WaoQ/exec";
  // Hová utaljanak (ha változik, itt kell átírni)
  var PAY = { account: "11600006-00000002-06029601", name: "Csikós Máté", revolut: "@mtt10x", revolutPhone: "20 313 3292" };
  function $(i) { return document.getElementById(i); }
  function ft(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ft"; }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
  function row(label, val, copy) {
    var r = el("div", "row"); r.appendChild(el("span", "", label)); var b = el("b", "", val);
    if (copy) { var w = el("span"); w.style.cssText = "display:flex;gap:8px;align-items:center"; var cb = el("button", "copy", "Másolás"); cb.type = "button";
      cb.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(copy) : Promise.reject()).then(function () { cb.textContent = "Kész ✓"; setTimeout(function () { cb.textContent = "Másolás"; }, 1500); }, function () {}); };
      w.appendChild(b); w.appendChild(cb); r.appendChild(w); } else r.appendChild(b);
    return r;
  }
  function show(d, nm) {
    var res = $("res"); res.textContent = ""; res.hidden = false;
    if (!d.found) { res.appendChild(el("p", "", "Ezzel a számmal nem találtunk tételt. Ellenőrizd a számot, vagy kérdezd meg a csapatvezetőt.")); return; }
    var due = d.total > 0;
    res.appendChild(el("div", "", due ? "Fizetendő összesen" : "Nincs tartozásod"));
    res.appendChild(el("div", "amount " + (due ? "due" : "ok"), due ? ft(d.total) : "0 Ft"));
    var detailed = d.items.length && d.items.every(function (it) { return it.alap !== undefined; });
    if (due && detailed) {
      d.items.filter(function (it) { return it.egy > 0; }).forEach(function (it) {
        var dev = it.kesz > 0 && !it.alap && !it.forg, card = el("div", "item");
        var hd = el("div", "ihd"); hd.appendChild(el("b", "", dev ? "Készülék: " + (it.csomag || "készülékrészlet") : (it.csomag || "Előfizetés")));
        hd.appendChild(el("span", "pv", it.prov)); card.appendChild(hd);
        var L = dev ? [["Havi készülékrészlet", it.kesz], ["Elmaradás", it.tart]]
                    : [["Alapdíj (havidíj + admin)", it.alap], ["Forgalmi díj (sms, vásárlás, parkolás, roaming…)", it.forg], ["Készülékrészlet", it.kesz], ["Elmaradás", it.tart]];
        L.forEach(function (c) { if (!c[1]) return; var l = el("div", "line"); l.appendChild(el("span", "", c[0])); l.appendChild(el("b", "", ft(c[1]))); card.appendChild(l); });
        if (it.bef) { var lb = el("div", "line"); lb.appendChild(el("span", "", "Már befizetett")); lb.appendChild(el("b", "", "−" + ft(it.bef))); card.appendChild(lb); }
        var st = el("div", "line sub"); st.appendChild(el("span", "", "Részösszeg")); st.appendChild(el("b", "", ft(it.egy))); card.appendChild(st);
        res.appendChild(card);
      });
      var tl = el("div", "line tot"); tl.appendChild(el("span", "", "Összesen fizetendő")); tl.appendChild(el("b", "", ft(d.total))); res.appendChild(tl);
    } else if (due) {
      var P = d.parts || {}, sec = el("div", "parts");
      [["Alapdíj (havidíj + admin)", P.alap], ["Forgalmi díj (sms, vásárlás, parkolás, roaming…)", P.forg], ["Készülék díj", P.kesz], ["Elmaradás", P.tart]].forEach(function (c) {
        if (!c[1]) return; var l = el("div", "line"); l.appendChild(el("span", "", c[0])); l.appendChild(el("b", "", ft(c[1]))); sec.appendChild(l);
      });
      if (P.bef) { var lb = el("div", "line"); lb.appendChild(el("span", "", "Már befizetett")); lb.appendChild(el("b", "", "−" + ft(P.bef))); sec.appendChild(lb); }
      res.appendChild(sec);
      if (d.items.length > 1) { res.appendChild(el("p", "small", "Több számod is van: " + d.items.filter(function (it) { return it.egy > 0; }).map(function (it) { return it.prov + " " + ft(it.egy); }).join(", ") + ".")); }
    }
    if (!due) { var ex = d.items.some(function (it) { return it.egy < 0; }); if (ex) res.appendChild(el("p", "small", "Előre fizettél, a különbözet jóváíródik a következő hónapban.")); return; }
    var box = el("div", "pay"); box.appendChild(el("h2", "", "Hová utalj?"));
    var ar = row("Számlaszám", PAY.account.replace(/-/g, "\u2011"), PAY.account); ar.querySelector("b").style.cssText = "font-size:.8rem;white-space:nowrap"; box.appendChild(ar);
    if (PAY.name) box.appendChild(row("Kedvezményezett", PAY.name));
    box.appendChild(row("Összeg", ft(d.total), String(Math.round(d.total))));
    box.appendChild(row("Közlemény", nm, nm));
    box.appendChild(el("h2", "", "vagy Revolut"));
    box.lastChild.style.marginTop = "14px";
    box.appendChild(row("Revolut", PAY.revolut, PAY.revolut));
    res.appendChild(box);
    res.appendChild(el("p", "small", "Az utalás után pár napon belül rögzítjük a befizetést."));
  }
  $("tel").addEventListener("input", function () {
    var raw = this.value; if (/^\s*[+0]/.test(raw)) return; var d = raw.replace(/\D/g, "").slice(0, 9);
    this.value = d.length > 5 ? d.slice(0, 2) + " " + d.slice(2, 5) + " " + d.slice(5) : d.length > 2 ? d.slice(0, 2) + " " + d.slice(2) : d;
  });
  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("tel").value.trim(), err = $("err"), btn = $("go"); err.textContent = ""; $("res").hidden = true;
    var nm = $("nm").value.trim().replace(/\s+/g, " ");
    if (nm.length < 2) { err.textContent = "Add meg a neved."; return; }
    var digits = v.replace(/\D/g, "");
    if (/^\s*(\+|00?36|06)/.test(v) || digits.length > 9) { err.textContent = "A +36 már ott van, csak a többi számjegyet írd be, pl. 20 313 3292."; return; }
    if (digits.length !== 9) { err.textContent = "A számnak 9 számjegyűnek kell lennie, pl. 20 313 3292."; return; }
    v = digits.slice(0, 2) + " " + digits.slice(2, 5) + " " + digits.slice(5);
    btn.disabled = true; btn.textContent = "Keresem…";
    fetch(API + "?fizet=" + encodeURIComponent(digits)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { err.textContent = d.error || "Nem sikerült."; return; }
      show(d, nm);
    }).catch(function () { err.textContent = "Nem sikerült lekérdezni, próbáld újra."; })
      .then(function () { btn.disabled = false; btn.textContent = "Mutasd"; });
  });
})();
</script>
<script src="anim.js?v=14" defer></script>
</body>
</html>
