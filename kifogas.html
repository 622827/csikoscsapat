<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003366">
<title>Kifogáskezelő · Csikós csapat</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  KIFOGÁSKEZELŐ (béta)
  - Hozzáférés: béta alatt csak az ADMIN felületről (admin belépés + teljesítmény-jelszó a munkamenetben).
    Élesítés után a csapat-háttér (Apps Script, action=kk_init) adja ki a tár azonosítóját, ha az admin kapcsoló be van kapcsolva.
  - Adatok: Firestore perf/<tár>/kk_content (main, config) és perf/<tár>/kk_users/<felhasználó>.
  - AI: AI.* adapter. Alapból helyi (teszt) értékelés; "gemini" módban a háttér kk_ai műveletét hívja.
  - Felolvasás: TTS.* adapter, később profi hangszolgáltatásra cserélhető.
-->
<style>
:root {
  --bg: #f4f7fb; --surface: #ffffff; --ink: #003366; --muted: #4d6f94; --line: #dfe7f0;
  --brand: #003366; --on-brand: #fff; --hot: #cc0066; --hot-bg: #ffe6f2; --ok: #00806f; --ok-bg: #dff5f1;
  --sky: #6699cc; --gold: #e0a100; --track: #e5ebf2; --shadow: 0 1px 2px rgba(0,40,80,.06), 0 8px 24px rgba(0,40,80,.08);
  --r: 18px; --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #001a33; --surface: #002547; --ink: #f2f7ff; --muted: #8fb0d6; --line: #0d3a66; --brand: #ff99cc; --on-brand: #001f3d;
    --hot: #ff7ab6; --hot-bg: #3a0a2a; --ok: #5fd6c4; --ok-bg: #063a3a; --sky: #6699cc; --track: #0b355e; --shadow: 0 8px 24px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.4; min-height: 100vh; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(28px + var(--safe-b)); }
.admin-mode .wrap { max-width: 1000px; }

/* Felső sáv */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.admin-mode .top .in { max-width: 1000px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: .95rem; white-space: nowrap; }
.chip svg { width: 18px; height: 18px; }
.chip.streak svg { fill: var(--hot); } .chip.xp svg { fill: var(--sky); }
.chip.off { opacity: .55; filter: grayscale(1); }
.sp { flex: 1; }
.iconbtn { border: 0; background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.on { background: var(--brand); color: var(--on-brand); }

/* Kártyák, gombok */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; font-weight: 700; font-size: 1.05rem; padding: 15px 18px; border-radius: 14px;
  background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 70%, #000); transition: transform .08s, box-shadow .08s, opacity .2s; width: 100%; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--brand) 70%, #000); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
.btn.hot { background: var(--hot); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--hot) 65%, #000); }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 65%, #000); }
.btn.sm { font-size: .9rem; padding: 9px 12px; width: auto; border-radius: 11px; }
h1 { font-size: 1.7rem; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 4px; }
h2 { font-size: 1.15rem; margin: 26px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* Kezdőlap */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.ring { width: 84px; height: 84px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .bg { stroke: var(--track); } .ring .fg { stroke: var(--ok); transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82rem; text-align: center; line-height: 1.1; }
.lvlbar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.lvlbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), var(--brand)); border-radius: 99px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.mode { border: 0; text-align: left; cursor: pointer; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 14px; display: grid; gap: 4px; transition: transform .12s; position: relative; }
.mode:active { transform: scale(.97); }
.mode svg { width: 26px; height: 26px; stroke: var(--brand); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mode b { font-size: 1rem; } .mode span { font-size: .82rem; color: var(--muted); }
.mode .badge { position: absolute; top: 10px; right: 10px; background: var(--hot); color: #fff; font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; }

/* Tanösvény */
.topic { margin-top: 22px; }
.topic-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--brand); color: var(--on-brand); }
.topic-h b { font-size: 1.05rem; } .topic-h span { font-size: .82rem; opacity: .8; }
.path { position: relative; padding: 10px 0 4px; }
.node { --x: 0px; display: flex; flex-direction: column; align-items: center; margin: 14px auto; transform: translateX(var(--x)); width: 120px; }
.node button { width: 74px; height: 70px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: var(--brand); color: var(--on-brand);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--brand) 65%, #000); transition: transform .1s; }
.node button:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--brand) 65%, #000); }
.node button svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.node.locked button { background: var(--track); color: var(--muted); box-shadow: 0 6px 0 var(--line); cursor: default; }
.node.done button { background: var(--ok); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.node.next button { animation: pulse 1.8s infinite; }
.node small { margin-top: 10px; font-size: .78rem; font-weight: 600; text-align: center; color: var(--muted); }
.stars { display: flex; gap: 2px; margin-top: 4px; } .stars svg { width: 14px; height: 14px; fill: var(--track); } .stars svg.on { fill: var(--gold); }
@keyframes pulse { 0%,100% { outline: 0 solid color-mix(in srgb, var(--brand) 35%, transparent); } 50% { outline: 10px solid color-mix(in srgb, var(--brand) 0%, transparent); } }

/* Lecke */
.lesson { min-height: calc(100vh - 70px); display: flex; flex-direction: column; }
.prog { height: 14px; background: var(--track); border-radius: 99px; overflow: hidden; flex: 1; }
.prog i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); position: relative; }
.prog i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 9px; background: rgba(255,255,255,.35); }
.timer { height: 5px; background: var(--track); border-radius: 9px; overflow: hidden; margin-top: 8px; } .timer i { display: block; height: 100%; background: var(--hot); width: 100%; }
.client { display: flex; gap: 12px; align-items: flex-end; margin: 22px 0 16px; }
.ava { flex: none; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; color: #fff; background: var(--sky); position: relative; }
.ava svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 12px 14px; font-size: 1.08rem; box-shadow: var(--shadow); }
.bubble .who { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.bubble .say { border: 0; background: none; cursor: pointer; color: var(--sky); padding: 0; margin-left: 6px; vertical-align: middle; }
.bubble .say svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.me { margin: 10px 0 10px auto; max-width: 88%; background: var(--brand); color: var(--on-brand); border-radius: 18px 18px 4px 18px; padding: 12px 14px; }
.chat { display: flex; flex-direction: column; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
.task { font-weight: 700; margin: 4px 0 10px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s, border-color .15s, background .15s; font-size: 1rem; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt.sel { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 14%, var(--surface)); box-shadow: 0 3px 0 var(--sky); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--hot); background: var(--hot-bg); box-shadow: 0 3px 0 var(--hot); }
.zone { min-height: 64px; border-bottom: 2px solid var(--line); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.zone.ans { border-top: 2px solid var(--line); margin-bottom: 14px; min-height: 120px; }
.piece { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; cursor: grab; box-shadow: 0 3px 0 var(--line); font-size: .95rem; user-select: none; touch-action: none; transition: transform .15s; }
.piece.ghost { opacity: .25; } .piece.drag { position: fixed; z-index: 100; pointer-events: none; transform: scale(1.04) rotate(-1deg); box-shadow: var(--shadow); }
.piece.right { border-color: var(--ok); } .piece.wrong { border-color: var(--hot); }
textarea, input[type=text], input[type=number], select { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
textarea:focus, input:focus, select:focus { outline: 0; border-color: var(--sky); }
textarea { min-height: 110px; resize: vertical; }
.mic { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin: 10px 0; padding: 16px; border-radius: 16px; border: 2px dashed var(--sky); background: transparent; color: var(--ink); font-weight: 700; cursor: pointer; user-select: none; touch-action: none; }
.mic svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
.mic.rec { border-style: solid; border-color: var(--hot); background: var(--hot-bg); color: var(--hot); }
.mic.rec svg { animation: beat 1s infinite; } @keyframes beat { 50% { transform: scale(1.25); } }
.foot { margin-top: auto; padding-top: 16px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 18px 16px calc(18px + var(--safe-b)); transform: translateY(105%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s; }
.sheet.show { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); } .sheet .in { max-width: 560px; margin: 0 auto; }
.sheet.good { background: var(--ok-bg); } .sheet.bad { background: var(--hot-bg); } .sheet.mid { background: color-mix(in srgb, var(--gold) 18%, var(--surface)); }
.sheet h3 { margin: 0 0 6px; font-size: 1.25rem; } .sheet.good h3 { color: var(--ok); } .sheet.bad h3 { color: var(--hot); }
.sheet p { margin: 0 0 8px; } .sheet .sample { background: var(--surface); border-radius: 12px; padding: 10px 12px; margin: 8px 0 14px; font-size: .95rem; }
.sheet .sample b { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.shake { animation: shake .35s; } @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

/* Eredmény */
.result { text-align: center; padding-top: 24px; }
.score { font-size: 4rem; font-weight: 700; letter-spacing: -.04em; line-height: 1; margin: 12px 0 4px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.tiles3 div { border-radius: 14px; padding: 10px 6px; border: 2px solid var(--line); background: var(--surface); }
.tiles3 b { display: block; font-size: 1.3rem; } .tiles3 span { font-size: .75rem; color: var(--muted); }
.fb { text-align: left; margin-top: 12px; } .fb li { margin: 6px 0; } .fb ul { padding-left: 20px; margin: 6px 0; }
.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; } @keyframes pop { from { transform: scale(.4); opacity: 0; } }
.rise { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; } @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bdg { text-align: center; padding: 14px 6px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.bdg .ic { width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--gold), var(--hot)); }
.bdg .ic svg { width: 26px; height: 26px; fill: #fff; } .bdg.off { opacity: .4; } .bdg.off .ic { background: var(--track); }
.bdg b { font-size: .82rem; display: block; } .bdg span { font-size: .72rem; color: var(--muted); }
.rank { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); margin-bottom: 8px; box-shadow: var(--shadow); }
.rank .n { width: 28px; font-weight: 700; text-align: center; } .rank.me { outline: 2px solid var(--sky); } .rank .x { margin-left: auto; font-weight: 700; }
.rank .av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; background: var(--sky); }

/* Belépés / zárolt */
.center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
.center .card { max-width: 380px; }

/* Ablak, értesítés, konfetti */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center; background: rgba(0,20,40,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal.show { opacity: 1; pointer-events: auto; }
.modal .box { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + var(--safe-b)); max-height: 88vh; overflow: auto; transform: translateY(30px); transition: transform .25s; }
.modal.show .box { transform: none; }
.toast { position: fixed; left: 50%; top: 14px; z-index: 80; transform: translate(-50%, -80px); background: var(--brand); color: var(--on-brand); padding: 10px 16px; border-radius: 12px; font-weight: 600; transition: transform .3s; box-shadow: var(--shadow); max-width: 92vw; }
.toast.show { transform: translate(-50%, 0); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.view { animation: vin .28s cubic-bezier(.2,.8,.2,1); } @keyframes vin { from { opacity: 0; transform: translateY(8px); } }

/* Admin */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 10px 0 14px; }
.tabs button { border: 0; background: var(--surface); box-shadow: var(--shadow); padding: 9px 13px; border-radius: 11px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.tabs button.on { background: var(--brand); color: var(--on-brand); }
.ed { display: grid; gap: 10px; margin-bottom: 12px; }
.ed label { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.ed .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ed .row3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; align-items: end; }
.ed textarea { min-height: 70px; }
.optrow { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; border: 1px dashed var(--line); padding: 8px; border-radius: 12px; }
.optrow textarea { min-height: 44px; }
.del { border: 0; background: none; color: var(--hot); cursor: pointer; font-weight: 700; }
.savebar { position: sticky; bottom: 0; padding: 10px 0; background: linear-gradient(transparent, var(--bg) 30%); display: flex; gap: 8px; align-items: center; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; } .tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); } .tbl th { color: var(--muted); font-size: .78rem; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; } .switch input { display: none; }
.switch i { width: 52px; height: 30px; border-radius: 99px; background: var(--track); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + i { background: var(--ok); } .switch input:checked + i::after { transform: translateX(22px); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--muted); }
.pill.hot { background: var(--hot-bg); color: var(--hot); } .pill.ok { background: var(--ok-bg); color: var(--ok); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="top" id="top" hidden><div class="in" id="topin"></div></div>
<div class="wrap"><main id="view"></main></div>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
(function () {
"use strict";

/* ===================== Beállítások ===================== */
var TEAM_API = "https://script.google.com/macros/s/AKfycbxQ-h6UZiyIp6StErApri4EaGcIYmYhCKjX5ufz_MnD3MuDqYe1tGlT330PKHjaq5WaoQ/exec";
var KK_SALT = "kk|";               // a tár azonosítója béta alatt: sha256(KK_SALT + teljesítmény-jelszó)
var FBV = "https://www.gstatic.com/firebasejs/10.14.1/";

/* ===================== Segédek ===================== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function addDays(s, n) { var p = s.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return dstr(d); }
function weekStart() { var d = new Date(); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return dstr(d); }
function uidOf(name) { return "u_" + String(name).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function rid(p) { return (p || "x") + Math.random().toString(36).slice(2, 8); }
function pick(a) { return a && a.length ? a[Math.floor(Math.random() * a.length)] : ""; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function isDone(lid) { return !!(S.me.done[lid] && S.me.done[lid].stars > 0); }
function isOpen(t, idx) { return idx === 0 || isDone(t.levels[idx - 1].id); }
function nextLevel() {
  for (var i = 0; i < S.C.topics.length; i++) { var t = S.C.topics[i]; for (var j = 0; j < t.levels.length; j++) if (isOpen(t, j) && !isDone(t.levels[j].id) && itemsOf(t.levels[j].id).length) return t.levels[j]; }
  return null;
}
function unlockedItems() { var a = []; S.C.topics.forEach(function (t) { t.levels.forEach(function (l, j) { if (isOpen(t, j)) a = a.concat(itemsOf(l.id)); }); }); return a; }
function dueItems() { var d = today(), w = S.me.weak || {}; return Object.keys(w).filter(function (k) { return w[k].due <= d && itemById(k); }).map(itemById); }

/* ===================== AI adapter ===================== */
/* Helyi (teszt) mód: kulcsszavas értékelés + ügyféltípusonkénti reakciók.
   "gemini" mód: a csapat-háttér kk_ai művelete (Apps Script → Gemini Flash). Ha nem válaszol, a helyi mód lép életbe. */
var AI = {
  backend: function (payload) {
    return fetch(TEAM_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action: "kk_ai", s: S.space, t: teamToken() }, payload)) })
      .then(function (r) { return r.json(); }).then(function (d) { if (!d || !d.ok) throw new Error("ai"); return d; });
  },
  // Egy válasz értékelése és az ügyfél reakciója. Vissza: { score, hits:[{id,name,ok,desc}], reply }
  respond: function (item, client, answer, history) {
    var local = AI.local(item, client, answer);
    if (S.cfg.ai !== "gemini") return Promise.resolve(local);
    return AI.backend({ task: "respond", item: { prompt: item.prompt, sample: item.sample }, client: { name: client.name, persona: client.persona }, criteria: critFor(item).map(function (c) { return { id: c.id, name: c.name, desc: c.desc }; }), answer: answer, history: history || [] })
      .then(function (d) { return { score: d.score, hits: d.hits || local.hits, reply: d.reply || local.reply, tip: d.tip || "" }; })
      .catch(function () { return local; });
  },
  local: function (item, client, answer) {
    var s = String(answer || ""), low = s.toLowerCase(), cr = critFor(item);
    var hits = cr.map(function (c) {
      var ok;
      if (c.rule === "kerdes") ok = /\?/.test(s) || /\b(mi|mennyi|hogyan|melyik|mikor|kinek|ki)\b/.test(low);
      else if (c.rule === "tomor") { var w = words(s); ok = w >= 8 && w <= 70 && !/(talán|esetleg|ha nem gond|bocsánat|nem tudom)/.test(low); }
      else if (c.rule === "konkret") ok = /\d/.test(s) || (c.kw || []).some(function (k) { return low.indexOf(k.toLowerCase()) > -1; });
      else ok = (c.kw || []).some(function (k) { return low.indexOf(String(k).toLowerCase()) > -1; });
      return { id: c.id, name: c.name, desc: c.desc, ok: !!ok };
    });
    var n = hits.filter(function (h) { return h.ok; }).length, score = hits.length ? Math.round(100 * n / hits.length) : (words(s) > 5 ? 70 : 30);
    if (words(s) < 4) score = Math.min(score, 25);
    return { score: score, hits: hits, reply: score >= 70 ? pick(client.pos) : pick(client.neg) };
  }
};

function lvlOf(xp) { var l = Math.floor(Math.sqrt(xp / 40)) + 1, lo = 40 * Math.pow(l - 1, 2), hi = 40 * Math.pow(l, 2); return { l: l, p: (xp - lo) / (hi - lo) }; }

function weekXp(u) { var ws = weekStart(), s = 0; Object.keys(u.days || {}).forEach(function (d) { if (d >= ws) s += u.days[d]; }); return s; }

/* ===================== Lecke-motor ===================== */
/* opts.kind: level | quick | review | role ; opts.client (role) ; opts.topic (role) */
var L = null;
var Lesson = {
  start: function (opts) {
    var items, client;
    if (opts.kind === "level") { items = shuffle(itemsOf(opts.level)).slice(0, Math.max(S.cfg.lessonLen, 2)); client = clientById(levelById(opts.level).client); }
    else if (opts.kind === "quick") { var pool = unlockedItems().filter(function (i) { return i.type !== "open"; }); if (pool.length < 3) pool = unlockedItems(); items = shuffle(pool).slice(0, S.cfg.quickLen); }
    else if (opts.kind === "review") { items = shuffle(dueItems()).slice(0, 5); }
    else if (opts.kind === "role") { items = shuffle(S.C.items.filter(function (i) { var t = topicOf(i.level); return !opts.topic || (t && t.id === opts.topic); })).slice(0, 3); client = clientById(opts.client); }
    if (!items || !items.length) { toast("Ehhez még nincs kifogás feltöltve."); return; }
    L = { opts: opts, items: items, i: 0, res: [], client: client, history: [] };
    topbar("lesson"); Lesson.show();
  },
  clientFor: function (item) { return L.client || clientById((levelById(item.level) || {}).client); },
  show: function () {
    hideSheet(); TTS.stop();
    var it = L.items[L.i], cl = Lesson.clientFor(it), role = L.opts.kind === "role", type = role ? "open" : it.type;
    $("#prog").style.width = Math.round(100 * L.i / L.items.length) + "%";
    var h = '<div class="lesson">' + (L.opts.kind === "quick" ? '<div class="timer"><i id="tmr"></i></div>' : "");
    h += '<div class="task">' + (type === "mc" ? "Mit válaszolsz?" : type === "order" ? "Rakd sorba a választ!" : role ? "Szerepjáték · " + esc(cl.name) + " ügyfél" : "Válaszolj saját szavaiddal!") + '</div>';
    h += '<div class="chat" id="chat">' + clientBubble(cl, it.prompt) + '</div><div id="ex"></div><div class="foot" id="foot"></div></div>';
    view(h);
    var ex = $("#ex"), foot = $("#foot");
    if (type === "mc") Ex.mc(it, ex, foot); else if (type === "order") Ex.order(it, ex, foot); else Ex.open(it, ex, foot);
    TTS.speak(it.prompt);
    if (L.opts.kind === "quick") Lesson.timer();
  },
  timer: function () {
    var sec = S.cfg.quickSec, t0 = performance.now(), el = $("#tmr"), idx = L.i;
    L.t0 = t0;
    (function f(t) { if (!L || L.i !== idx || L.checked) return; var k = 1 - (t - t0) / (sec * 1000); if (el) el.style.width = Math.max(0, k * 100) + "%"; if (k <= 0) { Lesson.result(0, [], "Lejárt az idő.", null); return; } requestAnimationFrame(f); })(t0);
  },
  // Egy feladat eredménye → alsó lap
  result: function (score, hits, fbText, reply) {
    if (L.checked) return; L.checked = true;
    var ft = $("#foot"); if (ft) ft.style.display = "none"; var ls = $(".lesson"); if (ls) ls.style.minHeight = "0";
    var it = L.items[L.i], cl = Lesson.clientFor(it), good = score >= 70, mid = score >= 40 && !good;
    var bonus = 0; if (L.opts.kind === "quick" && good && L.t0) { var used = (performance.now() - L.t0) / 1000; bonus = used < S.cfg.quickSec / 2 ? 2 : 0; }
    L.res.push({ id: it.id, score: score, hits: hits || [], bonus: bonus });
    (good ? FX.good : FX.bad)();
    if (!good) { var ex = $("#ex"); ex && ex.classList.add("shake"); }
    var showSample = score < 100 && it.sample;
    var h = '<h3>' + (good ? pick(["Szép!", "Ez az!", "Pontosan!", "Így kell!"]) : mid ? "Majdnem!" : "Ezen még csiszolj") + (bonus ? ' <span class="pill ok">+' + bonus + ' gyorsasági XP</span>' : "") + '</h3>' +
      (fbText ? '<p>' + esc(fbText) + '</p>' : "") +
      (hits && hits.length ? '<p class="small">' + hits.map(function (x) { return '<span class="pill ' + (x.ok ? "ok" : "hot") + '">' + (x.ok ? "✓ " : "✗ ") + esc(x.name) + '</span>'; }).join(" ") + '</p>' : "") +
      (showSample ? '<div class="sample"><b>Így is mondhatod</b>' + esc(it.sample) + '</div>' : "") +
      '<button class="btn ' + (good ? "ok" : mid ? "" : "hot") + '" id="next">Tovább</button>';
    showSheet(good ? "good" : mid ? "mid" : "bad", h);
    if (reply) Lesson.reply(cl, reply);
    $("#next").onclick = function () { FX.tap(); L.checked = false; L.i++; if (L.i < L.items.length) Lesson.show(); else Lesson.finish(); };
  },
  reply: function (cl, text) {
    var chat = $("#chat"); if (!chat) return;
    var d = document.createElement("div"); d.innerHTML = clientBubble(cl, "", true); chat.appendChild(d.firstChild);
    setTimeout(function () { var last = chat.lastElementChild; if (last) last.outerHTML = clientBubble(cl, text); var nb = chat.lastElementChild; if (nb) { var sh = $("#sheet").offsetHeight, rb = nb.getBoundingClientRect().bottom; window.scrollBy({ top: rb - (innerHeight - sh) + 12, behavior: "smooth" }); } TTS.speak(text); }, 800);
  },
  finish: function () {
    hideSheet(); TTS.stop();
    var n = L.res.length, avg = Math.round(L.res.reduce(function (s, r) { return s + r.score; }, 0) / n), bonus = L.res.reduce(function (s, r) { return s + r.bonus; }, 0);
    var xp = 10 + Math.round(avg / 10) + bonus + (avg === 100 ? 5 : 0), stars = avg >= 90 ? 3 : avg >= 70 ? 2 : avg >= 50 ? 1 : 0;
    var u = S.me, d = today(), prevStreak = liveStreak(), oldBadges = u.badges.slice();
    // XP, sorozat
    u.xp += xp; u.days[d] = (u.days[d] || 0) + xp; u.lessons++;
    if (u.lastDay !== d) { u.streak = u.lastDay === addDays(d, -1) ? u.streak + 1 : 1; u.lastDay = d; }
    u.best = Math.max(u.best, u.streak); if (avg === 100) u.perfect++; if (L.opts.kind === "review") u.reviews++;
    if (L.opts.kind === "level") { var lid = L.opts.level, cur = u.done[lid] || { stars: 0, best: 0 }; u.done[lid] = { stars: Math.max(cur.stars, stars), best: Math.max(cur.best, avg) }; }
    // Okos ismétlés + statisztika
    L.res.forEach(function (r) {
      var s = u.stats[r.id] || { t: 0, s: 0 }; s.t++; s.s += r.score; u.stats[r.id] = s;
      var w = u.weak[r.id];
      if (r.score < 70) u.weak[r.id] = { n: (w ? w.n : 0) + 1, due: addDays(d, w ? 1 : 0) };
      else if (w) { if (r.score >= 85 || w.n <= 1) delete u.weak[r.id]; else u.weak[r.id] = { n: w.n - 1, due: addDays(d, 3) }; }
    });
    // Elakadás nyoma (vezetői statisztikához)
    BADGES.forEach(function (b) { if (u.badges.indexOf(b.id) < 0 && b.test(u)) u.badges.push(b.id); });
    var newB = u.badges.filter(function (b) { return oldBadges.indexOf(b) < 0; });
    saveMe();
    // Visszajelzés összesítése
    var good = {}, bad = {}; L.res.forEach(function (r) { r.hits.forEach(function (x) { (x.ok ? good : bad)[x.name] = x.desc || x.name; }); });
    var worst = L.res.slice().sort(function (a, b) { return a.score - b.score; })[0], wi = itemById(worst.id);

  },
  order: function (it, ex, foot) {

    if (pool.length > 1 && pool.every(function (p, k) { return p.i === k; })) pool.reverse();
    ex.innerHTML = '<div class="zone ans" id="ans" aria-label="Válaszod"></div><div class="zone" id="pool"></div><p class="small muted">Koppints a darabokra, vagy húzd őket a helyükre.</p>';
    foot.innerHTML = '<button class="btn" id="chk" disabled>Ellenőrzés</button>';

      $$(".piece", ex).forEach(bind);
    }
    function move(z, k, toIdx) {
      if (L.checked) return; FX.tap();
      var src = z === "a" ? ans : pool, p = src.splice(k, 1)[0];
      if (toIdx == null) (z === "a" ? pool : ans).push(p); else ans.splice(Math.min(toIdx, ans.length), 0, p);
      render();

    // Húzás: mutatóeseményekkel (telefonon is). Rövid koppintás = áthelyezés a másik zónába.
    function bind(el) {
      el.addEventListener("pointerdown", function (e) {
        if (L.checked) return;
        var z = el.getAttribute("data-z"), k = +el.getAttribute("data-k"), sx = e.clientX, sy = e.clientY, ghost = null, moved = false;
        el.setPointerCapture(e.pointerId);
        function mv(ev) {
          if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 8) return;
          if (!moved) { moved = true; ghost = el.cloneNode(true); ghost.classList.add("drag"); document.body.appendChild(ghost); el.classList.add("ghost"); }
          ghost.style.left = (ev.clientX - ghost.offsetWidth / 2) + "px"; ghost.style.top = (ev.clientY - ghost.offsetHeight / 2) + "px";
        }
        function up(ev) {
          el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
          if (!moved) { move(z, k); return; }
          ghost.remove(); el.classList.remove("ghost");
          var ar = $("#ans").getBoundingClientRect();
          if (ev.clientY >= ar.top - 10 && ev.clientY <= ar.bottom + 10) {
            var idx = ans.length; $$('#ans .piece').forEach(function (pe, j) { var r = pe.getBoundingClientRect(); if (ev.clientY < r.bottom && ev.clientX < r.left + r.width / 2 && idx === ans.length) idx = j; });
            if (z === "a") { var p = ans.splice(k, 1)[0]; if (idx > k) idx--; ans.splice(idx, 0, p); FX.tap(); render(); } else move(z, k, idx);
          } else if (z === "a") move(z, k);

      });
    }
    render();
    $("#chk").onclick = function () {
      var right = 0; $$("#ans .piece").forEach(function (pe, j) { var ok = ans[j].i === j; if (ok) right++; pe.classList.add(ok ? "right" : "wrong"); });

    };
  },
  open: function (it, ex, foot) {

    foot.innerHTML = '<button class="btn" id="chk" disabled>' + (role ? "Elküldöm" : "Ellenőrzés") + '</button>';

        if (!STT.start(function (t) { ta.value = base + t; ta.oninput(); }, function () { mic.classList.remove("rec"); mic.querySelector("span").textContent = "Nyomd és beszélj"; })) { mic.classList.remove("rec"); toast("A beszédfelismerés itt nem elérhető. Írd be a választ."); } };
      var stopRec = function () { STT.stop(); };

    }
    $("#chk").onclick = function () {
      var a = ta.value.trim(), cl = Lesson.clientFor(it); if (!a) return;

  }

      } else if (it.type === "order") {
        h += '<label>A válasz darabjai, helyes sorrendben (soronként egy)<textarea data-arr data-f="C.items.' + ii + '.parts">' + esc((it.parts || []).join("\n")) + '</textarea></label>';
      } else {
        var grp = (lv.filter(function (l) { return l.id === it.level; })[0] || {}).group || "kifogas";
        h += '<div class="small muted">Értékelési szempontok (ha egyik sincs bejelölve, a témakör alapértelmezett szempontjai számítanak):</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
          C.criteria.map(function (c) { var on = (it.criteria || []).indexOf(c.id) > -1; return '<label class="pill' + (on ? " ok" : "") + '" style="cursor:pointer"><input type="checkbox" data-cr="' + ii + '" value="' + c.id + '"' + (on ? " checked" : "") + ' style="display:none">' + esc(c.name) + (c.group !== grp ? " (" + (c.group === "ajanlas" ? "ajánlás" : "kifogás") + ")" : "") + '</label>'; }).join("") + '</div>';
      }
      h += '<label>Mintamondat (a lecke végén ezt javasolja)<textarea data-f="C.items.' + ii + '.sample">' + esc(it.sample || "") + '</textarea></label><button class="del" data-di="' + ii + '" style="justify-self:start">Kifogás törlése</button></div>';
    });
    h += '<button class="btn sm ghost" id="ai">+ Új kifogás ehhez a szinthez</button>' + Admin.savebar();
    el.innerHTML = h;
    $("#kf", el).onchange = function () { Admin.kfFilter = this.value; Admin.kifogas(el); };
    $$("[data-re]", el).forEach(function (s) { s.addEventListener("change", function () { var ii = +s.getAttribute("data-f").split(".")[2], it = C.items[ii]; if (it.type === "mc" && !it.options) it.options = [{ t: "", ok: true, fb: "" }, { t: "", ok: false, fb: "" }]; if (it.type === "order" && !it.parts) it.parts = []; setTimeout(function () { Admin.kifogas(el); }, 0); }); });
    $$("[data-ao]", el).forEach(function (b) { b.onclick = function () { var it = C.items[+b.getAttribute("data-ao")]; (it.options = it.options || []).push({ t: "", ok: false, fb: "" }); Admin.mark(); Admin.kifogas(el); }; });
    $$("[data-do]", el).forEach(function (b) { b.onclick = function () { var p = b.getAttribute("data-do").split("."); C.items[+p[0]].options.splice(+p[1], 1); Admin.mark(); Admin.kifogas(el); }; });
    $$("[data-di]", el).forEach(function (b) { b.onclick = function () { if (!confirm("Törlöd ezt a kifogást?")) return; C.items.splice(+b.getAttribute("data-di"), 1); Admin.mark(); Admin.kifogas(el); }; });
    $$("[data-cr]", el).forEach(function (cb) { cb.onchange = function () { var it = C.items[+cb.getAttribute("data-cr")], a = it.criteria = it.criteria || []; var k = a.indexOf(cb.value); if (cb.checked && k < 0) a.push(cb.value); if (!cb.checked && k > -1) a.splice(k, 1); cb.parentNode.classList.toggle("ok", cb.checked); Admin.mark(); }; });
    $("#ai", el).onclick = function () { if (!f) return toast("Előbb hozz létre szintet."); C.items.push({ id: rid("i"), level: f, type: "mc", prompt: "", options: [{ t: "", ok: true, fb: "" }, { t: "", ok: false, fb: "" }], sample: "" }); Admin.mark(); Admin.kifogas(el); };
    Admin.bindFields(el); Admin.height();
  },

  ugyfel: function (el) {
    var C = Admin.C, h = '<p class="muted small">Az ügyféltípus határozza meg, hogyan reagál az ügyfél. A „Jellem” mezőt később az AI kapja meg szerepleírásként; a jó és rossz reakciók a teszt (helyi) módban és tartaléknak kellenek.</p>';
    C.clients.forEach(function (c, ci) {
      h += '<div class="card ed"><div class="row"><label>Név<input type="text" data-f="C.clients.' + ci + '.name" value="' + esc(c.name) + '"></label><label>Nehézség (1–3)<input type="number" min="1" max="3" data-f="C.clients.' + ci + '.level" value="' + (c.level || 1) + '"></label></div>' +
        '<label>Jellem (AI-nak)<textarea data-f="C.clients.' + ci + '.persona">' + esc(c.persona || "") + '</textarea></label>' +
        '<div class="row"><label>Reakció jó válaszra (soronként)<textarea data-arr data-f="C.clients.' + ci + '.pos">' + esc((c.pos || []).join("\n")) + '</textarea></label><label>Reakció gyenge válaszra (soronként)<textarea data-arr data-f="C.clients.' + ci + '.neg">' + esc((c.neg || []).join("\n")) + '</textarea></label></div>' +
        '<button class="del" data-dc="' + ci + '" style="justify-self:start">Ügyféltípus törlése</button></div>';
    });
    h += '<button class="btn sm ghost" id="ac">+ Új ügyféltípus</button>' + Admin.savebar();
    el.innerHTML = h;
    $$("[data-dc]", el).forEach(function (b) { b.onclick = function () { if (C.clients.length < 2) return toast("Legalább egy ügyféltípus kell."); if (!confirm("Törlöd?")) return; C.clients.splice(+b.getAttribute("data-dc"), 1); Admin.mark(); Admin.ugyfel(el); }; });
    $("#ac", el).onclick = function () { C.clients.push({ id: rid("c_"), name: "Új ügyfél", level: 1, persona: "", pos: [], neg: [] }); Admin.mark(); Admin.ugyfel(el); };
    Admin.bindFields(el); Admin.height();
  },

  szempont: function (el) {
    var C = Admin.C, h = '<p class="muted small">Ezek alapján értékel a szabad válaszoknál. Teszt módban kulcsszavakat keres (vesszővel vagy soronként), az AI később a leírást kapja meg. Különleges szabályok: kérdés = kérdéssel zárt-e; tömör = 8–70 szó, bizonytalankodás nélkül; konkrét = szám vagy kulcsszó.</p>';
    C.criteria.forEach(function (c, ci) {
      h += '<div class="card ed"><div class="row"><label>Szempont<input type="text" data-f="C.criteria.' + ci + '.name" value="' + esc(c.name) + '"></label><label>Csoport<select data-f="C.criteria.' + ci + '.group"><option value="kifogas"' + (c.group === "kifogas" ? " selected" : "") + '>Kifogáskezelés</option><option value="ajanlas"' + (c.group === "ajanlas" ? " selected" : "") + '>Ajánláskérés</option></select></label></div>' +
        '<label>Tanács, ha hiányzik<input type="text" data-f="C.criteria.' + ci + '.desc" value="' + esc(c.desc || "") + '"></label>' +
        '<div class="row"><label>Kulcsszavak<textarea data-arr data-f="C.criteria.' + ci + '.kw">' + esc((c.kw || []).join("\n")) + '</textarea></label><label>Különleges szabály<select data-f="C.criteria.' + ci + '.rule"><option value="">Nincs (kulcsszó)</option>' + [["kerdes", "Kérdés"], ["tomor", "Tömör"], ["konkret", "Konkrét"]].map(function (r) { return '<option value="' + r[0] + '"' + (c.rule === r[0] ? " selected" : "") + '>' + r[1] + '</option>'; }).join("") + '</select></label></div>' +
        '<button class="del" data-dk="' + ci + '" style="justify-self:start">Szempont törlése</button></div>';
    });
    h += '<button class="btn sm ghost" id="ak">+ Új szempont</button>' + Admin.savebar();
    el.innerHTML = h;
    $$("[data-dk]", el).forEach(function (b) { b.onclick = function () { if (!confirm("Törlöd?")) return; var id = C.criteria[+b.getAttribute("data-dk")].id; C.criteria.splice(+b.getAttribute("data-dk"), 1); C.items.forEach(function (i) { if (i.criteria) i.criteria = i.criteria.filter(function (x) { return x !== id; }); }); Admin.mark(); Admin.szempont(el); }; });
    $("#ak", el).onclick = function () { C.criteria.push({ id: rid("k_"), group: "kifogas", name: "Új szempont", desc: "", kw: [] }); Admin.mark(); Admin.szempont(el); };
    Admin.bindFields(el); Admin.height();
  },

  stat: function (el) {
    el.innerHTML = '<p class="muted">Betöltés…</p>';
    allUsers().then(function (us) {
      var d7 = addDays(today(), -6);
      us.sort(function (a, b) { return weekXp(b) - weekXp(a); });
      var h = '<div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>Munkatárs</th><th>Heti XP</th><th>Összes XP</th><th>Sorozat</th><th>Leckék</th><th>Átlag</th><th>Utoljára</th><th>Aktív napok (7)</th></tr>' +
        us.map(function (u) {
          var t = 0, s = 0; Object.keys(u.stats || {}).forEach(function (k) { t += u.stats[k].t; s += u.stats[k].s; });
          var live = u.lastDay === today() || u.lastDay === addDays(today(), -1) ? u.streak : 0, act = Object.keys(u.days || {}).filter(function (d) { return d >= d7; }).length;
          return '<tr><td><b>' + esc(u.name) + '</b></td><td>' + weekXp(u) + '</td><td>' + (u.xp || 0) + '</td><td>' + live + ' <span class="muted small">(max ' + (u.best || 0) + ')</span></td><td>' + (u.lessons || 0) + '</td><td>' + (t ? Math.round(s / t) + "%" : "–") + '</td><td>' + esc(u.lastDay || "–") + '</td><td>' + act + '</td></tr>';
        }).join("") + '</table></div>';
      // Elakadási pontok: kifogásonkénti átlag
      var agg = {};
      us.forEach(function (u) { Object.keys(u.stats || {}).forEach(function (k) { var a = agg[k] = agg[k] || { t: 0, s: 0, weak: [] }; a.t += u.stats[k].t; a.s += u.stats[k].s; if (u.weak && u.weak[k]) a.weak.push(u.name); }); });
      var rows = Object.keys(agg).map(function (k) { return { k: k, avg: Math.round(agg[k].s / agg[k].t), t: agg[k].t, weak: agg[k].weak, it: itemById(k) }; }).filter(function (r) { return r.it; }).sort(function (a, b) { return a.avg - b.avg; });
      h += '<h2>Hol akadnak el?</h2><div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>Kifogás</th><th>Témakör</th><th>Átlag</th><th>Próbák</th><th>Akiknél ismétlésre vár</th></tr>' +
        (rows.map(function (r) { return '<tr><td>' + esc(r.it.prompt) + '</td><td>' + esc((topicOf(r.it.level) || {}).title || "") + '</td><td><span class="pill ' + (r.avg < 60 ? "hot" : r.avg >= 85 ? "ok" : "") + '">' + r.avg + '%</span></td><td>' + r.t + '</td><td class="small">' + esc(r.weak.join(", ") || "–") + '</td></tr>'; }).join("") || '<tr><td colspan="5" class="muted">Még nincs adat.</td></tr>') + '</table></div>';
      el.innerHTML = h; Admin.height();
    }).catch(function () { el.innerHTML = '<p class="muted">Nem sikerült betölteni.</p>'; });
  },

  beall: function (el) {
    var c = Admin.cfg;
    el.innerHTML = '<div class="card ed"><label class="switch"><input type="checkbox" data-f="cfg.live"' + (c.live ? " checked" : "") + '><i></i><span><b>Élesítve a csapatnak</b><br><span class="small muted">Kikapcsolva csak itt, a vezetői felületen érhető el. Bekapcsolás és mentés után a munkatársak a saját belépésükkel nyithatják meg (kifogas.html).</span></span></label></div>' +
      '<div class="card ed"><label>AI-szolgáltató<select data-f="cfg.ai"><option value="helyi"' + (c.ai !== "gemini" ? " selected" : "") + '>Helyi (teszt): kulcsszavas értékelés</option><option value="gemini"' + (c.ai === "gemini" ? " selected" : "") + '>Gemini Flash (a háttéren át, API-kulcs kell)</option></select></label><span class="small muted">Ha a Gemini nem válaszol, automatikusan a helyi értékelés fut.</span></div>' +
      '<div class="card ed"><div class="row"><label>Napi cél (XP)<input type="number" min="10" data-f="cfg.dailyGoal" value="' + c.dailyGoal + '"></label><label>Kifogás / lecke<input type="number" min="2" max="6" data-f="cfg.lessonLen" value="' + c.lessonLen + '"></label></div><div class="row"><label>Gyors kártyák száma<input type="number" min="3" max="15" data-f="cfg.quickLen" value="' + c.quickLen + '"></label><label>Idő / kártya (mp)<input type="number" min="5" max="90" data-f="cfg.quickSec" value="' + c.quickSec + '"></label></div></div>' +
      '<div class="card ed"><b>Tartalom mentése és betöltése</b><span class="small muted">A teljes tartalom JSON-ként kimásolható és visszatölthető (pl. ha máshol, akár Geminivel készíted elő a kifogásokat).</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" id="ex">Kimásolás</button><button class="btn sm ghost" id="im">Betöltés JSON-ból</button><button class="btn sm ghost" id="df">Példatartalom visszaállítása</button></div><textarea id="js" hidden style="min-height:200px;font-family:ui-monospace,monospace;font-size:.8rem"></textarea></div>' +
      Admin.savebar();
    $("#ex", el).onclick = function () { var t = $("#js", el); t.hidden = false; t.value = JSON.stringify(Admin.C, null, 2); t.select(); try { navigator.clipboard.writeText(t.value); toast("Vágólapra másolva"); } catch (e) {} Admin.height(); };
    $("#im", el).onclick = function () { var t = $("#js", el); if (t.hidden || !t.value.trim()) { t.hidden = false; t.value = ""; t.placeholder = "Illeszd be a JSON-t, majd nyomd meg újra a Betöltést."; Admin.height(); return; }
      try { var o = JSON.parse(t.value); if (!o.topics || !o.items || !o.clients || !o.criteria) throw 0; Admin.C = o; Admin.mark(); toast("Betöltve. Ne felejts el menteni."); } catch (e) { toast("Hibás JSON: topics, items, clients, criteria kell."); } };
    $("#df", el).onclick = function () { if (!confirm("Felülírja a mostani tartalmat a példatartalommal (mentés után). Biztos?")) return; Admin.C = clone(DEFAULT_CONTENT); Admin.mark(); toast("Visszaállítva. Mentés után él."); };
    Admin.bindFields(el); Admin.height();
  }
};
// a szintkártyán a darabszám az admin másolatból számol
itemsOf = function (lid) { var src = document.body.classList.contains("admin-mode") && Admin.C ? Admin.C : S.C; return src.items.filter(function (i) { return i.level === lid; }); };

document.addEventListener("click", function (e) { var b = e.target.closest && e.target.closest(".say"); if (!b) return; var o = S.voice; S.voice = true; TTS.speak(b.getAttribute("data-t")).then(function () { S.voice = o; }); });
window.addEventListener("beforeunload", function (e) { if (Admin.dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", function () { if (document.body.classList.contains("admin-mode")) Admin.height(); });
boot();
})();
</script>
</body>
</html>
