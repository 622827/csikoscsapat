<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003366">
<title>Kifogáskezelő · Csikós csapat</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  KIFOGÁSKEZELŐ (béta)
  - Hozzáférés: béta alatt csak az ADMIN felületről (admin belépés + teljesítmény-jelszó a munkamenetben).
    Élesítés után a csapat-háttér (Apps Script, action=kk_init) adja ki a tár azonosítóját, ha az admin kapcsoló be van kapcsolva.
  - Adatok: Firestore perf/<tár>/kk_content (main, config) és perf/<tár>/kk_users/<felhasználó>.
  - AI: AI.* adapter. Alapból helyi (teszt) értékelés; "gemini" módban a háttér kk_ai műveletét hívja.
  - Felolvasás: TTS.* adapter, később profi hangszolgáltatásra cserélhető.
-->
<style>
:root {
  --bg: #f4f7fb; --surface: #ffffff; --ink: #003366; --muted: #4d6f94; --line: #dfe7f0;
  --brand: #003366; --on-brand: #fff; --hot: #cc0066; --hot-bg: #ffe6f2; --ok: #00806f; --ok-bg: #dff5f1;
  --sky: #6699cc; --gold: #e0a100; --track: #e5ebf2; --shadow: 0 1px 2px rgba(0,40,80,.06), 0 8px 24px rgba(0,40,80,.08);
  --r: 18px; --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #001a33; --surface: #002547; --ink: #f2f7ff; --muted: #8fb0d6; --line: #0d3a66; --brand: #ff99cc; --on-brand: #001f3d;
    --hot: #ff7ab6; --hot-bg: #3a0a2a; --ok: #5fd6c4; --ok-bg: #063a3a; --sky: #6699cc; --track: #0b355e; --shadow: 0 8px 24px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.4; min-height: 100vh; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(28px + var(--safe-b)); }
.admin-mode .wrap { max-width: 1000px; }

/* Felső sáv */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.admin-mode .top .in { max-width: 1000px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: .95rem; white-space: nowrap; }
.chip svg { width: 18px; height: 18px; }
.chip.streak svg { fill: var(--hot); } .chip.xp svg { fill: var(--sky); }
.chip.off { opacity: .55; filter: grayscale(1); }
.sp { flex: 1; }
.iconbtn { border: 0; background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.on { background: var(--brand); color: var(--on-brand); }

/* Kártyák, gombok */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; font-weight: 700; font-size: 1.05rem; padding: 15px 18px; border-radius: 14px;
  background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 70%, #000); transition: transform .08s, box-shadow .08s, opacity .2s; width: 100%; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--brand) 70%, #000); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
.btn.hot { background: var(--hot); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--hot) 65%, #000); }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 65%, #000); }
.btn.sm { font-size: .9rem; padding: 9px 12px; width: auto; border-radius: 11px; }
h1 { font-size: 1.7rem; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 4px; }
h2 { font-size: 1.15rem; margin: 26px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* Kezdőlap */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.ring { width: 84px; height: 84px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .bg { stroke: var(--track); } .ring .fg { stroke: var(--ok); transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82rem; text-align: center; line-height: 1.1; }
.lvlbar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.lvlbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), var(--brand)); border-radius: 99px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.mode { border: 0; text-align: left; cursor: pointer; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 14px; display: grid; gap: 4px; transition: transform .12s; position: relative; }
.mode:active { transform: scale(.97); }
.mode svg { width: 26px; height: 26px; stroke: var(--brand); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mode b { font-size: 1rem; } .mode span { font-size: .82rem; color: var(--muted); }
.mode .badge { position: absolute; top: 10px; right: 10px; background: var(--hot); color: #fff; font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; }

/* Tanösvény */
.topic { margin-top: 22px; }
.topic-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--brand); color: var(--on-brand); }
.topic-h b { font-size: 1.05rem; } .topic-h span { font-size: .82rem; opacity: .8; }
.path { position: relative; padding: 40px 0 4px; }
.node { --x: 0px; display: flex; flex-direction: column; align-items: center; margin: 14px auto; transform: translateX(var(--x)); width: 120px; }
.node button { width: 74px; height: 70px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: var(--brand); color: var(--on-brand);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--brand) 65%, #000); transition: transform .1s; }
.node button:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--brand) 65%, #000); }
.node button svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.node.locked button { background: var(--track); color: var(--muted); box-shadow: 0 6px 0 var(--line); cursor: default; }
.node.done button { background: var(--ok); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.node.next button { animation: pulse 1.8s infinite; }
.node small { margin-top: 10px; font-size: .78rem; font-weight: 600; text-align: center; color: var(--muted); }
.stars { display: flex; gap: 2px; margin-top: 4px; } .stars svg { width: 14px; height: 14px; fill: var(--track); } .stars svg.on { fill: var(--gold); }
@keyframes pulse { 0%,100% { outline: 0 solid color-mix(in srgb, var(--brand) 35%, transparent); } 50% { outline: 10px solid color-mix(in srgb, var(--brand) 0%, transparent); } }

/* Lecke */
.lesson { min-height: calc(100vh - 70px); display: flex; flex-direction: column; }
.prog { height: 14px; background: var(--track); border-radius: 99px; overflow: hidden; flex: 1; }
.prog i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); position: relative; }
.prog i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 9px; background: rgba(255,255,255,.35); }
.timer { height: 5px; background: var(--track); border-radius: 9px; overflow: hidden; margin-top: 8px; } .timer i { display: block; height: 100%; background: var(--hot); width: 100%; }
.client { display: flex; gap: 12px; align-items: flex-end; margin: 22px 0 16px; }
.ava { flex: none; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; color: #fff; background: var(--sky); position: relative; }
.ava > svg:not(.fig) { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 12px 14px; font-size: 1.08rem; box-shadow: var(--shadow); }
.bubble .who { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.bubble .say { border: 0; background: none; cursor: pointer; color: var(--sky); padding: 0; margin-left: 6px; vertical-align: middle; }
.bubble .say svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.me { margin: 10px 0 10px auto; max-width: 88%; background: var(--brand); color: var(--on-brand); border-radius: 18px 18px 4px 18px; padding: 12px 14px; }
.chat { display: flex; flex-direction: column; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
.task { font-weight: 700; margin: 4px 0 10px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s, border-color .15s, background .15s; font-size: 1rem; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt.sel { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 14%, var(--surface)); box-shadow: 0 3px 0 var(--sky); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--hot); background: var(--hot-bg); box-shadow: 0 3px 0 var(--hot); }
.zone { min-height: 64px; border-bottom: 2px solid var(--line); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.zone.ans { border-top: 2px solid var(--line); margin-bottom: 14px; min-height: 120px; }
.piece { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; cursor: grab; box-shadow: 0 3px 0 var(--line); font-size: .95rem; user-select: none; touch-action: none; transition: transform .15s; }
.piece.ghost { opacity: .25; } .piece.drag { position: fixed; z-index: 100; pointer-events: none; transform: scale(1.04) rotate(-1deg); box-shadow: var(--shadow); }
.piece.right { border-color: var(--ok); } .piece.wrong { border-color: var(--hot); }
textarea, input[type=text], input[type=number], select { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
textarea:focus, input:focus, select:focus { outline: 0; border-color: var(--sky); }
textarea { min-height: 110px; resize: vertical; }
.mic { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin: 10px 0; padding: 16px; border-radius: 16px; border: 2px dashed var(--sky); background: transparent; color: var(--ink); font-weight: 700; cursor: pointer; user-select: none; touch-action: none; }
.mic svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
.mic.rec { border-style: solid; border-color: var(--hot); background: var(--hot-bg); color: var(--hot); }
.mic.rec svg { animation: beat 1s infinite; } @keyframes beat { 50% { transform: scale(1.25); } }
.foot { margin-top: auto; padding-top: 16px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 18px 16px calc(18px + var(--safe-b)); transform: translateY(105%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s; }
.sheet.show { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); } .sheet .in { max-width: 560px; margin: 0 auto; }
.sheet.good { background: var(--ok-bg); } .sheet.bad { background: var(--hot-bg); } .sheet.mid { background: color-mix(in srgb, var(--gold) 18%, var(--surface)); }
.sheet h3 { margin: 0 0 6px; font-size: 1.25rem; } .sheet.good h3 { color: var(--ok); } .sheet.bad h3 { color: var(--hot); }
.sheet p { margin: 0 0 8px; } .sheet .sample { background: var(--surface); border-radius: 12px; padding: 10px 12px; margin: 8px 0 14px; font-size: .95rem; }
.sheet .sample b { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.shake { animation: shake .35s; } @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

/* Eredmény */
.result { text-align: center; padding-top: 24px; }
.score { font-size: 4rem; font-weight: 700; letter-spacing: -.04em; line-height: 1; margin: 12px 0 4px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.tiles3 div { border-radius: 14px; padding: 10px 6px; border: 2px solid var(--line); background: var(--surface); }
.tiles3 b { display: block; font-size: 1.3rem; } .tiles3 span { font-size: .75rem; color: var(--muted); }
.fb { text-align: left; margin-top: 12px; } .fb li { margin: 6px 0; } .fb ul { padding-left: 20px; margin: 6px 0; }
.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; } @keyframes pop { from { transform: scale(.4); opacity: 0; } }
.rise { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; } @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bdg { text-align: center; padding: 14px 6px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.bdg .ic { width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--gold), var(--hot)); }
.bdg .ic svg { width: 26px; height: 26px; fill: #fff; } .bdg.off { opacity: .4; } .bdg.off .ic { background: var(--track); }
.bdg b { font-size: .82rem; display: block; } .bdg span { font-size: .72rem; color: var(--muted); }
.rank { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); margin-bottom: 8px; box-shadow: var(--shadow); }
.rank .n { width: 28px; font-weight: 700; text-align: center; } .rank.me { outline: 2px solid var(--sky); } .rank .x { margin-left: auto; font-weight: 700; }
.rank .av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; background: var(--sky); }

/* Belépés / zárolt */
.center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
.center .card { max-width: 380px; }

/* Ablak, értesítés, konfetti */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center; background: rgba(0,20,40,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal.show { opacity: 1; pointer-events: auto; }
.modal .box { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + var(--safe-b)); max-height: 88vh; overflow: auto; transform: translateY(30px); transition: transform .25s; }
.modal.show .box { transform: none; }
.toast { position: fixed; left: 50%; top: 14px; z-index: 80; transform: translate(-50%, -80px); background: var(--brand); color: var(--on-brand); padding: 10px 16px; border-radius: 12px; font-weight: 600; transition: transform .3s; box-shadow: var(--shadow); max-width: 92vw; }
.toast.show { transform: translate(-50%, 0); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.view { animation: vin .28s cubic-bezier(.2,.8,.2,1); } @keyframes vin { from { opacity: 0; transform: translateY(8px); } }

/* Admin */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 10px 0 14px; }
.tabs button { border: 0; background: var(--surface); box-shadow: var(--shadow); padding: 9px 13px; border-radius: 11px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.tabs button.on { background: var(--brand); color: var(--on-brand); }
.ed { display: grid; gap: 10px; margin-bottom: 12px; }
.ed label { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.ed .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ed .row3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; align-items: end; }
.ed textarea { min-height: 70px; }
.optrow { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; border: 1px dashed var(--line); padding: 8px; border-radius: 12px; }
.optrow textarea { min-height: 44px; }
.del { border: 0; background: none; color: var(--hot); cursor: pointer; font-weight: 700; }
.savebar { position: sticky; bottom: 0; padding: 10px 0; background: linear-gradient(transparent, var(--bg) 30%); display: flex; gap: 8px; align-items: center; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; } .tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); } .tbl th { color: var(--muted); font-size: .78rem; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; } .switch input { display: none; }
.switch i { width: 52px; height: 30px; border-radius: 99px; background: var(--track); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + i { background: var(--ok); } .switch input:checked + i::after { transform: translateX(22px); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--muted); }
.pill.hot { background: var(--hot-bg); color: var(--hot); } .pill.ok { background: var(--ok-bg); color: var(--ok); }

/* 2. kör */
.ava { background: color-mix(in srgb, var(--sky) 22%, var(--surface)); overflow: hidden; }
.ava svg.fig { width: 100%; height: 100%; stroke: none; fill: initial; }
.ava.big { width: 84px; height: 84px; border-radius: 26px; } .ava.sm { width: 42px; height: 42px; border-radius: 14px; flex: none; }
.fig { transition: transform .3s; } .fig-happy { animation: hop .5s; } .fig-angry { animation: shake .35s; }
@keyframes hop { 40% { transform: translateY(-5px); } }
body.has-nav .wrap { padding-bottom: calc(96px + var(--safe-b)); }
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + var(--safe-b)); }
.bnav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.bnav button { border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .72rem; font-weight: 600; }
.bnav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bnav button.on { color: var(--brand); background: color-mix(in srgb, var(--sky) 16%, transparent); }
.chip.coin svg { width: 18px; height: 18px; }
.progw { flex: 1; position: relative; } .progw .prog { display: block; }
.combo { position: absolute; left: 4px; top: -15px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: var(--ok); opacity: 0; transition: opacity .2s; }
.combo.show { opacity: 1; } .combo.bump { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 800; letter-spacing: .06em; margin-top: 8px; }
.tag svg { width: 16px; height: 16px; fill: currentColor; } .tag.sky { color: var(--sky); } .tag.hot { color: var(--hot); } .tag.gold { color: var(--gold); }
.task { font-size: 1.3rem; margin: 6px 0 4px; }
.gapcard { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; font-size: 1.05rem; line-height: 1.6; }
.gapcard .who { display: block; font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.gap { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--sky); padding: 0 4px; font-weight: 700; color: var(--sky); transition: background .2s; }
.gap.fill { animation: pop .3s; } .gap.right { color: var(--ok); border-color: var(--ok); } .gap.wrong { color: var(--hot); border-color: var(--hot); }
.sh-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .sh-h h3 { margin: 0; }
.sh-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: currentColor; flex: none; }
.sheet.good .sh-ic { color: var(--ok); } .sheet.bad .sh-ic, .sheet.mid .sh-ic { color: var(--hot); } .sheet.mid .sh-ic { color: var(--gold); }
.sh-ic svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.sh-more { border: 0; background: none; color: var(--sky); font-weight: 700; cursor: pointer; font-size: .9rem; padding: 6px; }
.sh-det { margin-bottom: 6px; }
.topic-h { background: var(--tc); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--tc) 65%, #000); display: grid; gap: 2px; padding: 14px 16px; }
.topic-h span { font-size: .72rem; font-weight: 800; letter-spacing: .06em; opacity: .8; } .topic-h b { font-size: 1.2rem; }
.node { position: relative; }
.node button { width: 80px; height: 74px; background: var(--tc); box-shadow: 0 7px 0 color-mix(in srgb, var(--tc) 60%, #000); color: #fff; }
.node button svg { width: 32px; height: 32px; }
.node.done button { background: color-mix(in srgb, var(--tc) 75%, #fff); }
.node.spec button, .node.boss button { background: var(--surface); color: var(--tc); border: 3px solid var(--tc); box-shadow: 0 7px 0 color-mix(in srgb, var(--tc) 50%, var(--line)); }
.node.boss button { width: 92px; height: 84px; }
.node.chest button { border-radius: 20px; background: linear-gradient(#e7a93a, #b87414); box-shadow: 0 7px 0 #7a4c0a; } .node.chest.locked button { background: var(--track); box-shadow: 0 7px 0 var(--line); color: var(--muted); }
.node.chest.ready button { animation: wiggle 1.6s infinite; } .node.chest.opened button { opacity: .55; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-6deg); } 85% { transform: rotate(6deg); } }
.node.cur button { outline: 6px solid color-mix(in srgb, var(--tc) 30%, transparent); outline-offset: 6px; animation: none; }
.startb { position: absolute; top: -40px; background: var(--surface); color: var(--tc); border: 2px solid var(--line); font-weight: 800; font-size: .78rem; letter-spacing: .06em; padding: 6px 12px; border-radius: 12px; animation: bob 1.4s ease-in-out infinite; white-space: nowrap; }
.startb::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
@keyframes bob { 50% { transform: translateY(-4px); } }
.chestbig { width: 110px; height: 110px; margin: 0 auto; border-radius: 30px; display: grid; place-items: center; background: linear-gradient(#e7a93a, #b87414); }
.chestbig svg { width: 64px; height: 64px; fill: none; stroke: #fff; stroke-width: 2; }
.ccards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ccard { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 10px 6px 12px; cursor: pointer; display: grid; justify-items: center; gap: 6px; box-shadow: 0 3px 0 var(--line); }
.ccard.on { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); background: var(--ok-bg); } .ccard b { font-size: .82rem; text-align: center; line-height: 1.15; }
.dots { display: flex; gap: 3px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--track); } .dots i.on { background: var(--hot); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip2 { border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.chip2.on { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.hist { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 10px; margin-bottom: 8px; box-shadow: var(--shadow); } .hist > div:nth-child(2) { flex: 1; min-width: 0; }
.prof { display: flex; align-items: center; gap: 14px; } .prof .av { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.2rem; }
.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; } .wd { display: grid; justify-items: center; gap: 4px; font-size: .78rem; color: var(--muted); }
.wd i { width: 36px; height: 36px; border-radius: 50%; background: var(--track); display: grid; place-items: center; } .wd.on i { background: var(--hot); } .wd i svg { width: 18px; height: 18px; fill: #fff; }
.wd.t span { color: var(--ink); font-weight: 800; }
.inv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .inv .card { display: grid; justify-items: center; gap: 6px; text-align: center; }
.invic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--sky) 20%, var(--surface)); flex: none; }
.invic svg { width: 28px; height: 28px; fill: none; stroke: var(--sky); stroke-width: 2; stroke-linejoin: round; } .invic svg circle[fill] { stroke: none; }
.shopi { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; } .shopi > div:nth-child(2) { flex: 1; }
.btn svg { width: 18px; height: 18px; }
.empty { text-align: center; display: grid; justify-items: center; gap: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

}

/* Helyi (teszt) mód: kulcsszavas értékelés + ügyféltípusonkénti reakciók.

  backend: function (payload) {
    return fetch(TEAM_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action: "kk_ai", s: S.space, t: teamToken() }, payload)) })

  stat: function (el) {
    el.innerHTML = '<p class="muted">Betöltés…</p>';

      var d7 = addDays(today(), -6);
      us.sort(function (a, b) { return weekXp(b) - weekXp(a); });
      var h = '<div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>Munkatárs</th><th>Heti XP</th><th>Összes XP</th><th>Sorozat</th><th>Leckék</th><th>Átlag</th><th>Utoljára</th><th>Aktív napok (7)</th></tr>' +
        us.map(function (u) {
          var t = 0, s = 0; Object.keys(u.stats || {}).forEach(function (k) { t += u.stats[k].t; s += u.stats[k].s; });
          var live = u.lastDay === today() || u.lastDay === addDays(today(), -1) ? u.streak : 0, act = Object.keys(u.days || {}).filter(function (d) { return d >= d7; }).length;

        }).join("") + '</table></div>';
      // Elakadási pontok: kifogásonkénti átlag

      el.innerHTML = h; Admin.height();
    }).catch(function () { el.innerHTML = '<p class="muted">Nem sikerült betölteni.</p>'; });

boot();
