<style>
  html.csklock body > *:not(#csk-gate) { visibility: hidden !important; }
  html.csklock body { overflow: hidden; }
  #csk-gate { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--bg, #fff); color: var(--ink, #003366); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; visibility: visible; }
  #csk-gate form { width: 100%; max-width: 360px; }
  #csk-gate h1 { font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 8px; }
  #csk-gate p { color: var(--muted, #336699); margin: 0 0 22px; }
  #csk-gate input { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--track, #e5e5e5); background: var(--card, #e5e5e5); color: inherit; }
  #csk-gate input:focus { outline: 3px solid var(--accent, #003366); outline-offset: 2px; }
  #csk-gate button { width: 100%; margin-top: 12px; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; background: var(--accent, #003366); color: var(--on-accent, #fff); }
  #csk-gate button[disabled] { opacity: .6; cursor: wait; }
  #csk-gate .err { color: var(--hot, #cc0066); min-height: 1.4em; margin: 10px 0 0; font-size: .95rem; }

  body::before, #csk-gate::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--ink); opacity: .07;
    -webkit-mask: var(--hatter) 0 0 / 230px 230px; mask: var(--hatter) 0 0 / 230px 230px; }
  #csk-gate::before { position: absolute; z-index: 0; }
  #csk-gate > * { position: relative; z-index: 1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body::before, :root:not([data-theme="light"]) #csk-gate::before { opacity: .09; } }
  :root[data-theme="dark"] body::before, :root[data-theme="dark"] #csk-gate::before { opacity: .09; }
@media print { body::before { display: none; } }

<style>
  :root {
    --bg: #ffffff; --ink: #003366; --muted: #336699; --accent: #003366; --on-accent: #fff;
    --soft: #6699cc; --track: #e5e5e5; --card: #e5e5e5; --gold: #cc0066; --gold-bg: #ffe6f2; --ok: #006666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #001f3d; --ink: #ffffff; --muted: #6699cc; --accent: #ff99cc; --on-accent: #001f3d;
      --soft: #336699; --track: #00305a; --card: #003366; --gold: #ff99cc; --gold-bg: #3a0a2a; --ok: #66cccc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 80px 24px 24px;
         font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding-top: 40px; }
  h1 { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1; letter-spacing: -.03em; margin: 8px 0 8px; }
  h2 { font-size: clamp(1.15rem, 2.6vw, 1.5rem); margin: 36px 0 12px; }
  .lead { color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); margin: 0; max-width: 62ch; }
  .meta { color: var(--muted); font-size: .9rem; margin: 10px 0 0; min-height: 1.2em; }
  .msg { background: var(--card); border: 1px solid var(--track); border-radius: 14px; padding: 16px 18px; margin-top: 20px; }
  a { color: var(--accent); }


  /* ===== verseny plakát ===== */
  .poster { --pi: var(--ink); --pm: var(--muted); --pc: var(--card); --pl: var(--track);
    color: var(--pi); padding: 0; margin: 0 0 36px; }
  .poster h2.pt { text-align: center; font-size: clamp(1.8rem, 5.2vw, 3.4rem); letter-spacing: -.01em; margin: 0; line-height: 1.05; }
  .poster .pbadge { display: block; width: fit-content; margin: 14px auto 26px; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 8px 40px; font-size: clamp(.9rem, 2vw, 1.15rem); }
  .poster .pgrid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.1fr) minmax(0, .9fr); gap: 22px; align-items: start; }
  .poster .pcol { display: grid; gap: 22px; }
  .poster .lb { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .05em; color: var(--pm); text-transform: uppercase; }
  .poster .big { margin: 4px 0 0; font-weight: 700; font-size: clamp(1.1rem, 2.2vw, 1.5rem); text-transform: uppercase; }
  .poster .sm { margin: 4px 0 0; color: var(--pm); font-size: .95rem; }
  .poster .box { background: var(--pc); border: 1px solid var(--pl); border-radius: 14px; padding: 16px 18px; }
  .poster .box h3 { margin: 0 0 12px; font-size: .82rem; letter-spacing: .05em; text-transform: uppercase; }
  .poster .box ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .poster .box li { border-left: 3px solid var(--accent); padding: 3px 0 3px 10px; background: var(--bg); font-size: .95rem; }
  .poster .box li b { display: inline-block; min-width: 6.2em; }
  .poster .sec { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
  .poster svg { width: 30px; height: 30px; fill: none; stroke: var(--pi); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    document.addEventListener("click", function (ev) { if (!wrap.contains(ev.target)) set(false); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") set(false); });
  })();
</script>
