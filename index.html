<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csikós BL csapat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #003366; --muted: #336699; --accent: #003366;
    --track: #e5e5e5; --card: #e5e5e5; --hot: #ff3399;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #001f3d; --ink: #ffffff; --muted: #6699cc; --accent: #ff99cc; --track: #00305a; --card: #003366; --hot: #ff99cc; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 24px;
         font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 8px 0 48px; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .brand { font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: 700; margin: 0; }

  .hero { margin: clamp(36px, 8vw, 88px) 0 clamp(28px, 6vw, 56px); }
  .hero .lbl { color: var(--muted); font-size: clamp(1.05rem, 2.4vw, 1.5rem); margin: 0 0 6px; }
  .hero .when { font-size: clamp(3rem, 12.5vw, 9.5rem); font-weight: 700; line-height: .92; letter-spacing: -.045em;
                color: var(--accent); margin: 0; overflow-wrap: anywhere; }
  .hero .left { font-size: clamp(1.15rem, 3vw, 2rem); font-weight: 600; margin: 14px 0 0; }
  .hero .left span { color: var(--muted); font-weight: 400; }

  h2 { font-size: clamp(1.15rem, 2.4vw, 1.45rem); margin: 0 0 10px; }
  section + section { margin-top: clamp(32px, 6vw, 52px); }

  .closes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--track); }
  .closes li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 20px; align-items: baseline;
               padding: 12px 2px; border-bottom: 1px solid var(--track); font-size: clamp(1rem, 2vw, 1.15rem); }
  .closes .m { font-weight: 600; }
  .closes .d, .closes .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .closes li.next .m, .closes li.next .n { color: var(--accent); }
  .closes li.next .n { font-weight: 700; }
  .closes li.past { opacity: .5; }
  .closes li.q .m::after { content: " (negyedév zárása)"; font-weight: 400; color: var(--muted); }

  .links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--track); }
  .links li { border-bottom: 1px solid var(--track); }
  .links a { display: block; padding: 16px 2px; text-decoration: none; }
  .links a b { display: block; font-size: clamp(1.15rem, 2.6vw, 1.5rem); letter-spacing: -.01em; }
  .links a span { color: var(--muted); font-size: clamp(.95rem, 1.8vw, 1.05rem); }
  .links a:hover b { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .links a:hover { background: var(--card); }

  @media (max-width: 520px) {
    body { padding: 16px; }
    .closes li { grid-template-columns: minmax(0, 1fr) auto; }
    .closes .d { grid-column: 1; grid-row: 2; font-size: .92rem; }
    .closes .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
  }

  .news { margin: clamp(20px, 4vw, 32px) 0 0; display: grid; gap: 12px; }
  .news .item { background: var(--card); border-left: 6px solid var(--hot); border-radius: 12px;
                padding: 18px 20px; display: grid; gap: 6px 20px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .news .tag { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .news h2 { margin: 0; font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
  .news p.txt { margin: 0; color: var(--muted); font-size: 1.02rem; }
  .news p.miss { margin: 4px 0 0; font-weight: 600; font-size: .98rem; }
  .news p.miss:empty { display: none; }
  .news .btn { background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px;
               border-radius: 10px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .news .btn { color: #001f3d; } }
  @media (max-width: 600px) { .news .item { grid-template-columns: 1fr; } .news .btn { text-align: center; } }
</style>
</head>
<body>
<main>
  <p class="brand">Csikós BL csapat</p>

  <div class="news" id="news"></div>

  <div class="hero">
    <p class="lbl" id="h-lbl"></p>
    <h1 class="when" id="h-when"></h1>
    <p class="left" id="h-left"></p>
  </div>

  <section>
    <h2>Zárások</h2>
    <ol class="closes" id="closes"></ol>
  </section>

  <section>
    <h2>Gyorslinkek</h2>
    <ul class="links" id="links"></ul>
  </section>
</main>

<script>
  // ====== HÍREK: új hír = új blokk, törlés = a blokk törlése ======
  var SURVEY_API = "https://script.google.com/macros/s/AKfycbxsTMxAtO6Z7EvRNdRXBduYTD9T044_K627ePPqSKHRE22Upe5Ej2DEKSYk38jrrk3B9A/exec";
  var NEWS = [
    { tag: "Fontos – töltsd ki!", title: "2027. Erdély incentive kérdőív",
      text: "Egy perc az egész: írd meg, szeretnél-e jönni Erdélybe (2027. április 22–25.), és hogy autóval vagy repülővel csatlakoznál.",
      button: "Kitöltöm a kérdőívet", href: "https://forms.gle/LHhF8DjfFepu2SQb6", survey: true }
  ];
  function loadMissing(el) {
    fetch(SURVEY_API + "?kerdoiv=1&_=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error || !d.missing) return;
        if (d.missing.length === 0) { el.textContent = "Mindenki kitöltötte, köszönjük!"; return; }
        el.textContent = "Még nem töltötte ki (" + d.missing.length + "/" + d.total + "): " + d.missing.join(", ");
      })
      .catch(function () {});
  }
  (function () {
    var box = document.getElementById("news");
    NEWS.forEach(function (n) {
      var item = document.createElement("div"); item.className = "item";
      var left = document.createElement("div");
      var t = document.createElement("p"); t.className = "tag"; t.textContent = n.tag; left.appendChild(t);
      var h = document.createElement("h2"); h.textContent = n.title; left.appendChild(h);
      var p = document.createElement("p"); p.className = "txt"; p.textContent = n.text; left.appendChild(p);
      var miss = null;
      if (n.survey) { miss = document.createElement("p"); miss.className = "miss"; left.appendChild(miss); loadMissing(miss); }
      item.appendChild(left);
      if (n.href) {
        var a = document.createElement("a"); a.className = "btn"; a.href = n.href; a.target = "_blank"; a.rel = "noopener";
        a.textContent = n.button || "Megnyitom"; item.appendChild(a);
      }
      box.appendChild(item);
    });
  })();

  // ====== EZT A LISTÁT SZERKESZD: új link = új sor ======
  var LINKS = [
    { title: "Számláló", desc: "Negyedéves állás a 11 000 ES-es vállaláshoz és a 12 500 ES-es célhoz.", href: "negyedev.html" },
    { title: "Cégbemutató", desc: "OVB Magyarország – elemző segédlet (9 dia).", href: "cegbemutato.html" },
    { title: "Versenyállás", desc: "Q4 verseny: havi rangsorok, pontok és a kvalifikáció állása.", href: "verseny.html" },
    { title: "Pipeline és dicsőségfal", desc: "A csapat Google-táblázata minden munkatárs lapjával.",
      href: "https://docs.google.com/spreadsheets/d/1YKwZYWzi1nBNX3HQCDXUlKeovPqnMce0A4C4hnYFaHY/edit" }
  ];
  // =====================================================

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  // A termelési hónap zárása a következő hónap első keddje.
  function firstTuesday(year, month) {
    var d = new Date(year, month, 1);
    return new Date(year, month, 1 + ((2 - d.getDay() + 7) % 7), 23, 59, 59);
  }
  var monthAdj = ["januári", "februári", "márciusi", "áprilisi", "májusi", "júniusi",
                  "júliusi", "augusztusi", "szeptemberi", "októberi", "novemberi", "decemberi"];
  function fmt(d) { return d.toLocaleDateString("hu-HU", { year: "numeric", month: "long", day: "numeric" }) + ", kedd"; }
  function daysTo(d) { return Math.max(0, Math.ceil((d - now) / 86400000)); }
  function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
  function dayWord(n) { return n === 0 ? "ma" : n === 1 ? "holnap" : n + " nap"; }

  var now = new Date();

  // A zárások listája: az utolsó lezárt hónaptól az utána következő három zárásig.
  var all = [];
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    for (var m = 0; m < 12; m++) {
      var prodMonth = (m + 11) % 12;                 // a lezáródó termelési hónap
      var closeDate = firstTuesday(y, m);
      all.push({ date: closeDate, month: prodMonth, quarter: prodMonth % 3 === 2 });
    }
  }
  all.sort(function (a, b) { return a.date - b.date; });
  var nextIdx = 0;
  while (nextIdx < all.length && all[nextIdx].date < now) nextIdx++;
  var next = all[nextIdx];

  $("h-lbl").textContent = "Következő zárás: " + monthAdj[next.month] + (next.quarter ? " és negyedéves" : "");
  $("h-when").textContent = next.date.toLocaleDateString("hu-HU", { month: "long", day: "numeric" });
  var n0 = daysTo(next.date);
  $("h-left").textContent = "";
  $("h-left").appendChild(document.createTextNode(sameDay(next.date, now) ? "Ma van a zárás" : dayWord(n0)));
  if (!sameDay(next.date, now) && n0 > 1) $("h-left").appendChild(el("span", "", " van hátra"));
  else if (n0 === 1) $("h-left").appendChild(el("span", "", " van a zárás"));

  var list = $("closes");
  var shown = all.slice(Math.max(0, nextIdx - 1), nextIdx + 4);
  shown.forEach(function (c, i) {
    var past = c.date < now;
    var li = el("li", (past ? "past " : "") + (c === next ? "next " : "") + (c.quarter ? "q" : ""));
    li.appendChild(el("span", "m", monthAdj[c.month].charAt(0).toUpperCase() + monthAdj[c.month].slice(1) + " zárás"));
    li.appendChild(el("span", "d", fmt(c.date)));
    li.appendChild(el("span", "n", past ? "lezárva" : sameDay(c.date, now) ? "ma" : daysTo(c.date) + " nap"));
    list.appendChild(li);
  });

  var ul = $("links");
  LINKS.forEach(function (l) {
    var li = el("li"), a = el("a");
    a.href = l.href;
    if (/^https?:/.test(l.href)) { a.target = "_blank"; a.rel = "noopener"; }
    a.appendChild(el("b", "", l.title));
    a.appendChild(el("span", "", l.desc));
    li.appendChild(a); ul.appendChild(li);
  });
</script>
</body>
</html>
