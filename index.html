<style>
  html.csklock body > *:not(#csk-gate) { visibility: hidden !important; }
  html.csklock body { overflow: hidden; }
  #csk-gate { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--bg, #fff); color: var(--ink, #003366); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; visibility: visible; }
  #csk-gate form { width: 100%; max-width: 360px; }
  #csk-gate h1 { font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 8px; }
  #csk-gate p { color: var(--muted, #336699); margin: 0 0 22px; }
  #csk-gate input { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--track, #e5e5e5); background: var(--card, #e5e5e5); color: inherit; }
  #csk-gate input:focus { outline: 3px solid var(--accent, #003366); outline-offset: 2px; }
  #csk-gate button { width: 100%; margin-top: 12px; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; background: var(--accent, #003366); color: var(--on-accent, #fff); }
  #csk-gate button[disabled] { opacity: .6; cursor: wait; }
  #csk-gate .err { color: var(--hot, #cc0066); min-height: 1.4em; margin: 10px 0 0; font-size: .95rem; }

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbxQ-h6UZiyIp6StErApri4EaGcIYmYhCKjX5ufz_MnD3MuDqYe1tGlT330PKHjaq5WaoQ/exec";
  var K = "csk_token", tok = "", root = document.documentElement, of = window.fetch.bind(window);
  function ckGet() { var m = document.cookie.match(/(?:^|; )csk_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ""; }
  function ckSet(v) {
    var h = location.hostname.replace(/^www\./, ""), dom = /^[\d.]+$|^localhost$/.test(h) || !h ? "" : "; domain=." + h;
    document.cookie = "csk_token=" + (v ? encodeURIComponent(v) : "") + dom + "; path=/; max-age=" + (v ? 31536000 : 0) + "; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : "");
  }
  try { tok = localStorage.getItem(K) || ""; } catch (e) {}
  if (!tok) tok = ckGet();
  if (tok) { try { localStorage.setItem(K, tok); } catch (e) {} ckSet(tok); }
  if (!tok) root.classList.add("csklock");

  window.fetch = function (u, o) {
    var s = typeof u === "string" ? u : (u && u.url) || "";
    if (s.indexOf("AKfycbxQ-h6UZiyI") < 0 || s.indexOf("login=") > -1) return of(u, o);
    s += (s.indexOf("?") > -1 ? "&" : "?") + "t=" + encodeURIComponent(tok);
    return of(s, o).then(function (r) {
      r.clone().json().then(function (d) { if (d && d.error === "auth") lock(); }).catch(function () {});
      return r;
    });
  };

  function lock() {
    try { localStorage.removeItem(K); } catch (e) {} ckSet("");
    tok = ""; root.classList.add("csklock"); build();
  }
  function build() {
    if (document.getElementById("csk-gate")) return;
    if (!document.body) { document.addEventListener("DOMContentLoaded", build); return; }
    var g = document.createElement("div"); g.id = "csk-gate";
    g.innerHTML = '<form autocomplete="on"><h1>Csikós csapat</h1><p>Add meg a jelszót a belépéshez.</p>' +
      '<input type="password" id="csk-pw" placeholder="Jelszó" autocomplete="current-password" autofocus>' +
      '<button type="submit">Belépés</button><p class="err" id="csk-err" role="alert"></p></form>';
    document.body.appendChild(g);
    var f = g.querySelector("form"), pw = g.querySelector("#csk-pw"), btn = g.querySelector("button"), er = g.querySelector("#csk-err");
    setTimeout(function () { pw.focus(); }, 50);
    f.addEventListener("submit", function (ev) {
      ev.preventDefault(); if (!pw.value) return;
      btn.disabled = true; er.textContent = "";
      of(API + "?login=" + encodeURIComponent(pw.value) + "&_=" + Date.now())
        .then(function (r) { return r.json(); })

  }

  main { max-width: 1000px; margin: 0 auto; padding: 8px 0 48px; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .brand { font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: 700; margin: 0; }

  .hero { margin: clamp(36px, 8vw, 88px) 0 clamp(28px, 6vw, 56px); }
  .hero .lbl { color: var(--muted); font-size: clamp(1.05rem, 2.4vw, 1.5rem); margin: 0 0 6px; }
  .hero .when { font-size: clamp(3rem, 12.5vw, 9.5rem); font-weight: 700; line-height: .92; letter-spacing: -.045em;
                color: var(--accent); margin: 0; overflow-wrap: anywhere; }
  .hero .left { font-size: clamp(1.15rem, 3vw, 2rem); font-weight: 600; margin: 14px 0 0; }
  .hero .left span { color: var(--muted); font-weight: 400; }

  h2 { font-size: clamp(1.15rem, 2.4vw, 1.45rem); margin: 0 0 10px; }
  section + section { margin-top: clamp(32px, 6vw, 52px); }

  .closes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--track); }
  .closes li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 20px; align-items: baseline;
               padding: 12px 2px; border-bottom: 1px solid var(--track); font-size: clamp(1rem, 2vw, 1.15rem); }
  .closes .m { font-weight: 600; }
  .closes .d, .closes .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .closes li.next .m, .closes li.next .n { color: var(--accent); }
  .closes li.next .n { font-weight: 700; }
  .closes li.past { opacity: .5; }
  .closes li.q .m::after { content: " (negyedév zárása)"; font-weight: 400; color: var(--muted); }

  .links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--track); }
  .links li { border-bottom: 1px solid var(--track); }
  .links a { display: block; padding: 16px 2px; text-decoration: none; }
  .links a b { display: block; font-size: clamp(1.15rem, 2.6vw, 1.5rem); letter-spacing: -.01em; }
  .links a span { color: var(--muted); font-size: clamp(.95rem, 1.8vw, 1.05rem); }
  .links a:hover b { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .links a:hover { background: var(--card); }

  @media (max-width: 520px) {
    body { padding: 16px; }
    .closes li { grid-template-columns: minmax(0, 1fr) auto; }
    .closes .d { grid-column: 1; grid-row: 2; font-size: .92rem; }
    .closes .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
  }

  .news { margin: clamp(20px, 4vw, 32px) 0 0; display: grid; gap: 12px; }
  .news .item { background: var(--card); border-left: 6px solid var(--hot); border-radius: 12px;
                padding: 18px 20px; display: grid; gap: 6px 20px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .news .tag { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .news h2 { margin: 0; font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
  .news p.txt { margin: 0; color: var(--muted); font-size: 1.02rem; }
  .news p.miss { margin: 4px 0 0; font-weight: 600; font-size: .98rem; }
  .news p.miss:empty { display: none; }
  .news .btn { background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px;
               border-radius: 10px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .news .btn { color: #001f3d; } }
  @media (max-width: 600px) { .news .item { grid-template-columns: 1fr; } .news .btn { text-align: center; } }

  .topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--track); }
  .topnav .in { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 20px; }
  .topnav .brand { font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap; font-size: 1.05rem; margin: 0; }
  .topnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .topnav ul::-webkit-scrollbar { display: none; }
  .topnav li a { display: block; padding: 8px 14px; border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 600;
                 font-size: .95rem; white-space: nowrap; }
  .topnav li a:hover { background: var(--track); }
  .topnav li a[aria-current="page"] { background: var(--accent); color: var(--on-accent, #fff); }
  .topnav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .topnav .brand { display: none; } .topnav .in { gap: 0; padding: 0 8px; } }

  .zm { position: relative; margin-left: auto; flex: none; }
  .zm > button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 0; cursor: pointer;
                 background: var(--card); color: var(--ink); font: inherit; font-weight: 700; font-size: .95rem; white-space: nowrap; }
  .zm > button:hover { filter: brightness(.96); }
  .zm > button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .zm .badge { background: var(--accent); color: var(--on-accent, #fff); border-radius: 999px; padding: 2px 9px; font-size: .82rem; }
  .zm .panel { position: absolute; right: 0; top: calc(100% + 10px); width: min(340px, calc(100vw - 16px)); background: var(--bg); color: var(--ink);
               border: 1px solid var(--track); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 8px 14px 12px; }
  .zm .panel[hidden] { display: none; }
  .zm .panel h3 { margin: 6px 0 4px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .zm .panel ol { list-style: none; margin: 0; padding: 0; }
  .zm .panel li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 9px 0; border-bottom: 1px solid var(--track); }
  .zm .panel li:last-child { border-bottom: 0; }
  .zm .panel .m { font-weight: 700; } .zm .panel .d { color: var(--muted); font-size: .88rem; grid-column: 1; }
  .zm .panel .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 700; }
  .zm .panel li.past { opacity: .5; } .zm .panel li.next .n { color: var(--accent); }
  .zm.dv { margin-left: auto; } .zm.dv + .zm { margin-left: 8px; }
  body.home .zm.dv { display: block; }
  .zm.dv .panel { width: min(300px, calc(100vw - 16px)); }
  .zm.dv .panel a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 10px 0; color: inherit; text-decoration: none; border-bottom: 1px solid var(--track); }
  .zm.dv .panel a:last-child { border-bottom: 0; }
  .zm.dv .panel a:hover .m { color: var(--accent); }
  .zm.dv .panel a .go { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 700; color: var(--accent); }
  @media (max-width: 640px) { .zm > button { padding: 8px 10px; } .zm .lbl { display: none; } }

  main { max-width: 1240px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
  .side { position: sticky; top: 76px; align-self: start; }
  .side-in { background: var(--card); border-radius: 14px; padding: 16px 18px 8px; max-height: calc(100vh - 100px); overflow: auto; }
  .side h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .side .closes { border-top: 0; }
  .side .closes li { grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 11px 0; font-size: 1rem; border-bottom: 1px solid var(--track); align-items: center; }
  .side .closes li:last-child { border-bottom: 0; }
  .side .closes .m { color: var(--ink); }
  .side .closes .d { grid-column: 1; grid-row: 2; font-size: .88rem; }
  .side .closes .n { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; color: var(--ink); }
  .side .closes li.q .m::after { content: " (negyedéves)"; }
  .side .closes li.ev .m::before { content: "★ "; color: var(--hot); }
  .side .closes li.ev .m { color: var(--ink); }
  body.home .zm { display: none; }
  body.home .topnav .in { max-width: 1240px; padding: 0 0; }
  body.home .topnav { padding: 0 24px; }
  .hero { margin-top: clamp(24px, 5vw, 56px); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .side { position: static; order: -1; }
    .side-in { max-height: none; }
  }

  /* betöltés-jelző: vékony futó csík az oldal tetején */
  .ldbar { position: fixed; left: 0; right: 0; top: 0; height: 4px; z-index: 1000; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .4s; }
  body.loading .ldbar { opacity: 1; }
  .ldbar::before { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; border-radius: 4px; background: var(--hot, var(--accent)); animation: ldmove 1.15s ease-in-out infinite; }
  @keyframes ldmove { 0% { left: -40%; } 100% { left: 100%; } }
  @keyframes ldpulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .ldbar::before { animation-duration: 3s; } body.loading .ldp { animation: none !important; } }

  /* beúszó szövegek */
  @keyframes swimin { from { opacity: 0; transform: translateY(22px); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .news .item, .hero > *, .col section > h2, .links li, .side-in > h2, .side .closes li {
    animation: swimin .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms + 80ms);
  }
  .news .item:nth-child(1) { --i: 0; } .news .item:nth-child(2) { --i: 1; } .news .item:nth-child(3) { --i: 2; } .news .item:nth-child(4) { --i: 3; }
  .hero > :nth-child(1) { --i: 2; } .hero > :nth-child(2) { --i: 3; } .hero > :nth-child(3) { --i: 4; }
  .col section > h2 { --i: 5; }
  .links li:nth-child(1) { --i: 6; } .links li:nth-child(2) { --i: 7; } .links li:nth-child(3) { --i: 8; } .links li:nth-child(4) { --i: 9; } .links li:nth-child(5) { --i: 10; }
  .side-in > h2 { --i: 1; }
  .side .closes li:nth-child(1) { --i: 2; } .side .closes li:nth-child(2) { --i: 3; } .side .closes li:nth-child(3) { --i: 4; }
  .side .closes li:nth-child(4) { --i: 5; } .side .closes li:nth-child(5) { --i: 6; } .side .closes li:nth-child(n+6) { --i: 7; }
  @media (prefers-reduced-motion: reduce) {
    .news .item, .hero > *, .col section > h2, .links li, .side-in > h2, .side .closes li { animation: none; }
  }
  .side .closes.noanim li { animation: none; }

  /* színkódok: igazgatósági rendezvény = rózsaszín (Berry) + oroszlán-logó */
  :root { --igaz: #cc0066; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --igaz: #ff99cc; } }

  /* negyedéves állás a főoldalon */
  .qc { display: block; text-decoration: none; color: inherit; margin: 0 0 40px; }
  .qc .qlbl { color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.4rem); margin: 0 0 8px; }
  .qc .qnum { font-size: clamp(4.5rem, 18vw, 12rem); font-weight: 700; line-height: .95; letter-spacing: -.04em; color: var(--accent); font-variant-numeric: tabular-nums; margin: 0; }
  .qc .qnum.busy { animation: ldpulse 1.2s ease-in-out infinite; }
  .qc .qgoal { font-size: clamp(1.1rem, 3vw, 2.2rem); font-weight: 600; margin: 8px 0 0; }
  .qc .qgoal span { color: var(--muted); font-weight: 400; }
  .qc .qbar { position: relative; height: 20px; background: var(--track); border-radius: 10px; overflow: hidden; margin: 22px 0 0; }
  .qc .qfill { display: flex; height: 100%; }
  .qc .qfill span, .qc .qoutl span { height: 100%; flex: none; width: 0; transition: width 1.2s ease-out; }
  .qc .qoutl { position: absolute; inset: 0; display: flex; pointer-events: none; }
  .qc .csk { background: var(--csk); } .qc .frk { background: var(--frk); }
  .qc .qoutl .csk, .qc .qoutl .frk { opacity: .3; }
  .qc .qwrap { position: relative; }
  .qc .qmark { position: absolute; top: 14px; bottom: -8px; width: 3px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); }
  .qc:hover .qnum { filter: brightness(1.1); }
  .qc:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; border-radius: 8px; }
  .qc { animation: swimin .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: .6s; }

  /* Málna kiemelés: kérdőív-kártyák széle és a határidők */
  :root { --mal: #cc0066; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mal: #ff3d7f; } }
  :root[data-theme="dark"] { --mal: #ff3d7f; }
  .news .item { border-left-color: var(--mal); }
  .news .tag { color: var(--mal); }
  .closes .n, .side .closes .n, .closes li.next .n, .closes li.next .m { color: var(--mal); }
  .qc .qwrap { margin-bottom: 44px; }
  .qc .qmark .qmlbl { position: absolute; top: 100%; right: -2px; margin-top: 4px; white-space: nowrap; text-align: right; font-size: .9rem; font-weight: 600; line-height: 1.2; color: var(--ink); }
  .side .closes li.ev a.m { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
  .side .closes li.ev a.m:hover, .side .closes li.ev a.m:focus-visible { text-decoration-thickness: 2px; }
  .side .closes li.hasinfo { cursor: help; }
  .side .closes li.hasinfo .m::after { content: " ⓘ"; font-size: .85em; color: var(--muted); font-weight: 400; }
  .evtip { position: fixed; z-index: 100000; width: min(340px, calc(100vw - 16px)); background: var(--card); color: var(--ink); border: 1px solid var(--track); border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 34px rgba(0,0,0,.35); font-size: .92rem; line-height: 1.4; pointer-events: none; }
  .evtip .evh { display: block; font-size: 1rem; margin: 0 0 8px; color: var(--mal); }
  .evtip .evr { margin: 0 0 6px; } .evtip .evk { font-weight: 700; }
  .evtip .evf { margin: 8px 0 0; color: var(--muted); font-size: .85rem; }
  .news .item.red { border-left: 8px solid var(--red); background: color-mix(in srgb, var(--red) 10%, var(--card)); box-shadow: 0 0 0 2px var(--red) inset; }
  .news .item.red .tag { color: var(--red); }
  .news .item.red h2 { color: var(--red); }
  .news .item.green { --grn: #1f9d55; border-left: 8px solid var(--grn); background: color-mix(in srgb, var(--grn) 12%, var(--card)); box-shadow: 0 0 0 2px var(--grn) inset; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .news .item.green { --grn: #3ddc84; } }
  :root[data-theme="dark"] .news .item.green { --grn: #3ddc84; }
  .news .item.green .tag, .news .item.green h2 { color: var(--grn); }
  .news .item.green .btn { background: var(--grn); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .news .item.green .btn { color: #00220f; } }
  :root[data-theme="dark"] .news .item.green .btn { color: #00220f; }
  :root { --red: #d6213a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --red: #ff5a6e; } }
  :root[data-theme="dark"] { --red: #ff5a6e; }
