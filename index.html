<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csikós BL csapat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #003366; --muted: #336699; --accent: #003366;
    --track: #e5e5e5; --card: #e5e5e5; --hot: #ff3399; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #001f3d; --ink: #ffffff; --muted: #6699cc; --accent: #ff99cc; --track: #00305a; --card: #003366; --hot: #ff99cc; --on-accent: #001f3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 80px 24px 24px;
         font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 8px 0 48px; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .brand { font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: 700; margin: 0; }

  .hero { margin: clamp(36px, 8vw, 88px) 0 clamp(28px, 6vw, 56px); }
  .hero .lbl { color: var(--muted); font-size: clamp(1.05rem, 2.4vw, 1.5rem); margin: 0 0 6px; }
  .hero .when { font-size: clamp(3rem, 12.5vw, 9.5rem); font-weight: 700; line-height: .92; letter-spacing: -.045em;
                color: var(--accent); margin: 0; overflow-wrap: anywhere; }
  .hero .left { font-size: clamp(1.15rem, 3vw, 2rem); font-weight: 600; margin: 14px 0 0; }
  .hero .left span { color: var(--muted); font-weight: 400; }

  h2 { font-size: clamp(1.15rem, 2.4vw, 1.45rem); margin: 0 0 10px; }
  section + section { margin-top: clamp(32px, 6vw, 52px); }

  .closes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--track); }
  .closes li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 20px; align-items: baseline;
               padding: 12px 2px; border-bottom: 1px solid var(--track); font-size: clamp(1rem, 2vw, 1.15rem); }
  .closes .m { font-weight: 600; }
  .closes .d, .closes .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .closes li.next .m, .closes li.next .n { color: var(--accent); }
  .closes li.next .n { font-weight: 700; }
  .closes li.past { opacity: .5; }
  .closes li.q .m::after { content: " (negyedév zárása)"; font-weight: 400; color: var(--muted); }

  .links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--track); }
  .links li { border-bottom: 1px solid var(--track); }
  .links a { display: block; padding: 16px 2px; text-decoration: none; }
  .links a b { display: block; font-size: clamp(1.15rem, 2.6vw, 1.5rem); letter-spacing: -.01em; }
  .links a span { color: var(--muted); font-size: clamp(.95rem, 1.8vw, 1.05rem); }
  .links a:hover b { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .links a:hover { background: var(--card); }

  @media (max-width: 520px) {
    body { padding: 16px; }
    .closes li { grid-template-columns: minmax(0, 1fr) auto; }
    .closes .d { grid-column: 1; grid-row: 2; font-size: .92rem; }
    .closes .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
  }

  .news { margin: clamp(20px, 4vw, 32px) 0 0; display: grid; gap: 12px; }
  .news .item { background: var(--card); border-left: 6px solid var(--hot); border-radius: 12px;
                padding: 18px 20px; display: grid; gap: 6px 20px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .news .tag { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .news h2 { margin: 0; font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
  .news p.txt { margin: 0; color: var(--muted); font-size: 1.02rem; }
  .news p.miss { margin: 4px 0 0; font-weight: 600; font-size: .98rem; }
  .news p.miss:empty { display: none; }
  .news .btn { background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px;
               border-radius: 10px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .news .btn { color: #001f3d; } }
  @media (max-width: 600px) { .news .item { grid-template-columns: 1fr; } .news .btn { text-align: center; } }

  .topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--track); }
  .topnav .in { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 20px; }
  .topnav .brand { font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap; font-size: 1.05rem; margin: 0; }
  .topnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .topnav ul::-webkit-scrollbar { display: none; }
  .topnav li a { display: block; padding: 8px 14px; border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 600;
                 font-size: .95rem; white-space: nowrap; }
  .topnav li a:hover { background: var(--track); }
  .topnav li a[aria-current="page"] { background: var(--accent); color: var(--on-accent, #fff); }
  .topnav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .topnav .brand { display: none; } .topnav .in { gap: 0; padding: 0 8px; } }

  .zm { position: relative; margin-left: auto; flex: none; }
  .zm > button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 0; cursor: pointer;
                 background: var(--card); color: var(--ink); font: inherit; font-weight: 700; font-size: .95rem; white-space: nowrap; }
  .zm > button:hover { filter: brightness(.96); }
  .zm > button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .zm .badge { background: var(--accent); color: var(--on-accent, #fff); border-radius: 999px; padding: 2px 9px; font-size: .82rem; }
  .zm .panel { position: absolute; right: 0; top: calc(100% + 10px); width: min(340px, calc(100vw - 16px)); background: var(--bg); color: var(--ink);
               border: 1px solid var(--track); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 8px 14px 12px; }
  .zm .panel[hidden] { display: none; }
  .zm .panel h3 { margin: 6px 0 4px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .zm .panel ol { list-style: none; margin: 0; padding: 0; }
  .zm .panel li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 9px 0; border-bottom: 1px solid var(--track); }
  .zm .panel li:last-child { border-bottom: 0; }
  .zm .panel .m { font-weight: 700; } .zm .panel .d { color: var(--muted); font-size: .88rem; grid-column: 1; }
  .zm .panel .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 700; }
  .zm .panel li.past { opacity: .5; } .zm .panel li.next .n { color: var(--accent); }
  @media (max-width: 640px) { .zm > button { padding: 8px 10px; } .zm .lbl { display: none; } }

  main { max-width: 1240px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
  .side { position: sticky; top: 76px; align-self: start; }
  .side-in { background: var(--card); border-radius: 14px; padding: 16px 18px 8px; max-height: calc(100vh - 100px); overflow: auto; }
  .side h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .side .closes { border-top: 0; }
  .side .closes li { grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 11px 0; font-size: 1rem; border-bottom: 1px solid var(--track); align-items: center; }
  .side .closes li:last-child { border-bottom: 0; }
  .side .closes .m { color: var(--ink); }
  .side .closes .d { grid-column: 1; grid-row: 2; font-size: .88rem; }
  .side .closes .n { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; color: var(--ink); }
  .side .closes li.q .m::after { content: " (negyedéves)"; }
  .side .closes li.ev .m::before { content: "★ "; color: var(--hot); }
  .side .closes li.ev .m { color: var(--ink); }
  body.home .zm { display: none; }
  body.home .topnav .in { max-width: 1240px; padding: 0 0; }
  body.home .topnav { padding: 0 24px; }
  .hero { margin-top: clamp(24px, 5vw, 56px); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .side { position: static; order: -1; }
    .side-in { max-height: none; }
  }
</style>
</head>
<body class="home">
<nav class="topnav" aria-label="Főmenü"><div class="in"><a class="brand" href="index.html">Csikós BL csapat</a><ul><li><a href="index.html" aria-current="page">Kezdőlap</a></li><li><a href="negyedev.html">Negyedéves cél</a></li><li><a href="verseny.html">Versenyállások</a></li><li><a href="cegbemutato.html">Cégbemutató</a></li><li><a href="https://docs.google.com/spreadsheets/d/1YKwZYWzi1nBNX3HQCDXUlKeovPqnMce0A4C4hnYFaHY/edit" target="_blank" rel="noopener">Pipeline ↗</a></li></ul></div></nav>
<main>
  <div class="layout">
    <div class="col">
      <div class="news" id="news"></div>

      <div class="hero">
        <p class="lbl" id="h-lbl"></p>
        <h1 class="when" id="h-when"></h1>
        <p class="left" id="h-left"></p>
      </div>

      <section>
        <h2>Gyorslinkek</h2>
        <ul class="links" id="links"></ul>
      </section>
    </div>

    <aside class="side" aria-label="Fontos események">
      <div class="side-in">
        <h2>Fontos események</h2>
        <ol class="closes" id="closes"></ol>
      </div>
    </aside>
  </div>
</main>

<script>
  // ====== HÍREK: új hír = új blokk, törlés = a blokk törlése ======
  var SURVEY_API = "https://script.google.com/macros/s/AKfycbxsTMxAtO6Z7EvRNdRXBduYTD9T044_K627ePPqSKHRE22Upe5Ej2DEKSYk38jrrk3B9A/exec";
  var NEWS = [
    { tag: "Fontos – töltsd ki!", title: "2027. Erdély incentive kérdőív",
      text: "Egy perc az egész: írd meg, szeretnél-e jönni Erdélybe (2027. április 22–25.), és hogy autóval vagy repülővel csatlakoznál.",
      button: "Kitöltöm a kérdőívet", href: "https://forms.gle/LHhF8DjfFepu2SQb6", survey: true }
  ];
  function loadMissing(el) {
    fetch(SURVEY_API + "?kerdoiv=1&_=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error || !d.missing) return;
        if (d.missing.length === 0) { el.textContent = "Mindenki kitöltötte, köszönjük!"; return; }
        el.textContent = "Még nem töltötte ki (" + d.missing.length + "/" + d.total + "): " + d.missing.join(", ");
      })
      .catch(function () {});
  }
  (function () {
    var box = document.getElementById("news");
    NEWS.forEach(function (n) {
      var item = document.createElement("div"); item.className = "item";
      var left = document.createElement("div");
      var t = document.createElement("p"); t.className = "tag"; t.textContent = n.tag; left.appendChild(t);
      var h = document.createElement("h2"); h.textContent = n.title; left.appendChild(h);
      var p = document.createElement("p"); p.className = "txt"; p.textContent = n.text; left.appendChild(p);
      var miss = null;
      if (n.survey) { miss = document.createElement("p"); miss.className = "miss"; left.appendChild(miss); loadMissing(miss); }
      item.appendChild(left);
      if (n.href) {
        var a = document.createElement("a"); a.className = "btn"; a.href = n.href; a.target = "_blank"; a.rel = "noopener";
        a.textContent = n.button || "Megnyitom"; item.appendChild(a);
      }
      box.appendChild(item);
    });
  })();

  // ====== EZT A LISTÁT SZERKESZD: új link = új sor ======
  var LINKS = [
    { title: "Negyedéves cél", desc: "Negyedéves állás a 11 000 ES-es vállaláshoz és a 12 500 ES-es célhoz.", href: "negyedev.html" },
    { title: "Versenyállások", desc: "Q4 verseny: havi rangsorok, pontok és a kvalifikáció állása.", href: "verseny.html" },
    { title: "Pipeline és dicsőségfal", desc: "A csapat Google-táblázata minden munkatárs lapjával.",
      href: "https://docs.google.com/spreadsheets/d/1YKwZYWzi1nBNX3HQCDXUlKeovPqnMce0A4C4hnYFaHY/edit" }
  ];
  // =====================================================

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  // A termelési hónap zárása a következő hónap első keddje.
  function firstTuesday(year, month) {
    var d = new Date(year, month, 1);
    return new Date(year, month, 1 + ((2 - d.getDay() + 7) % 7), 23, 59, 59);
  }
  var monthAdj = ["januári", "februári", "márciusi", "áprilisi", "májusi", "júniusi",
                  "júliusi", "augusztusi", "szeptemberi", "októberi", "novemberi", "decemberi"];
  function fmt(d) { return d.toLocaleDateString("hu-HU", { year: "numeric", month: "long", day: "numeric" }) + ", kedd"; }
  function daysTo(d) { return Math.max(0, Math.ceil((d - now) / 86400000)); }
  function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
  function dayWord(n) { return n === 0 ? "ma" : n === 1 ? "holnap" : n + " nap"; }

  var now = new Date();

  // A zárások listája: az utolsó lezárt hónaptól az utána következő három zárásig.
  var all = [];
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    for (var m = 0; m < 12; m++) {
      var prodMonth = (m + 11) % 12;                 // a lezáródó termelési hónap
      var closeDate = firstTuesday(y, m);
      all.push({ date: closeDate, month: prodMonth, quarter: prodMonth % 3 === 2 });
    }
  }
  all.sort(function (a, b) { return a.date - b.date; });
  var nextIdx = 0;
  while (nextIdx < all.length && all[nextIdx].date < now) nextIdx++;
  var next = all[nextIdx];

  $("h-lbl").textContent = "Következő zárás: " + monthAdj[next.month] + (next.quarter ? " és negyedéves" : "");
  $("h-when").textContent = next.date.toLocaleDateString("hu-HU", { month: "long", day: "numeric" });
  var n0 = daysTo(next.date);
  $("h-left").textContent = "";
  $("h-left").appendChild(document.createTextNode(sameDay(next.date, now) ? "Ma van a zárás" : dayWord(n0)));
  if (!sameDay(next.date, now) && n0 > 1) $("h-left").appendChild(el("span", "", " van hátra"));
  else if (n0 === 1) $("h-left").appendChild(el("span", "", " van a zárás"));

  // Egyéb fontos események (szerkeszd: új esemény = új sor)
  var EVENTS = [
    { date: new Date(2027, 3, 22, 23, 59, 59), title: "Erdély incentive út", dateText: "2027. április 22–25." }
  ];

  var list = $("closes");
  var items = all.slice(Math.max(0, nextIdx - 1), nextIdx + 4).map(function (c) { return { date: c.date, close: c }; });
  EVENTS.forEach(function (ev) { if (ev.date >= now) items.push({ date: ev.date, ev: ev }); });
  items.sort(function (x, y) { return x.date - y.date; });
  items.forEach(function (it) {
    var past = it.date < now;
    if (it.ev) {
      var lie = el("li", "ev");
      lie.appendChild(el("span", "m", it.ev.title));
      lie.appendChild(el("span", "d", it.ev.dateText));
      lie.appendChild(el("span", "n", sameDay(it.date, now) ? "ma" : daysTo(it.date) + " nap"));
      list.appendChild(lie); return;
    }
    var c = it.close;
    var li = el("li", (past ? "past " : "") + (c === next ? "next " : "") + (c.quarter ? "q" : ""));
    li.appendChild(el("span", "m", monthAdj[c.month].charAt(0).toUpperCase() + monthAdj[c.month].slice(1) + " zárás"));
    li.appendChild(el("span", "d", fmt(c.date)));
    li.appendChild(el("span", "n", past ? "lezárva" : sameDay(c.date, now) ? "ma" : daysTo(c.date) + " nap"));
    list.appendChild(li);
  });

  var ul = $("links");
  LINKS.forEach(function (l) {
    var li = el("li"), a = el("a");
    a.href = l.href;
    if (/^https?:/.test(l.href)) { a.target = "_blank"; a.rel = "noopener"; }
    a.appendChild(el("b", "", l.title));
    a.appendChild(el("span", "", l.desc));
    li.appendChild(a); ul.appendChild(li);
  });
</script>
<script>
  (function () {
    var host = document.querySelector(".topnav .in"); if (!host) return;
    var now = new Date();
    function ft(y, m) { var d = new Date(y, m, 1); return new Date(y, m, 1 + ((2 - d.getDay() + 7) % 7), 23, 59, 59); }
    var adj = ["januári","februári","márciusi","áprilisi","májusi","júniusi","júliusi","augusztusi","szeptemberi","októberi","novemberi","decemberi"];
    var all = [];
    for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) for (var m = 0; m < 12; m++) {
      var pm = (m + 11) % 12; all.push({ date: ft(y, m), month: pm, quarter: pm % 3 === 2 });
    }
    all.sort(function (a, b) { return a.date - b.date; });
    var ni = 0; while (ni < all.length && all[ni].date < now) ni++;
    function days(d) { return Math.max(0, Math.ceil((d - now) / 86400000)); }
    function same(a, b) { return a.toDateString() === b.toDateString(); }
    function word(d) { return same(d, now) ? "ma" : days(d) === 1 ? "holnap" : days(d) + " nap"; }
    function e(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; }
    var wrap = e("div", "zm"), btn = e("button"), panel = e("div", "panel");
    btn.type = "button"; btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-haspopup", "true");
    btn.appendChild(e("span", "lbl", "Zárások")); btn.appendChild(e("span", "badge", word(all[ni].date))); btn.appendChild(e("span", "", "▾"));
    btn.title = "Következő zárás: " + all[ni].date.toLocaleDateString("hu-HU", { month: "long", day: "numeric" });
    panel.hidden = true; panel.appendChild(e("h3", "", "Zárások"));
    var ol = e("ol");
    all.slice(Math.max(0, ni - 1), ni + 4).forEach(function (c, i) {
      var past = c.date < now, li = e("li", (past ? "past " : "") + (c === all[ni] ? "next" : ""));
      li.appendChild(e("span", "m", adj[c.month].charAt(0).toUpperCase() + adj[c.month].slice(1) + " zárás" + (c.quarter ? " (negyedéves)" : "")));
      li.appendChild(e("span", "d", c.date.toLocaleDateString("hu-HU", { year: "numeric", month: "long", day: "numeric" }) + ", kedd"));
      li.appendChild(e("span", "n", past ? "lezárva" : word(c.date)));
      ol.appendChild(li);
    });
    panel.appendChild(ol); wrap.appendChild(btn); wrap.appendChild(panel); host.appendChild(wrap);
    function set(open) { panel.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false"); }
    btn.addEventListener("click", function (ev) { ev.stopPropagation(); set(panel.hidden); });
    document.addEventListener("click", function (ev) { if (!wrap.contains(ev.target)) set(false); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") set(false); });
    var a = document.querySelector('.topnav [aria-current="page"]'); if (a && a.scrollIntoView) { try { a.scrollIntoView({ inline: "center", block: "nearest" }); } catch (x) {} }
  })();
</script>
</body>
</html>
