  :root { --bg: #001f3d; --ink: #ffffff; --muted: #99bbdd; --accent: #ff99cc; --on-accent: #001f3d; --track: #00305a; --card: #003366; --ok: #66cccc; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 40px 16px 48px; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--accent); opacity: .07; -webkit-mask: var(--hatter) 0 0 / 240px 240px; mask: var(--hatter) 0 0 / 240px 240px; }
  main { max-width: 1240px; margin: 0 auto; }
  #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
  #list > .msg { grid-column: 1 / -1; }
  @media (max-width: 860px) { #list { grid-template-columns: 1fr; } }
  h1 { font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 18px; }
  .lead { color: var(--muted); font-size: 1.05rem; margin: 0 0 22px; max-width: 62ch; }
  .msg { color: var(--muted); }
  .p { background: var(--card); border: 3px solid var(--accent); border-radius: 18px; padding: 18px; margin-top: 0; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transform: translateY(12px); animation: in .55s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .ph b { font-size: 1.25rem; }
  .ph span { color: var(--muted); font-size: .9rem; }
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .t { border-radius: 14px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--track); }
  .t.got { border-color: #2fbf71; }
  .t.tot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); } .t.tot small, .t.tot span { color: var(--on-accent); opacity: .8; }
  .sum { grid-template-columns: 1fr 1fr; } .t.tot { grid-column: 1 / -1; } .t.tot strong, .t.tot.got strong { color: var(--on-accent); }
  .ck { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--track); position: relative; overflow: hidden; }
  .ck > * { position: relative; } .ck::before { content: ""; position: absolute; inset: 0; background: rgba(79,224,143,.22); transform: scaleX(0); transform-origin: left; }
  .ck.done::before { transform: scaleX(1); animation: fill .7s cubic-bezier(.2,.7,.2,1); }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .ck .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
  .ck.done .box { background: #4fe08f; border-color: #4fe08f; color: #003; }
  .ck b { flex: 1; font-size: .95rem; } .ck em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
  .t small { display: block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .t strong { display: block; font-size: clamp(1.4rem, 4.5vw, 1.9rem); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .t.got strong { color: #4fe08f; }
  .t span { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .r { margin-top: 12px; }
  .rh { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; }
  .rh em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rh.ok b::before { content: "✓ "; color: #4fe08f; }
  .bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .bar.ok i { background: #4fe08f; }
  .upd { color: var(--muted); font-size: .8rem; margin-top: 22px; }
  @media (max-width: 480px) { .sum { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .p { animation: none; opacity: 1; transform: none; } .bar i { transition: none; } }
</style>
</head>

<main>
  <h1>Start bónusz</h1>
  <div id="list"><p class="msg">Betöltés…</p></div>
  <p class="upd" id="upd"></p>
