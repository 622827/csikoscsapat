<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Webshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --ink:#003366; --muted:#336699; --accent:#003366; --on-accent:#ffffff; --track:#e5e5e5; --card:#f0f3f7; --hot:#cc0066; --ok:#006666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#001f3d; --ink:#ffffff; --muted:#6699cc; --accent:#ff99cc; --on-accent:#001f3d; --track:#00305a; --card:#00305a; --hot:#ff99cc; --ok:#66cccc; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: clamp(1.9rem, 7vw, 2.6rem); letter-spacing: -.03em; line-height: 1.05; margin: 0 0 8px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; }
  label.f { display: block; font-weight: 600; font-size: .92rem; margin: 12px 0 0; }
  label.f:first-of-type { margin-top: 0; }
  input[type=text], input[type=tel], input[type=email], select, textarea { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px; margin-top: 4px; border-radius: 12px; border: 2px solid var(--track); background: var(--bg); color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=file] { width: 100%; margin-top: 6px; font: inherit; color: var(--ink); }
  .chk { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--track); border-radius: 12px; background: var(--bg); font-weight: 700; cursor: pointer; margin-top: 8px; }
  .chk:first-of-type { margin-top: 0; }
  .chk input { width: 22px; height: 22px; accent-color: var(--accent); }
  .opt { margin-top: 12px; }
  .opt h2 { color: var(--muted); font-weight: 600; font-size: .95rem; }
  .prev { max-width: 160px; max-height: 160px; border-radius: 10px; margin-top: 8px; display: block; }
  button.primary { font: inherit; font-weight: 700; font-size: 1.05rem; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; background: var(--accent); color: var(--on-accent); }
  button[disabled] { opacity: .6; cursor: wait; }
  .err { color: var(--hot); min-height: 1.4em; margin: 0; font-weight: 600; }
  .ok { color: var(--ok); font-weight: 700; }
  .small { color: var(--muted); font-size: .88rem; }
  #gate { position: fixed; inset: 0; z-index: 99; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #gate form { width: 100%; max-width: 340px; }
  #gate input { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--track); background: var(--bg); color: var(--ink); }
  #gate button { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<div id="gate">
  <form id="gform" autocomplete="off">
    <h1>Webshop</h1>
    <p class="lead">Add meg a jelszót a belépéshez.</p>
    <input id="gpw" type="password" placeholder="Jelszó" autocomplete="off" aria-label="Jelszó">
    <button class="primary" type="submit">Belépés</button>
    <p class="err" id="gerr" role="alert"></p>
  </form>
</div>

<main id="app" hidden>
  <h1>Webshop</h1>
  <p class="lead">Töltsd ki a rendelést.</p>
  <form id="f" novalidate>
    <div class="card">
      <h2>Megrendelő</h2>
      <label class="f">Név<input type="text" id="m-nev" autocomplete="off"></label>
      <label class="f">Telefonszám<input type="tel" id="m-tel" autocomplete="off" placeholder="+36 30 123 4567"></label>
      <label class="f">E-mail cím<input type="email" id="m-mail" autocomplete="off"></label>
    </div>

    <div class="card">
      <h2>Mit rendelsz?</h2>
      <label class="chk"><input type="checkbox" id="c-nj"> Névjegykártya</label>
      <label class="chk"><input type="checkbox" id="c-pe"> Pezsgő</label>
      <label class="chk"><input type="checkbox" id="c-ku"> Kulcstartó</label>

      <div class="opt" id="o-nj" hidden>
        <h2>Névjegykártya</h2>
        <label class="f">MT neve<input type="text" id="nj-nev" autocomplete="off" placeholder="Vezetéknév Keresztnév"></label>
        <label class="f">Pozíció a névjegykártyán<input type="text" id="nj-poz" autocomplete="off"></label>
        <label class="f">MT telefonszáma<input type="tel" id="nj-tel" autocomplete="off" placeholder="+36 30 123 4567"></label>
        <label class="f">MT e-mail címe<input type="email" id="nj-mail" autocomplete="off"></label>
      </div>

      <div class="opt" id="o-pe" hidden>
        <h2>Pezsgő</h2>
        <label class="f">Darabszám
          <select id="pe-db"><option value="">Válassz…</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </label>
      </div>

      <div class="opt" id="o-ku" hidden>
        <h2>Kulcstartó</h2>
        <label class="f">MT neve<input type="text" id="ku-nev" autocomplete="off" placeholder="Vezetéknév Keresztnév"></label>
        <label class="f">Kép (kötelező)<input type="file" id="ku-kep" accept="image/*"></label>
        <img class="prev" id="ku-prev" alt="" hidden>
      </div>
    </div>

    <div class="card">
      <label class="f">Megjegyzés<textarea id="megj"></textarea></label>
    </div>

    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit" id="send">Rendelés elküldése</button>
    <p class="small" id="ok" role="status"></p>
  </form>
</main>

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbxQ-h6UZiyIp6StErApri4EaGcIYmYhCKjX5ufz_MnD3MuDqYe1tGlT330PKHjaq5WaoQ/exec";
  function $(i) { return document.getElementById(i); }

  /* ---- jelszó ---- */
  function sha(s) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    });
  }
  var PW = "";
  var H = "de3ed7b298cfb618a5fea46905da7eeca6aefece545520f2b24fd19e86b83bb2";
  function open() { $("gate").hidden = true; $("app").hidden = false; }
  try { if (sessionStorage.getItem("ws_ok") === H) { PW = sessionStorage.getItem("ws_pw") || ""; open(); } } catch (e) {}
  $("gform").addEventListener("submit", function (ev) {
    ev.preventDefault();
    sha($("gpw").value.trim()).then(function (h) {
      if (h === H) { PW = $("gpw").value.trim(); try { sessionStorage.setItem("ws_ok", H); sessionStorage.setItem("ws_pw", PW); } catch (e) {} $("gerr").textContent = ""; open(); }
      else { $("gerr").textContent = "Hibás jelszó."; $("gpw").select(); }
    });
  });

  /* ---- űrlap ---- */
  [["c-nj", "o-nj"], ["c-pe", "o-pe"], ["c-ku", "o-ku"]].forEach(function (p) {
    $(p[0]).addEventListener("change", function () { $(p[1]).hidden = !this.checked; });
  });

  function ascii(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z\s-]/g, "").trim(); }
  var mailDirty = false;
  $("nj-mail").addEventListener("input", function () { mailDirty = this.value !== ""; });
  $("nj-nev").addEventListener("input", function () {
    if (mailDirty) return;
    var w = ascii(this.value).split(/\s+/).filter(Boolean);
    $("nj-mail").value = w.length >= 2 ? w.join(".") + ".ovb@gmail.com" : "";
  });

  function phone(v) {
    var d = String(v || "").replace(/[^\d+]/g, "");
    if (d.indexOf("+36") === 0) d = d.slice(1); else if (d.indexOf("06") === 0) d = "36" + d.slice(2);
    return /^36(20|30|31|70|50|51)\d{7}$/.test(d) ? "+" + d : "";
  }
  var mailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  var IMG = "";
  function shrink(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onerror = function () { rej(new Error("A kép nem olvasható.")); };
      r.onload = function () {
        var im = new Image();
        im.onerror = function () { rej(new Error("A fájl nem kép.")); };
        im.onload = function () {
          var m = 1600, k = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement("canvas");
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.85));
        };
        im.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  $("ku-kep").addEventListener("change", function () {
    IMG = ""; $("ku-prev").hidden = true;
    var f = this.files && this.files[0]; if (!f) return;
    shrink(f).then(function (d) { IMG = d; $("ku-prev").src = d; $("ku-prev").hidden = false; })
      .catch(function (e) { $("err").textContent = e.message; $("ku-kep").value = ""; });
  });

  function err(t) { $("err").textContent = t || ""; return false; }
  $("f").addEventListener("submit", function (ev) {
    ev.preventDefault(); $("ok").textContent = "";
    var v = function (id) { return $(id).value.trim(); };
    if (!v("m-nev")) return err("Add meg a megrendelő nevét.");
    if (!phone(v("m-tel"))) return err("A megrendelő telefonszáma legyen magyar mobilszám.");
    if (!mailRe.test(v("m-mail"))) return err("A megrendelő e-mail címe hibás.");
    var nj = $("c-nj").checked, pe = $("c-pe").checked, ku = $("c-ku").checked;
    if (!nj && !pe && !ku) return err("Jelölj be legalább egy terméket.");
    var o = { megrendelo: { nev: v("m-nev"), tel: phone(v("m-tel")), email: v("m-mail") }, megjegyzes: v("megj") };
    if (nj) {
      if (!v("nj-nev") || !v("nj-poz")) return err("Névjegykártya: add meg az MT nevét és a pozíciót.");
      if (!phone(v("nj-tel"))) return err("Névjegykártya: az MT telefonszáma legyen magyar mobilszám.");
      if (!mailRe.test(v("nj-mail"))) return err("Névjegykártya: az MT e-mail címe hibás.");
      o.nevjegykartya = { nev: v("nj-nev"), pozicio: v("nj-poz"), tel: phone(v("nj-tel")), email: v("nj-mail") };
    }
    if (pe) {
      if (!v("pe-db")) return err("Pezsgő: válaszd ki a darabszámot.");
      o.pezsgo = { db: Number(v("pe-db")) };
    }
    if (ku) {
      if (!v("ku-nev")) return err("Kulcstartó: add meg az MT nevét.");
      if (!IMG) return err("Kulcstartó: tölts fel egy képet, enélkül nem küldhető el.");
      o.kulcstarto = { nev: v("ku-nev"), kep: IMG };
    }
    err(""); var b = $("send"); b.disabled = true; $("ok").textContent = "Küldés…";
    fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ webshop: 1, pw: PW, order: o }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        b.disabled = false;
        if (d && d.ok) { $("ok").className = "ok"; $("ok").textContent = "Köszönjük, a rendelést megkaptuk."; $("f").reset(); IMG = ""; $("ku-prev").hidden = true; mailDirty = false; ["o-nj", "o-pe", "o-ku"].forEach(function (i) { $(i).hidden = true; }); }
        else { $("ok").textContent = ""; err((d && d.error) || "Nem sikerült elküldeni."); }
      }).catch(function () { b.disabled = false; $("ok").textContent = ""; err("Nem sikerült csatlakozni, próbáld újra."); });
  });
})();
</script>
</body>
</html>
