  :root { --bg: #001f3d; --ink: #ffffff; --muted: #99bbdd; --accent: #ff99cc; --on-accent: #001f3d; --track: #00305a; --card: #003366; --ok: #66cccc; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 40px 16px 48px; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--accent); opacity: .07; -webkit-mask: var(--hatter) 0 0 / 240px 240px; mask: var(--hatter) 0 0 / 240px 240px; }
  main { max-width: 1240px; margin: 0 auto; }
  h1 { font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 12px; }
  .lead { color: var(--muted); font-size: 1.05rem; margin: 0 0 22px; max-width: 70ch; }
  .msg { color: var(--muted); }
  #grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
  @media (max-width: 860px) { #grid { grid-template-columns: 1fr; } }
  .c { background: var(--card); border: 3px solid var(--track); border-radius: 18px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .c.now { border-color: var(--accent); }
  .ch { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .ch small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: .78rem; }
  .ch h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.01em; }
  .badge { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--track); color: var(--muted); white-space: nowrap; }
  .badge.f { border-color: var(--accent); color: var(--accent); } .badge.k { border-color: #4fe08f; color: #4fe08f; }
  .mq { margin: 6px 0 12px; font-size: 1.05rem; font-weight: 600; }
  dl { margin: 0; display: grid; gap: 10px; }
  dt { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  dd { margin: 2px 0 0; font-size: .95rem; line-height: 1.4; }
  .upd { color: var(--muted); font-size: .8rem; margin-top: 22px; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; color: var(--muted); }
  .bar a { color: var(--accent); font-weight: 700; }
  .sv { font-size: .85rem; } .sv.ok { color: #4fe08f; }
  .f { display: grid; gap: 4px; margin-top: 10px; }
  .f label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .f input, .f textarea, .f select { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 2px solid var(--track); border-radius: 10px; padding: 8px 10px; resize: none; overflow: hidden; }
  .f input:focus, .f textarea:focus, .f select:focus { outline: none; border-color: var(--accent); }
  .ch .f { margin: 0; } .ch select { width: auto; }
  html.emb body { padding: 0 0 24px; } html.emb body::before { display: none; } html.emb h1, html.emb .lead { display: none; }
