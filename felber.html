  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--accent); opacity: .07; -webkit-mask: var(--hatter) 0 0 / 240px 240px; mask: var(--hatter) 0 0 / 240px 240px; }
  .on-logos { position: fixed; top: 14px; left: 16px; z-index: 50; display: flex; gap: 8px; }
  .on-logos a { display: inline-flex; width: 42px; height: 42px; border-radius: 50%; align-items: center; justify-content: center; background: #eaf3ff; transition: transform .18s ease, box-shadow .2s ease; }
  .on-logos a:hover { transform: scale(1.1); }
  .on-logos a.on { box-shadow: 0 0 0 3px var(--accent); }
  .on-logos a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .on-logos .lg-k { display: block; width: 32px; height: 32px; background: #003366; -webkit-mask: url(ikon/csikos-96.png) center/contain no-repeat; mask: url(ikon/csikos-96.png) center/contain no-repeat; }
  .on-logos .lg-v { display: block; width: 28px; height: 28px; background: #0f7a45; -webkit-mask: url(ikon/villam-96.png) center/contain no-repeat; mask: url(ikon/villam-96.png) center/contain no-repeat; }
  .on-logos img { width: 32px; height: 32px; display: block; }
  .card { text-align: center; background: var(--card); border: 3px solid var(--accent); border-radius: 24px; padding: clamp(28px, 6vw, 56px) clamp(22px, 6vw, 64px); box-shadow: 0 10px 40px rgba(0,0,0,.3); max-width: 560px; width: 100%; opacity: 0; transform: translateY(14px); animation: in .7s cubic-bezier(.2,.8,.2,1) .1s forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .bolt { width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: ring 2.4s ease-out 1s infinite; }
  .bolt span { width: 58px; height: 58px; background: linear-gradient(160deg, var(--blue), var(--accent)); -webkit-mask: url(ikon/villam-96.png) center/contain no-repeat; mask: url(ikon/villam-96.png) center/contain no-repeat; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,.55); } 100% { box-shadow: 0 0 0 26px rgba(61,220,132,0); } }
  h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 12px; }
  .soon { display: inline-block; font-weight: 700; font-size: clamp(1.1rem, 3.5vw, 1.4rem); color: var(--bg); background: var(--accent); padding: 8px 26px; border-radius: 999px; letter-spacing: .02em; }
  .bar { height: 6px; border-radius: 999px; margin: 26px auto 0; max-width: 260px; background: linear-gradient(90deg, var(--blue), #ffffff, var(--accent)); background-size: 200% 100%; animation: flow 3s linear infinite; }
  @keyframes flow { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .card, .bolt, .bar { animation: none; opacity: 1; transform: none; } }
