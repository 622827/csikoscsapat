<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negyedéves számláló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #003366;
    --muted: #336699;
    --accent: #003366;
    --on-accent: #ffffff;
    --time: #6699cc;
    --track: #e5e5e5;
    --card: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #001f3d;
      --ink: #ffffff;
      --muted: #6699cc;
      --accent: #ff99cc;
      --on-accent: #001f3d;
      --time: #336699;
      --track: #00305a;
      --card: #003366;
    }
  }
  * { box-sizing: border-box; }
  html { margin: 0; }
  body {
    margin: 0;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: 80px 24px 24px;
  }
  main { width: 100%; max-width: 1100px; padding-top: 48px; }

  .add-btn {
    position: absolute; top: 72px; right: 16px;
    font: inherit; font-weight: 700; font-size: 1rem;
    background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:focus-visible, .btn:focus-visible, dialog input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .quarter { color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.4rem); margin: 0 0 8px; }
  .number {
    font-size: clamp(5rem, 24vw, 20rem);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -0.04em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .goal { font-size: clamp(1.1rem, 3vw, 2.2rem); font-weight: 600; margin: 8px 0 8px; }
  .goal span { color: var(--muted); font-weight: 400; }

  .cap { color: var(--muted); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; margin: 20px 0 0; }

  .scale { position: relative; }
  .bar { position: relative; height: 20px; background: var(--track); border-radius: 10px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 10px; transition: width 1.2s ease-out; }
  .fill.units { background: var(--accent); }
  .fill.time { background: var(--time); }
  .ms-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bg); opacity: .85; transform: translateX(-1px); }
  .tag { position: absolute; font-size: clamp(.85rem, 1.8vw, 1.1rem); white-space: nowrap; line-height: 1.25; }
  .tag b { font-weight: 700; }
  .tag span { color: var(--muted); }

  /* idősáv */
  .scale.time { padding: 8px 0 78px; }
  .tick { position: absolute; top: 2px; height: 32px; width: 3px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); }
  .tick.last { transform: translateX(-100%); }
  .tick-label { top: 40px; transform: translateX(-50%); text-align: center; font-size: clamp(.78rem, 1.6vw, 1rem); }
  .tick-label.last { transform: translateX(-100%); text-align: right; }

  /* egységsáv */
  .scale.units { padding: 40px 0 36px; }
  .marker { position: absolute; top: 30px; bottom: 26px; width: 3px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); }
  .tag-commit { top: 0; transform: translateX(calc(-100% + 2px)); text-align: right; }
  .tag-goal { bottom: 0; right: 0; text-align: right; }

  .facts { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; font-size: clamp(1rem, 2vw, 1.25rem); }
  .facts b { font-weight: 700; }
  .facts span { color: var(--muted); }

  /* mérföldkövek */
  .ms-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 340px; overflow-y: auto; border-top: 1px solid var(--track); }
  .ms-list li {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 4px 16px; align-items: baseline;
    padding: 10px 4px; border-bottom: 1px solid var(--track); font-size: clamp(.95rem, 1.8vw, 1.1rem);
  }
  .ms-list li.latest { background: var(--card); }
  .ms-name { font-weight: 700; overflow-wrap: anywhere; }
  .ms-es { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .ms-total, .ms-date { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ms-empty { color: var(--muted); margin: 8px 0 0; }
  .status { color: var(--muted); font-size: .9rem; margin: 8px 0 0; min-height: 1.2em; }

  /* ablak */
  dialog { border: 1px solid var(--track); border-radius: 18px; padding: 0; background: var(--bg); color: var(--ink); width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(10, 15, 30, .55); }
  .dlg-body { padding: 24px; }
  .dlg-body h2 { margin: 0 0 16px; font-size: 1.4rem; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--muted); background: var(--card); color: var(--ink);
  }
  .dlg-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
  .btn { font: inherit; font-weight: 700; border-radius: 999px; padding: 11px 20px; cursor: pointer; border: 1px solid var(--muted); background: transparent; color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .dlg-note { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .dlg-error { color: #cc0066; font-weight: 600; min-height: 1.2em; margin: 0; }
  @media (prefers-color-scheme: dark) { .dlg-error { color: #ff99cc; } }

  @media (max-width: 520px) {
    .add-btn { font-size: .9rem; padding: 10px 16px; }
    .ms-list li { grid-template-columns: 1fr auto; }
    .ms-total, .ms-date { font-size: .85rem; }
  }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }


  .topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--track); }
  .topnav .in { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 20px; }
  .topnav .brand { font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap; font-size: 1.05rem; margin: 0; }
  .topnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .topnav ul::-webkit-scrollbar { display: none; }
  .topnav li a { display: block; padding: 8px 14px; border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 600;
                 font-size: .95rem; white-space: nowrap; }
  .topnav li a:hover { background: var(--track); }
  .topnav li a[aria-current="page"] { background: var(--accent); color: var(--on-accent, #fff); }
  .topnav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .topnav .brand { display: none; } .topnav .in { gap: 0; padding: 0 8px; } }

  .zm { position: relative; margin-left: auto; flex: none; }
  .zm > button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 0; cursor: pointer;
                 background: var(--card); color: var(--ink); font: inherit; font-weight: 700; font-size: .95rem; white-space: nowrap; }
  .zm > button:hover { filter: brightness(.96); }
  .zm > button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .zm .badge { background: var(--accent); color: var(--on-accent, #fff); border-radius: 999px; padding: 2px 9px; font-size: .82rem; }
  .zm .panel { position: absolute; right: 0; top: calc(100% + 10px); width: min(340px, calc(100vw - 16px)); background: var(--bg); color: var(--ink);
               border: 1px solid var(--track); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 8px 14px 12px; }
  .zm .panel[hidden] { display: none; }
  .zm .panel h3 { margin: 6px 0 4px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .zm .panel ol { list-style: none; margin: 0; padding: 0; }
  .zm .panel li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 9px 0; border-bottom: 1px solid var(--track); }
  .zm .panel li:last-child { border-bottom: 0; }
  .zm .panel .m { font-weight: 700; } .zm .panel .d { color: var(--muted); font-size: .88rem; grid-column: 1; }
  .zm .panel .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 700; }
  .zm .panel li.past { opacity: .5; } .zm .panel li.next .n { color: var(--accent); }
  @media (max-width: 640px) { .zm > button { padding: 8px 10px; } .zm .lbl { display: none; } }
</style>
</head>
<body>
<nav class="topnav" aria-label="Főmenü"><div class="in"><a class="brand" href="index.html">Csikós BL csapat</a><ul><li><a href="index.html">Kezdőlap</a></li><li><a href="negyedev.html" aria-current="page">Negyedéves cél</a></li><li><a href="verseny.html">Versenyállások</a></li><li><a href="cegbemutato.html">Cégbemutató</a></li><li><a href="https://docs.google.com/spreadsheets/d/1YKwZYWzi1nBNX3HQCDXUlKeovPqnMce0A4C4hnYFaHY/edit" target="_blank" rel="noopener">Pipeline ↗</a></li></ul></div></nav>
<button class="add-btn" id="add-btn" type="button">Szerződést köttöttem!</button>

<main>
  <p class="quarter" id="quarter"></p>
  <h1 class="number" id="number">0</h1>
  <p class="goal" id="goal-text"></p>

  <p class="cap" id="time-cap"></p>
  <div class="scale time" id="time-scale">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="time-bar">
      <div class="fill time" id="time-fill"></div>
    </div>
  </div>

  <p class="cap">Egység</p>
  <div class="scale units">
    <div class="tag tag-commit" id="tag-commit"></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar">
      <div class="fill units" id="fill"></div>
    </div>
    <div class="marker" id="marker"></div>
    <div class="tag tag-goal" id="tag-goal"></div>
  </div>

  <div class="facts">
    <div id="line-commit"></div>
    <div id="line-goal"></div>
    <div id="line-days"></div>
    <div id="line-pace"></div>
  </div>

  <p class="cap">Mérföldkövek</p>
  <ol class="ms-list" id="ms-list"></ol>
  <p class="ms-empty" id="ms-empty">Még nincs rögzített szerződés.</p>
  <p class="status" id="status" role="status"></p>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-body">
    <h2 id="dlg-title">Szerződést köttöttem!</h2>
    <p class="dlg-note" id="dlg-note" hidden>Teszt mód: a bejegyzés csak ezen a böngészőn látszik, amíg nincs adatbázis bekötve.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="f-es">Hány ES?</label>
        <input id="f-es" type="number" inputmode="numeric" min="1" max="100000" step="1" required>
      </div>
      <div class="field">
        <label for="f-name">Hogy hívnak?</label>
        <input id="f-name" type="text" maxlength="40" autocomplete="name" required>
      </div>
      <div class="field" id="pw-field">
        <label for="f-pw">Jelszó</label>
        <input id="f-pw" type="password" autocomplete="current-password" maxlength="100" required>
      </div>
      <p class="dlg-error" id="dlg-error" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn" id="cancel-btn">Mégse</button>
        <button type="submit" class="btn primary" id="save-btn">Mentés</button>
      </div>
    </form>
  </div>
</dialog>

<script>
  // ====== EZT A HÁROM SORT ÍRD ÁT ======
  var CURRENT = 0;        // kézi alapérték: az űrlapon rögzített szerződések ehhez adódnak hozzá
  var LABEL = "ES";       // a mértékegység felirata
  var API_URL = "https://script.google.com/macros/s/AKfycbwGuLkHaMIuSc5JN8NI6hobuxVQs0A7Hs5jGtwqfxW7o_ugImqJPsN5U8O2uxWIlrWfzA/exec";       // a Google Apps Script webalkalmazás címe (lásd az útmutatót)
  // =====================================
  var COMMIT = 11000;     // vállalás
  var GOAL = 12500;       // cél (az egységsáv vége)

  var nf = new Intl.NumberFormat("hu-HU");
  var now = new Date();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id) { return document.getElementById(id); }

  // A termelési hónap zárása a következő hónap első keddje.
  function firstTuesday(year, month) {
    var d = new Date(year, month, 1);
    var offset = (2 - d.getDay() + 7) % 7;
    return new Date(year, month, 1 + offset, 23, 59, 59);
  }
  var qEnd = null, q = 0, qYear = now.getFullYear();
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1 && !qEnd; y++) {
    for (var i = 0; i < 4; i++) {
      var close = firstTuesday(y, i * 3 + 3);
      if (close >= now) { qEnd = close; q = i; qYear = y; break; }
    }
  }
  // A negyedév kezdete az előző negyedév zárása (a negyedév első hónapjának első keddje).
  var qStart = firstTuesday(qYear, q * 3);
  var span = qEnd - qStart;
  var elapsed = Math.min(1, Math.max(0, (now - qStart) / span));
  var daysLeft = Math.max(0, Math.ceil((qEnd - now) / 86400000));
  var commitPct = COMMIT / GOAL * 100;

  var monthShort = ["jan.", "febr.", "márc.", "ápr.", "máj.", "jún.", "júl.", "aug.", "szept.", "okt.", "nov.", "dec."];
  function shortDate(d) { return monthShort[d.getMonth()] + " " + d.getDate() + "."; }

  /* ---- Állandó részek ---- */
  $("quarter").textContent = qYear + " " + (q + 1) + ". negyedév";
  $("goal-text").innerHTML = "<span>vállalás</span> " + nf.format(COMMIT) + " " + LABEL +
    ", <span>cél</span> " + nf.format(GOAL) + " " + LABEL;

  $("time-cap").textContent = "Idő (" + shortDate(qStart) + " – " + shortDate(qEnd) + ")";
  var ticks = "";
  for (var k = 0; k < 3; k++) {
    var m = q * 3 + k;
    var cd = firstTuesday(qYear, m + 1);
    var pos = Math.min(1, Math.max(0, (cd - qStart) / span));
    var expected = Math.round(COMMIT * pos / 10) * 10;
    var last = pos > 0.97 ? " last" : "";
    var done = cd < now ? ' style="opacity:.55"' : "";
    ticks += '<div class="tick' + last + '" style="left:' + (pos * 100) + '%"' + done + '></div>' +
      '<div class="tag tick-label' + last + '" style="left:' + (pos * 100) + '%"' + done + '>' +
      '<b>' + monthShort[m] + ' zárás</b><br><span>' + shortDate(cd) + '</span><br>' +
      '<span>kb.</span> <b>' + nf.format(expected) + ' ' + LABEL + '</b></div>';
  }
  $("time-scale").insertAdjacentHTML("beforeend", ticks);
  $("time-bar").setAttribute("aria-valuenow", Math.round(elapsed * 100));
  $("time-fill").style.width = (elapsed * 100) + "%";

  $("marker").style.left = commitPct + "%";
  $("tag-commit").style.left = commitPct + "%";
  $("tag-commit").innerHTML = "<b>" + nf.format(COMMIT) + "</b> <span>vállalás</span>";
  $("tag-goal").innerHTML = "<b>" + nf.format(GOAL) + "</b> <span>cél</span>";

  /* ---- A számtól függő részek ---- */
  function renderTotals(total) {
    var leftCommit = Math.max(0, COMMIT - total);
    var leftGoal = Math.max(0, GOAL - total);
    var pct = Math.min(100, total / GOAL * 100);
    $("fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(pct));

    $("line-commit").innerHTML = leftCommit > 0
      ? "<span>A vállalásig hátravan:</span> <b>" + nf.format(leftCommit) + " " + LABEL + "</b>"
      : "<b>A vállalás teljesítve</b>";
    $("line-goal").innerHTML = leftGoal > 0
      ? "<span>A célig hátravan:</span> <b>" + nf.format(leftGoal) + " " + LABEL + "</b>"
      : "<b>A cél teljesítve</b>";
    $("line-days").innerHTML = "<b>" + daysLeft + "</b> <span>nap van hátra</span>";
    if (daysLeft > 0 && leftGoal > 0) {
      $("line-pace").innerHTML = leftCommit > 0
        ? "<span>naponta</span> <b>" + nf.format(Math.ceil(leftCommit / daysLeft)) + " " + LABEL + "</b> <span>a vállalás teljesítéséhez.</span>"
        : "<span>naponta</span> <b>" + nf.format(Math.ceil(leftGoal / daysLeft)) + " " + LABEL + "</b> <span>a cél teljesítéséhez.</span>";
    } else {
      $("line-pace").textContent = "";
    }
  }

  var numEl = $("number");
  var shown = 0, animToken = 0;
  function animateNumber(to) {
    var from = shown, token = ++animToken;
    if (reduce || from === to) { shown = to; numEl.textContent = nf.format(to); return; }
    var t0 = null, dur = 900;
    requestAnimationFrame(function step(t) {
      if (token !== animToken) return;
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / dur);
      shown = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      numEl.textContent = nf.format(shown);
      if (p < 1) requestAnimationFrame(step);
    });
  }

  /* ---- Szerződések (mérföldkövek) ---- */
  function normalize(items) {
    return (items || []).map(function (i) {
      return { t: new Date(i.t), name: String(i.name || "").slice(0, 40), es: Math.floor(Number(i.es)) };
    }).filter(function (e) {
      return e.name && e.es > 0 && !isNaN(e.t) && e.t > qStart && e.t <= qEnd;
    }).sort(function (a, b) { return a.t - b.t; });
  }

  function renderMilestones(list) {
    var ol = $("ms-list");
    ol.textContent = "";
    var bar = $("bar");
    Array.prototype.slice.call(bar.querySelectorAll(".ms-tick")).forEach(function (n) { n.remove(); });

    list.forEach(function (e) {
      var tick = document.createElement("div");
      tick.className = "ms-tick";
      tick.style.left = Math.min(100, e.cum / GOAL * 100) + "%";
      tick.title = e.name + " +" + e.es + " " + LABEL;
      bar.appendChild(tick);
    });

    list.slice().reverse().forEach(function (e, idx) {
      var li = document.createElement("li");
      if (idx === 0) li.className = "latest";
      function cell(cls, text) { var s = document.createElement("span"); s.className = cls; s.textContent = text; li.appendChild(s); }
      cell("ms-name", e.name);
      cell("ms-es", "+" + nf.format(e.es) + " " + LABEL);
      cell("ms-total", "→ " + nf.format(e.cum) + " " + LABEL);
      cell("ms-date", shortDate(e.t));
      ol.appendChild(li);
    });
    $("ms-empty").hidden = list.length > 0;
  }

  function refresh(items) {
    var list = normalize(items);
    var run = CURRENT;
    list.forEach(function (e) { run += e.es; e.cum = run; });
    renderTotals(run);
    animateNumber(run);
    renderMilestones(list);
  }

  /* ---- Tárolás: Google Apps Script, vagy teszt módban a böngésző ---- */
  var LOCAL_KEY = "csikoscsapat-szerzodesek";
  function readLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; } }
  function writeLocal(items) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch (e) {} }

  function loadEntries() {
    if (!API_URL) { refresh(readLocal()); return; }
    fetch(API_URL + (API_URL.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) { $("status").textContent = ""; refresh(d.items); })
      .catch(function () { $("status").textContent = "Az adatok betöltése most nem sikerült."; });
  }

  function saveEntry(name, es, pw) {
    if (!API_URL) {
      var items = readLocal();
      items.push({ t: new Date().toISOString(), name: name, es: es });
      writeLocal(items);
      return Promise.resolve();
    }
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name: name, es: es, password: pw })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { var se = new Error(d.error || "Mentési hiba"); se.fromServer = true; throw se; }
    }).catch(function (err) {
      if (err.fromServer) throw err;
      // Lehet, hogy a mentés sikerült, csak a választ nem sikerült kiolvasni: ellenőrizzük a listát.
      return new Promise(function (res) { setTimeout(res, 1500); })
        .then(function () { return fetch(API_URL + (API_URL.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now()); })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var ok = (d.items || []).some(function (i) {
            return i.name === name && Number(i.es) === es && Date.now() - new Date(i.t) < 120000;
          });
          if (!ok) throw err;
        });
    });
  }

  /* ---- Ablak ---- */
  var dlg = $("dlg"), form = $("form");
  $("dlg-note").hidden = !!API_URL;
  $("pw-field").hidden = !API_URL;

  $("add-btn").addEventListener("click", function () {
    form.reset();
    $("dlg-error").textContent = "";
    $("save-btn").disabled = false;
    dlg.showModal();
    $("f-es").focus();
  });
  $("cancel-btn").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var es = Number($("f-es").value);
    var name = $("f-name").value.trim().slice(0, 40);
    var err = $("dlg-error");
    if (!(es >= 1 && es <= 100000) || Math.floor(es) !== es) { err.textContent = "Adj meg egy egész számot 1 és 100 000 között."; $("f-es").focus(); return; }
    if (!name) { err.textContent = "Írd be a neved."; $("f-name").focus(); return; }
    var pw = $("f-pw").value;
    if (API_URL && !pw) { err.textContent = "Add meg a jelszót."; $("f-pw").focus(); return; }
    err.textContent = "";
    $("save-btn").disabled = true;
    saveEntry(name, es, pw).then(function () {
      dlg.close();
      loadEntries();
    }).catch(function (e2) {
      err.textContent = (e2 && e2.fromServer) ? e2.message : "Nem sikerült menteni. Próbáld újra egy perc múlva.";
      $("save-btn").disabled = false;
    });
  });

  /* ---- Indulás ---- */
  renderTotals(CURRENT);
  loadEntries();
  if (API_URL) {
    setInterval(loadEntries, 60000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) loadEntries(); });
  }
</script>
<script>
  (function () {
    var host = document.querySelector(".topnav .in"); if (!host) return;
    var now = new Date();
    function ft(y, m) { var d = new Date(y, m, 1); return new Date(y, m, 1 + ((2 - d.getDay() + 7) % 7), 23, 59, 59); }
    var adj = ["januári","februári","márciusi","áprilisi","májusi","júniusi","júliusi","augusztusi","szeptemberi","októberi","novemberi","decemberi"];
    var all = [];
    for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) for (var m = 0; m < 12; m++) {
      var pm = (m + 11) % 12; all.push({ date: ft(y, m), month: pm, quarter: pm % 3 === 2 });
    }
    all.sort(function (a, b) { return a.date - b.date; });
    var ni = 0; while (ni < all.length && all[ni].date < now) ni++;
    function days(d) { return Math.max(0, Math.ceil((d - now) / 86400000)); }
    function same(a, b) { return a.toDateString() === b.toDateString(); }
    function word(d) { return same(d, now) ? "ma" : days(d) === 1 ? "holnap" : days(d) + " nap"; }
    function e(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; }
    var wrap = e("div", "zm"), btn = e("button"), panel = e("div", "panel");
    btn.type = "button"; btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-haspopup", "true");
    btn.appendChild(e("span", "lbl", "Zárások")); btn.appendChild(e("span", "badge", word(all[ni].date))); btn.appendChild(e("span", "", "▾"));
    btn.title = "Következő zárás: " + all[ni].date.toLocaleDateString("hu-HU", { month: "long", day: "numeric" });
    panel.hidden = true; panel.appendChild(e("h3", "", "Zárások"));
    var ol = e("ol");
    all.slice(Math.max(0, ni - 1), ni + 4).forEach(function (c, i) {
      var past = c.date < now, li = e("li", (past ? "past " : "") + (c === all[ni] ? "next" : ""));
      li.appendChild(e("span", "m", adj[c.month].charAt(0).toUpperCase() + adj[c.month].slice(1) + " zárás" + (c.quarter ? " (negyedéves)" : "")));
      li.appendChild(e("span", "d", c.date.toLocaleDateString("hu-HU", { year: "numeric", month: "long", day: "numeric" }) + ", kedd"));
      li.appendChild(e("span", "n", past ? "lezárva" : word(c.date)));
      ol.appendChild(li);
    });
    panel.appendChild(ol); wrap.appendChild(btn); wrap.appendChild(panel); host.appendChild(wrap);
    function set(open) { panel.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false"); }
    btn.addEventListener("click", function (ev) { ev.stopPropagation(); set(panel.hidden); });
    document.addEventListener("click", function (ev) { if (!wrap.contains(ev.target)) set(false); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") set(false); });
    var a = document.querySelector('.topnav [aria-current="page"]'); if (a && a.scrollIntoView) { try { a.scrollIntoView({ inline: "center", block: "nearest" }); } catch (x) {} }
  })();
</script>
