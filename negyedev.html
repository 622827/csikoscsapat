<style>
  html.csklock body > *:not(#csk-gate) { visibility: hidden !important; }
  html.csklock body { overflow: hidden; }
  #csk-gate { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--bg, #fff); color: var(--ink, #003366); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; visibility: visible; }
  #csk-gate form { width: 100%; max-width: 360px; }
  #csk-gate h1 { font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 8px; }
  #csk-gate p { color: var(--muted, #336699); margin: 0 0 22px; }
  #csk-gate input { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--track, #e5e5e5); background: var(--card, #e5e5e5); color: inherit; }
  #csk-gate input:focus { outline: 3px solid var(--accent, #003366); outline-offset: 2px; }
  #csk-gate button { width: 100%; margin-top: 12px; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 14px; border: 0; border-radius: 12px; cursor: pointer; background: var(--accent, #003366); color: var(--on-accent, #fff); }
  #csk-gate button[disabled] { opacity: .6; cursor: wait; }
  #csk-gate .err { color: var(--hot, #cc0066); min-height: 1.4em; margin: 10px 0 0; font-size: .95rem; }

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbxQ-h6UZiyIp6StErApri4EaGcIYmYhCKjX5ufz_MnD3MuDqYe1tGlT330PKHjaq5WaoQ/exec";
  var K = "csk_token", tok = "", root = document.documentElement, of = window.fetch.bind(window);
  function ckGet() { var m = document.cookie.match(/(?:^|; )csk_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ""; }
  function ckSet(v) {
    var h = location.hostname.replace(/^www\./, ""), dom = /^[\d.]+$|^localhost$/.test(h) || !h ? "" : "; domain=." + h;
    document.cookie = "csk_token=" + (v ? encodeURIComponent(v) : "") + dom + "; path=/; max-age=" + (v ? 31536000 : 0) + "; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : "");
  }
  try { tok = localStorage.getItem(K) || ""; } catch (e) {}
  if (!tok) tok = ckGet();
  if (tok) { try { localStorage.setItem(K, tok); } catch (e) {} ckSet(tok); }
  if (!tok) root.classList.add("csklock");

  window.fetch = function (u, o) {
    var s = typeof u === "string" ? u : (u && u.url) || "";
    if (s.indexOf("AKfycbxQ-h6UZiyI") < 0 || s.indexOf("login=") > -1) return of(u, o);
    s += (s.indexOf("?") > -1 ? "&" : "?") + "t=" + encodeURIComponent(tok);
    return of(s, o).then(function (r) {
      r.clone().json().then(function (d) { if (d && d.error === "auth") lock(); }).catch(function () {});
      return r;
    });
  };

  function lock() {
    try { localStorage.removeItem(K); } catch (e) {} ckSet("");
    tok = ""; root.classList.add("csklock"); build();
  }
  function build() {
    if (document.getElementById("csk-gate")) return;
    if (!document.body) { document.addEventListener("DOMContentLoaded", build); return; }
    var g = document.createElement("div"); g.id = "csk-gate";
    g.innerHTML = '<form autocomplete="on"><h1>Csikós csapat</h1><p>Add meg a jelszót a belépéshez.</p>' +
      '<input type="password" id="csk-pw" placeholder="Jelszó" autocomplete="current-password" autofocus>' +

    setTimeout(function () { pw.focus(); }, 50);

      ev.preventDefault(); if (!pw.value) return;

<script>
  // ====== BEÁLLÍTÁSOK ======
  var PREVIOUS = 0;       // az előző (lezárt) hónapok ES-e, kézzel megadva; az aktuális hónapot a táblázat adja
  var LABEL = "ES";       // a mértékegység felirata
  var TOTAL_URL = "https://script.google.com/macros/s/AKfycbxQ-h6UZiyIp6StErApri4EaGcIYmYhCKjX5ufz_MnD3MuDqYe1tGlT330PKHjaq5WaoQ/exec";   // a verseny-szkript címe (a pipeline-táblázatot olvassa)
  // =====================================
  var COMMIT = 11000;     // vállalás
  var GOAL = 12500;       // cél (az egységsáv vége)

  var nf = new Intl.NumberFormat("hu-HU");
  var now = new Date();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id) { return document.getElementById(id); }

  // A termelési hónap zárása a következő hónap első keddje.
  function firstTuesday(year, month) {
    var d = new Date(year, month, 1);
    var offset = (2 - d.getDay() + 7) % 7;
    return new Date(year, month, 1 + offset, 23, 59, 59);
  }
  var qEnd = null, q = 0, qYear = now.getFullYear();
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1 && !qEnd; y++) {
    for (var i = 0; i < 4; i++) {
      var close = firstTuesday(y, i * 3 + 3);
      if (close >= now) { qEnd = close; q = i; qYear = y; break; }
    }
  }
  // A negyedév kezdete az előző negyedév zárása (a negyedév első hónapjának első keddje).
  var qStart = firstTuesday(qYear, q * 3);
  var span = qEnd - qStart;
  var elapsed = Math.min(1, Math.max(0, (now - qStart) / span));
  var daysLeft = Math.max(0, Math.ceil((qEnd - now) / 86400000));
  var commitPct = COMMIT / GOAL * 100;

  var monthShort = ["jan.", "febr.", "márc.", "ápr.", "máj.", "jún.", "júl.", "aug.", "szept.", "okt.", "nov.", "dec."];
  function shortDate(d) { return monthShort[d.getMonth()] + " " + d.getDate() + "."; }

  /* ---- Állandó részek ---- */
  $("quarter").textContent = qYear + " " + (q + 1) + ". negyedév";
  $("goal-text").innerHTML = "<span>vállalás</span> " + nf.format(COMMIT) + " " + LABEL +
    ", <span>cél</span> " + nf.format(GOAL) + " " + LABEL;

  $("time-cap").textContent = "Idő (" + shortDate(qStart) + " – " + shortDate(qEnd) + ")";
  var ticks = "";
  for (var k = 0; k < 3; k++) {
    var m = q * 3 + k;
    var cd = firstTuesday(qYear, m + 1);
    var pos = Math.min(1, Math.max(0, (cd - qStart) / span));
    var expected = Math.round(COMMIT * pos / 10) * 10;
    var last = pos > 0.97 ? " last" : "";
    var done = cd < now ? ' style="opacity:.55"' : "";
    ticks += '<div class="tick' + last + '" style="left:' + (pos * 100) + '%"' + done + '></div>' +
      '<div class="tag tick-label' + last + '" style="left:' + (pos * 100) + '%"' + done + '>' +
      '<b>' + monthShort[m] + ' zárás</b><br><span>' + shortDate(cd) + '</span><br>' +
      '<span>kb.</span> <b>' + nf.format(expected) + ' ' + LABEL + '</b></div>';
  }
  $("time-scale").insertAdjacentHTML("beforeend", ticks);
  $("time-bar").setAttribute("aria-valuenow", Math.round(elapsed * 100));
  $("time-fill").style.width = (elapsed * 100) + "%";

  $("marker").style.left = commitPct + "%";
  $("tag-commit").style.left = commitPct + "%";
  $("tag-commit").innerHTML = "<b>" + nf.format(COMMIT) + "</b> <span>vállalás</span>";
  $("tag-goal").innerHTML = "<b>" + nf.format(GOAL) + "</b> <span>cél</span>";

  /* ---- A számtól függő részek ---- */
  function renderTotals(total) {
    var leftCommit = Math.max(0, COMMIT - total);
    var leftGoal = Math.max(0, GOAL - total);
    var pct = Math.min(100, total / GOAL * 100);
    $("fill").style.width = pct + "%";
    var tc = lastTeams && lastTeams.csikos ? lastTeams.csikos.done : 0, tf = lastTeams && lastTeams.farkas ? lastTeams.farkas.done : 0;
    var oc = lastTeams && lastTeams.csikos ? Math.max(0, lastTeams.csikos.outlook - lastTeams.csikos.done) : 0,
        of = lastTeams && lastTeams.farkas ? Math.max(0, lastTeams.farkas.outlook - lastTeams.farkas.done) : 0;
    var room = Math.max(0, 100 - pct), ow = Math.min(room, (oc + of) / GOAL * 100), osc = (oc + of) > 0 ? ow / (oc + of) : 0;
    $("ol-gap").style.width = pct + "%";
    $("ol-csk").style.width = (oc * osc) + "%"; $("ol-frk").style.width = (of * osc) + "%";
    if (tc + tf > 0) { $("fill").style.background = "none"; $("sp-csk").style.width = (tc / (tc + tf) * 100) + "%"; $("sp-frk").style.width = (tf / (tc + tf) * 100) + "%"; }
    else { $("fill").style.background = ""; $("sp-csk").style.width = "0"; $("sp-frk").style.width = "0"; }
    $("bar").setAttribute("aria-valuenow", Math.round(pct));

    $("line-commit").innerHTML = leftCommit > 0
      ? "<span>A vállalásig hátravan:</span> <b>" + nf.format(leftCommit) + " " + LABEL + "</b>"
      : "<b>A vállalás teljesítve</b>";
    $("line-goal").innerHTML = leftGoal > 0
      ? "<span>A célig hátravan:</span> <b>" + nf.format(leftGoal) + " " + LABEL + "</b>"
      : "<b>A cél teljesítve</b>";
    $("line-days").innerHTML = "<b>" + daysLeft + "</b> <span>nap van hátra</span>";
    if (daysLeft > 0 && leftGoal > 0) {
      $("line-pace").innerHTML = leftCommit > 0
        ? "<span>naponta</span> <b>" + nf.format(Math.ceil(leftCommit / daysLeft)) + " " + LABEL + "</b> <span>a vállalás teljesítéséhez.</span>"
        : "<span>naponta</span> <b>" + nf.format(Math.ceil(leftGoal / daysLeft)) + " " + LABEL + "</b> <span>a cél teljesítéséhez.</span>";
    } else {
      $("line-pace").textContent = "";
    }
  }

  var numEl = $("number");
  var shown = 0, animToken = 0;
  function animateNumber(to) {
    var from = shown, token = ++animToken;
    if (reduce || from === to) { shown = to; numEl.textContent = nf.format(to); return; }
    var t0 = null, dur = 900;
    requestAnimationFrame(function step(t) {
      if (token !== animToken) return;
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / dur);
      shown = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      numEl.textContent = nf.format(shown);
      if (p < 1) requestAnimationFrame(step);
    });
  }

  /* ---- Az érték: az előző hónapok kézzel megadva + az aktuális hónap a pipeline-táblázatból ----
     Az aktuális hónap = az első negyedéves hónap, amelynek a zárása még nem járt le.
     Az aktuális hónapból csak a "100% Leadva" és a "Befizetett" ES számít (az elszámolt és a szerződés kész nem). */
  var MONTH_NAME = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
  function closeOf(m) { return firstTuesday(Math.floor(m / 100), m % 100); }   // m: ÉÉÉÉHH; a következő hónap első kedd

  var lastTeams = null;
  function renderTeams(t) {
    lastTeams = t || null;
    if (!t) return;
    var defs = [["csikos", "Csikós csapat"], ["farkas", "Farkas csapat"]], any = false;
    defs.forEach(function (d) {
      var x = t[d[0]], el = $("t-" + d[0]);
      if (!x) { el.innerHTML = ""; return; }
      any = true;
      var max = Math.max(x.goal, x.outlook, x.done, 1);
      el.innerHTML = '<div class="head"><span class="nm">' + d[1] + '</span><span class="val">' + nf.format(x.done) + ' / ' + nf.format(x.goal) + ' ' + LABEL + '</span></div>' +
        '<div class="bar"><div class="seg out" style="width:' + Math.min(100, x.outlook / max * 100) + '%"></div><div class="seg" style="width:' + Math.min(100, x.done / max * 100) + '%"></div></div>' +
        '<div class="sub">Kilátás: ' + nf.format(x.outlook) + ' · Hiányzik a célból: ' + nf.format(x.missing) + '</div>';
    });
    $("teams").hidden = !any;
  }

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var CSK_MEMBERS = ["csikos mate", "toth oszkar", "szilagyi gyongyi", "gulyas anna"];
  function plain(t) { return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
  var PP_OPEN = {}, MONTH_HU = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
  function ppProc(p) { var q = plain(p); if (q.indexOf("100") > -1 && q.indexOf("leadva") > -1) return 0; if (q.indexOf("elszamolt") > -1) return 1; if (q.indexOf("szerzodes") > -1) return 2; if (q.indexOf("ta igeny") > -1) return 3; if (q.indexOf("befizet") > -1) return 4; if (q.indexOf("ugyintez") > -1) return 5; if (q.indexOf("el igeny") > -1) return 6; if (q.indexOf("igeny") > -1) return 7; return 9; }
  function isLead(k) { var p = plain(k); return p.indexOf("100") > -1 && p.indexOf("leadva") > -1; }
  function ppCol(k) { var p = plain(k);
    if (isLead(k)) return "#0c9a55";
    if (p.indexOf("elszamolt") > -1) return "#1f7a4a"; if (p.indexOf("befizet") > -1) return "#2e9e5b";
    if (p.indexOf("szerzodes") > -1) return "#3fb8af"; if (p.indexOf("ugyintez") > -1) return "#f2b705";
    if (p.indexOf("ta igeny") > -1) return "#6f8fd6"; if (p.indexOf("el igeny") > -1) return "#a3b1ca"; if (p.indexOf("igeny") > -1) return "#8da2c0";
    return "#8a8f98"; }
  function cn(x, k) { var c = k.replace(/[^\p{L}\p{N}% ]+/gu, "").replace(/\s+/g, " ").trim() || k; if (plain(x.name) === "csikos mate" && plain(c).indexOf("ugyintez") > -1) return "TA igény"; return c; }
  function renderPeople(list, months) {
    var box = $("people-list"), L = (list || []).filter(function (x) { return x && x.name; });
    if (!L.length) { $("people").hidden = true; return; }
    L.sort(function (a, b) { return (b.total - a.total) || ((b.outlook || 0) - (a.outlook || 0)); });
    var max = 1500, MARKS = [150, 300, 500, 1000], hasProc = L.some(function (x) { return x.proc; });
    $("pp-axis").innerHTML = MARKS.map(function (m, i) { return '<span class="ax" style="left:' + (m / max * 100) + '%">' + nf.format(m) + '<span class="u"> ES</span></span>'; }).join("");
    var lines = MARKS.map(function (m) { return '<i class="mk" style="left:' + (m / max * 100) + '%"></i>'; }).join("");
    var seen = {}; L.forEach(function (x) { Object.keys(x.proc || {}).forEach(function (m) { Object.keys(x.proc[m] || {}).forEach(function (k) { var c = cn(x, k); if (x.proc[m][k] > 0 && !Object.keys(seen).some(function (q) { return plain(q) === plain(c); })) seen[c] = 1; }); }); });
    var lgk = Object.keys(seen).sort(function (a, b) { return ppProc(a) - ppProc(b); }); 
    var legend = lgk.length ? '<div class="pp-lg pp-top">' + lgk.map(function (k) { return '<span><em' + (isLead(k) || plain(k).indexOf('elszamolt') > -1 ? '' : ' class="f"') + ' style="background:' + ppCol(k) + '"></em>' + esc(k) + '</span>'; }).join("") + '</div>' : "";
    box.innerHTML = legend + L.map(function (x, n) {
      var done = x.total || 0, out = Math.max(x.outlook || 0, done), key = plain(x.name);
      var tot = {}; Object.keys(x.proc || {}).forEach(function (m) { var r = x.proc[m] || {}; Object.keys(r).forEach(function (k) { var c = cn(x, k); tot[c] = (tot[c] || 0) + r[k]; }); });
      var isEl = function (k) { return plain(k).indexOf("elszamolt") > -1; };
      var oth = Object.keys(tot).filter(function (k) { return !isLead(k) && !isEl(k) && tot[k] > 0; }).sort(function (a, b) { return ppProc(a) - ppProc(b); }), sum = 0, elSum = 0;
      Object.keys(tot).forEach(function (k) { if (isEl(k)) elSum += tot[k]; });
      var sgs = '<i style="width:' + Math.min(100, done / max * 100) + '%;background:' + ppCol("100% leadva") + '" data-t="100% leadva: ' + nf.format(done) + ' ' + LABEL + '"></i>';
      if (elSum > 0) sgs += '<i style="width:' + Math.min(100, elSum / max * 100) + '%;background:' + ppCol("elszámolt") + '" data-t="Elszámolt: ' + nf.format(elSum) + ' ' + LABEL + '"></i>';
      var rest = ''; oth.forEach(function (k) { sum += tot[k]; rest += '<i class="f" style="flex:' + tot[k] + ' 1 0;background:' + ppCol(k) + '" data-t="' + esc(k) + ': ' + nf.format(tot[k]) + ' ' + LABEL + '"></i>'; });
      if (out - done - elSum - sum > 0.5) rest += '<i class="f" style="flex:' + (out - done - elSum - sum) + ' 1 0;background:#8a8f98" data-t="Egyéb"></i>';
      if (rest) sgs += '<span class="rest">' + rest + '</span>';
      var det = (months || []).map(function (m) {
        var raw = (x.proc || {})[m] || {}, pr = {};
        Object.keys(raw).forEach(function (k) { var c = cn(x, k); pr[c] = (pr[c] || 0) + raw[k]; });
        var names = Object.keys(pr).filter(function (k) { return pr[k] > 0; }).sort(function (a, b) { return ppProc(a) - ppProc(b); });
        var mt = (x.mt || {})[m] || 0;
        return '<div class="pp-m"><div class="mn">' + MONTH_HU[(m % 100) - 1].replace(/^./, function (c) { return c.toUpperCase(); }) + '<small>' + nf.format(mt) + ' ' + LABEL + '</small></div><div class="bx">' +
          (names.length ? '<div class="pp-sb" role="img" aria-label="Egységek folyamat szerint">' + names.map(function (k) { return '<i' + (isLead(k) || plain(k).indexOf('elszamolt') > -1 ? '' : ' class="f"') + ' style="flex:' + pr[k] + ' 1 0;background:' + ppCol(k) + '" data-t="' + esc(k) + ': ' + nf.format(pr[k]) + ' ' + LABEL + '"></i>'; }).join("") + '</div>' +
            '<div class="pp-lg">' + names.map(function (k) { return '<span><em' + (isLead(k) || plain(k).indexOf('elszamolt') > -1 ? '' : ' class="f"') + ' style="background:' + ppCol(k) + '"></em>' + esc(k) + ' <b>' + nf.format(pr[k]) + '</b></span>'; }).join("") + '</div>'
            : '<span class="no">' + (hasProc ? 'Nincs tétel ebben a hónapban.' : 'A folyamat szerinti bontás még nem érhető el.') + '</span>') + '</div></div>';
      }).join("");
      return '<div class="team pp' + (CSK_MEMBERS.indexOf(key) > -1 ? ' csk' : '') + (PP_OPEN[key] ? ' open' : '') + '" data-k="' + esc(key) + '"><button type="button" class="pp-hd" aria-expanded="' + (PP_OPEN[key] ? 'true' : 'false') + '"><div class="head"><span class="nm">' + esc(x.name) + '</span><span class="val">' + nf.format(done) + ' ' + LABEL + '</span></div>' +
        '<div class="bar"><div class="sgs">' + sgs + '</div>' + lines + '</div>' +
        '<div class="sub">Kilátás: ' + nf.format(x.outlook || 0) + '</div></button><div class="pp-dt"><div>' + det + '</div></div></div>';
    }).join("");
    $("people").hidden = false;
  }
  (function () {
    var tt = document.createElement("div"); tt.className = "csk-tt"; document.body.appendChild(tt);
    function show(e) { var t = e.target.closest && e.target.closest("[data-t]"); if (!t) { tt.classList.remove("on"); return; }
      tt.textContent = t.getAttribute("data-t"); tt.classList.add("on");
      var w = tt.offsetWidth, x = Math.min(Math.max(8, e.clientX - w / 2), window.innerWidth - w - 8); tt.style.left = x + "px"; tt.style.top = Math.max(8, e.clientY - 44) + "px"; }
    document.addEventListener("mousemove", show); document.addEventListener("mouseover", show);
    document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("[data-t]")) { show(e); clearTimeout(tt._h); tt._h = setTimeout(function () { tt.classList.remove("on"); }, 2200); } });
    document.addEventListener("scroll", function () { tt.classList.remove("on"); }, true);
  })();
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest(".team.pp .pp-hd"); if (!b) return;
    var t = b.parentNode, o = !t.classList.contains("open"); t.classList.toggle("open", o); b.setAttribute("aria-expanded", o ? "true" : "false"); PP_OPEN[t.getAttribute("data-k")] = o;
  });

  function applyData(d) {
    renderTeams(d.teams);
    renderPeople(d.people, d.months);
    var t = d.teams || {}, total;
    if (t.csikos && t.farkas) {
      total = t.csikos.done + t.farkas.done;   // a dicsőségfal két csapatának teljesítménye
      $("basis").innerHTML = "<b>Alap:</b> a Csikós és a Farkas csapat teljesítménye a dicsőségfalról (" + nf.format(t.csikos.done) + " + " + nf.format(t.farkas.done) + " " + LABEL + ")";
    } else {
      var by = (d.counter || {}), months = (d.months || Object.keys(by).map(Number)).slice().sort();
      var cur = months[months.length - 1];
      for (var i = 0; i < months.length; i++) { if (closeOf(months[i]) >= now) { cur = months[i]; break; } }
      var c = by[cur] || { settled: 0, pending: 0 };
      total = PREVIOUS + c.pending;
      $("basis").innerHTML = "A dicsőségfal adata nem érhető el, ezért a pipeline-lapokból számolt érték látszik.";
    }
    renderTotals(total);
    animateNumber(total);
    $("status").textContent = "";
  }

  function load() {
    if (!TOTAL_URL) { $("status").textContent = "Az adatforrás még nincs bekötve."; return; }
    if (!$("basis").innerHTML) $("status").textContent = "Az adatok betöltése… Az első betöltés akár fél percig is tarthat.";
    document.body.classList.add("loading");
    var ctl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 90000) : null;
    fetch(TOTAL_URL + (TOTAL_URL.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now(), ctl ? { signal: ctl.signal } : undefined)
      .then(function (r) { if (timer) clearTimeout(timer); return r.json(); })
      .then(function (d) {
        document.body.classList.remove("loading");
        if (d.error) throw new Error(d.error);
        if (!d.counter) throw new Error("a szkript még nem a legújabb verzió (nincs benne counter adat)");
        try { localStorage.setItem("nev_cache_v1", JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
        applyData(d);
      })
      .catch(function (e) {
        document.body.classList.remove("loading");
        if (timer) clearTimeout(timer);
        if ($("basis").innerHTML) $("status").textContent = "";
        if (!$("basis").innerHTML) $("status").textContent = "Az adatok betöltése most nem sikerült" + (e && e.message ? ": " + e.message : "") + ". Frissítsd az oldalt egy perc múlva.";
      });
  }

  /* ---- Indulás ---- */
  renderTotals(0);
  /* gyorsítótár: az utoljára látott adat azonnal megjelenik, a friss betöltés közben frissül */
  try {
    var cc = JSON.parse(localStorage.getItem("nev_cache_v1") || "null");
    if (cc && cc.d && cc.d.counter && Date.now() - cc.t < 7 * 86400000) { applyData(cc.d); $("status").textContent = "Frissítés…"; }
  } catch (e) {}
  load();
  setInterval(load, 300000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
</script>
<script>
  (function () {
    var host = document.querySelector(".topnav .in"); if (!host) return;
    function e(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; }
    var LINKS = [
      { name: "Csikós Pipeline", sub: "Google Táblázat", url: "https://docs.google.com/spreadsheets/d/1YKwZYWzi1nBNX3HQCDXUlKeovPqnMce0A4C4hnYFaHY/edit" },
      { name: "Heti Admin", sub: "Google Táblázat", url: "https://docs.google.com/spreadsheets/d/17_kPAR_QCWTYETDD5u8jUmpAYD-0XQzG/edit?gid=336308861#gid=336308861" },
      { name: "Hitelspecialista Trello", sub: "Trello board", url: "https://trello.com/b/PXzC7js9/csikos-mate-leadek" },
      { name: "Szakmai szombat oktatások", sub: "Drive mappa", url: "https://drive.google.com/drive/folders/1M3JiElcC3CJIbYqwtWw8dcOIcv1-iqQ8?usp=sharing" },
      { name: "Szombati elemző oktatások", sub: "Drive mappa", url: "https://drive.google.com/drive/folders/1GD997baQ4Zik4BM8OBn9A_PL_xIDRqu1?usp=sharing" },
      { name: "Webshop", sub: "Rendelés (jelszóval)", url: "webshop.html" }
    ];
    var wrap = e("div", "zm dv"), btn = e("button"), panel = e("div", "panel");
    btn.type = "button"; btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-haspopup", "true");
    btn.appendChild(e("span", "", "Hasznos linkek")); btn.appendChild(e("span", "", "▾"));
    panel.hidden = true; panel.appendChild(e("h3", "", "Hasznos linkek"));
    LINKS.forEach(function (l) {
      var a = e("a"); a.href = l.url; a.target = "_blank"; a.rel = "noopener";
      a.appendChild(e("span", "m", l.name)); a.appendChild(e("span", "d", l.sub)); a.appendChild(e("span", "go", "↗"));
      panel.appendChild(a);
    });
    wrap.appendChild(btn); wrap.appendChild(panel);
    var z = host.querySelector(".zm"); if (z) host.insertBefore(wrap, z); else host.appendChild(wrap);
    function set(open) { panel.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false"); }
    btn.addEventListener("click", function (ev) { ev.stopPropagation(); set(panel.hidden); });
    document.addEventListener("click", function (ev) { if (!wrap.contains(ev.target)) set(false); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") set(false); });
  })();
</script>
<script src="anim.js?v=3" defer></script>
